[package]
name = "omni-qa"
description = "The QA harness of hugr-omni: real workloads against omni and the stdlib, reported as KPIs (PLAN §4.2)."
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace: the root `members` line is not in Q1's write-set. `qa/run` builds it into the root target dir.
[workspace]

[dependencies]
hugr-omni = { path = "../crates/hugr-omni" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The root workspace's lints, which a separate workspace cannot inherit.
[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
