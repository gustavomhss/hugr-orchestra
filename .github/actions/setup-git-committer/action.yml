name: "Setup Git Committer"
description: "Create an app token, or use the workflow token, and configure git user"
inputs:
  opencode-app-id:
    description: "OpenCode GitHub App ID"
    required: false
  opencode-app-secret:
    description: "OpenCode GitHub App private key"
    required: false
outputs:
  token:
    description: "GitHub token"
    value: ${{ steps.auth.outputs.token }}
  app-slug:
    description: "GitHub App slug or github-actions"
    value: ${{ steps.auth.outputs.app-slug }}
runs:
  using: "composite"
  steps:
    - name: Validate app credentials
      if: (inputs.opencode-app-id == '') != (inputs.opencode-app-secret == '')
      run: |
        echo "Both opencode-app-id and opencode-app-secret must be set together"
        exit 1
      shell: bash

    - name: Create app token
      id: apptoken
      if: inputs.opencode-app-id != '' && inputs.opencode-app-secret != ''
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
      with:
        app-id: ${{ inputs.opencode-app-id }}
        private-key: ${{ inputs.opencode-app-secret }}
        owner: ${{ github.repository_owner }}

    - name: Select token
      id: auth
      env:
        APP_ID: ${{ inputs.opencode-app-id }}
        APP_TOKEN: ${{ steps.apptoken.outputs.token }}
        APP_SLUG: ${{ steps.apptoken.outputs.app-slug }}
        WORKFLOW_TOKEN: ${{ github.token }}
      run: |
        if [ -n "$APP_TOKEN" ]; then
          echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
          echo "app-slug=$APP_SLUG" >> "$GITHUB_OUTPUT"
        elif [ -z "$APP_ID" ]; then
          echo "token=$WORKFLOW_TOKEN" >> "$GITHUB_OUTPUT"
          echo "app-slug=github-actions" >> "$GITHUB_OUTPUT"
        else
          echo "GitHub App token creation returned no token"
          exit 1
        fi
      shell: bash

    - name: Configure git user
      run: |
        slug="${{ steps.auth.outputs.app-slug }}"
        git config --global user.name "${slug}[bot]"
        git config --global user.email "${slug}[bot]@users.noreply.github.com"
      shell: bash

    - name: Clear checkout auth
      run: |
        git config --local --unset-all http.https://github.com/.extraheader || true
      shell: bash

    - name: Configure git remote
      run: |
        git remote set-url origin https://x-access-token:${{ steps.auth.outputs.token }}@github.com/${{ github.repository }}
      shell: bash
