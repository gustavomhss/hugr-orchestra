name: "Setup Bun"
description: "Setup Bun with caching and install dependencies"
inputs:
  install-flags:
    description: "Additional flags to pass to 'bun install'"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    # node-gyp@latest (invoked via bunx for native install scripts) requires Node >=22;
    # some runner images ship an older system Node on PATH
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "24"

    - name: Get baseline download URL
      id: bun-url
      shell: bash
      run: |
        if [ "$RUNNER_ARCH" = "X64" ]; then
          V=$(node -p "require('./package.json').packageManager.split('@')[1]")
          case "$RUNNER_OS" in
            macOS)   OS=darwin ;;
            Linux)   OS=linux ;;
            Windows) OS=windows ;;
          esac
          echo "url=https://github.com/oven-sh/bun/releases/download/bun-v${V}/bun-${OS}-x64-baseline.zip" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ !steps.bun-url.outputs.url && 'package.json' || '' }}
        bun-download-url: ${{ steps.bun-url.outputs.url }}

    - name: Get cache directory
      id: cache
      shell: bash
      run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"

    # Computed once, before install: a hashFiles('**/...') key evaluated after install walks
    # node_modules (about 70 s on Windows) and can hash files inside it, so save would miss restore.
    - name: Compute dependency cache keys
      id: keys
      shell: bash
      run: |
        echo "bun=${{ runner.os }}-bun-v2-${{ hashFiles('bun.lock') }}" >> "$GITHUB_OUTPUT"
        echo "modules=${{ runner.os }}-modules-v1-${{ hashFiles('bun.lock', 'patches/**', 'package.json') }}" >> "$GITHUB_OUTPUT"

    # Every platform reuses the installed tree: on Linux a restore takes about 15 s where `bun install` from Bun's
    # package cache took about 50 s, and Windows cannot reuse Bun's package cache at all (see the install step).
    # The key covers everything that shapes node_modules; a partial tree from another lockfile is never restored.
    - name: Restore node_modules
      id: modules-cache
      if: inputs.install-flags == ''
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          node_modules
          packages/*/node_modules
          packages/*/*/node_modules
        key: ${{ steps.keys.outputs.modules }}

    - name: Restore Bun dependencies
      id: bun-cache
      # Windows installs with --no-cache below, so only other platforms reuse Bun's package cache, and only when
      # the installed tree missed.
      if: runner.os != 'Windows' && steps.modules-cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.cache.outputs.dir }}
        # v2 invalidates caches containing Bun's Windows patched-package rename state.
        key: ${{ steps.keys.outputs.bun }}
        restore-keys: |
          ${{ runner.os }}-bun-v2-

    - name: Install setuptools for distutils compatibility
      run: python3 -m pip install setuptools || pip install setuptools || true
      shell: bash

    - name: Install dependencies
      if: steps.modules-cache.outputs.cache-hit != 'true'
      run: |
        # Workaround for patched peer variants
        # e.g. ./patches/ for standard-openapi
        # https://github.com/oven-sh/bun/issues/28147
        if [ "$RUNNER_OS" = "Windows" ]; then
          # Bun can leave a patched package directory half-renamed on Windows.
          # The hoisted layout nests several copies of a patched package (e.g. @ai-sdk/openai-compatible),
          # and Bun applies the patch once per copy; concurrent renames into the same cache entry race
          # with ENOTEMPTY. Every attempt starts from an empty cache because the loser may leave it partial.
          cache_dir="$PWD/.bun-install-cache"
          trap 'rm -rf "$cache_dir"' EXIT
          for attempt in 1 2 3 4 5; do
            rm -rf "$cache_dir"
            rm -rf node_modules
            if bun install --no-cache --cache-dir "$cache_dir" --linker hoisted ${{ inputs.install-flags }}; then
              exit 0
            fi
            echo "::warning::bun install attempt $attempt failed on Windows; retrying from an empty cache"
          done
          exit 1
        else
          bun install ${{ inputs.install-flags }}
        fi
      shell: bash

    # Only dev saves (cache-warm): every other ref can read dev's entries, while a 700 MB copy saved by each
    # test:ci branch pushed the repository past its 10 GB quota and evicted dev's caches.
    - name: Save Bun dependencies
      if: runner.os != 'Windows' && steps.modules-cache.outputs.cache-hit != 'true' && steps.bun-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/dev'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.cache.outputs.dir }}
        key: ${{ steps.keys.outputs.bun }}

    - name: Save node_modules
      if: inputs.install-flags == '' && steps.modules-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/dev'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          node_modules
          packages/*/node_modules
          packages/*/*/node_modules
        key: ${{ steps.keys.outputs.modules }}
