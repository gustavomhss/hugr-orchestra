name: Orchestra final reference verification
on:
  push:
    branches: [visual-migration-plan]
    paths: [.github/workflows/orchestra-design-publish.yml]
permissions:
  contents: write
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Isolate signed values without mirroring their semantics
        run: |
          echo "OUT=$RUNNER_TEMP/orchestra-final-reference" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/orchestra-final-reference"
          python3 - <<'PY'
          import hashlib,pathlib
          p=pathlib.Path('specs/orchestra-visual');f=p/'design/reference.css'
          assert hashlib.sha256(f.read_bytes()).hexdigest()=='f4bec09b051f12bfbe8acddb25c590cf1bbec31522084525f4a81891a189eece'
          f.write_text(f.read_text()+'\n/* Signed diff counts, native shortcuts and timestamps are LTR data islands. */\n.file-row .add,.file-row .del,.ov-shortcut,.author time { direction:ltr; unicode-bidi:isolate; }\n')
          f=p/'tools/render_design_references.py';s=f.read_text();needle="    return {'state':state,'geometry':r,'kind':'design-reference-dom-check-not-product-proof'}";assert s.count(needle)==1
          check='''    r['ltr_islands']=page.evaluate("""() => [...document.querySelectorAll('.file-row .add,.file-row .del,.ov-shortcut,.author time')].map(e=>({text:e.textContent,direction:getComputedStyle(e).direction,bidi:getComputedStyle(e).unicodeBidi}))""")
              assert all(x['direction']=='ltr' and x['bidi']=='isolate' for x in r['ltr_islands']), (state,'signed data mirrored',r)
              if r['stateRTL']:assert len(r['ltr_islands'])>=12, (state,'missing RTL signed-data coverage')
          '''
          s=s.replace(needle,check+needle);f.write_text(s)
          PY
      - name: Render actual design references with existing repository fonts
        run: |
          python3 -m venv "$RUNNER_TEMP/final-reference-author"
          "$RUNNER_TEMP/final-reference-author/bin/pip" install --disable-pip-version-check playwright==1.57.0 > "$OUT/install.log" 2>&1
          "$RUNNER_TEMP/final-reference-author/bin/python" specs/orchestra-visual/tools/render_design_references.py --repo "$GITHUB_WORKSPACE" --browser "$(command -v google-chrome)" > "$OUT/render.log"
      - name: Verify the full contract suite and unchanged product plan
        working-directory: specs/orchestra-visual
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_*.py' -v > "$OUT/tests.log" 2>&1
          tail -5 "$OUT/tests.log"
          python3 tools/validate_plan.py > "$OUT/plan.json"
          python3 tools/validate_design_inputs.py > "$OUT/design.json"
          python3 tools/verify_brand.py > "$OUT/brand.json"
          python3 tools/render_maps.py --check
          python3 tools/render_issues.py --check
          python3 tools/render_navigation.py --check --repo "$GITHUB_WORKSPACE"
      - name: Publish the verified correction and preserve previous inspection history
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,zipfile
          p=pathlib.Path('specs/orchestra-visual');out=pathlib.Path(os.environ['OUT']);log=(out/'tests.log').read_text()
          assert re.search(r'Ran 296 tests in ',log) and log.rstrip().endswith('OK')
          r=json.loads((p/'design/LOCAL-RENDER.json').read_text());assert len(r['reference_boundary_checks'])==23 and not r['page_errors']
          assert all(x['images_loaded'] for x in r['geometry'])
          assert json.loads((p/'progress.json').read_text())['tasks']=={}
          changes=subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
          for name in changes:
              assert name.startswith(str(p)+'/');n=name[len(str(p))+1:]
              assert n in {'design/reference.css','tools/render_design_references.py','design/LOCAL-RENDER.json'} or n.startswith(('design/states/','design/elements/')),n
          f=p/'reviews/design-complement/REFERENCE-REVIEW.json';report=json.loads(f.read_text());report['previous_reference_run']=report['run_url'];report['run_url']='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'];report['input_sha']=os.environ['GITHUB_SHA'];report['checks']=r['reference_boundary_checks'];report['fixes'].append('Signed diff counts, keyboard shortcuts and timestamps retain LTR data order inside the RTL layout.');f.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          f=p/'reviews/design-complement/REFERENCE-REVIEW.md';f.write_text(f.read_text()+'\nA inspeção final também isolou contagens com sinal, atalhos e timestamps em LTR, evitando apresentar `+48` como `48+`. O renderer verifica essas ilhas de dados em cada estado pertinente.\n')
          files=sorted(f for f in p.rglob('*') if f.is_file() and f.name!='MANIFEST.sha256' and '__pycache__' not in f.parts)
          (p/'MANIFEST.sha256').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+str(f.relative_to(p))+'\n' for f in files))
          subprocess.run(['git','diff','--check'],check=True)
          assert subprocess.check_output(['git','ls-remote','origin','refs/heads/visual-migration-plan'],text=True).split()[0]==os.environ['GITHUB_SHA'],'Concurrent branch advance'
          subprocess.run(['git','add','--',str(p)],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix(docs): preserve LTR data inside RTL state references'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/visual-migration-plan'],check=True)
          (out/'final-head.txt').write_bytes(subprocess.check_output(['git','rev-parse','HEAD']))
          subprocess.run(['sha256sum','--check','MANIFEST.sha256'],cwd=p,check=True,stdout=open(out/'manifest.log','w'))
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          design=[f for f in (p/'design').rglob('*') if f.is_file()]+[p/'copy.json',p/'reference/approved.png']+list((p/'reviews/design-complement').glob('*'))
          assert not any(f.suffix.lower() in {'.ttf','.otf','.woff','.woff2'} for f in design)
          with zipfile.ZipFile(out/'Orchestra_Separated_Visual_Assets.zip','w',zipfile.ZIP_DEFLATED) as z:
              for f in design:z.write(f,'orchestra-visual/'+str(f.relative_to(p)))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: orchestra-final-reference
          path: ${{ runner.temp }}/orchestra-final-reference
          retention-days: 14
