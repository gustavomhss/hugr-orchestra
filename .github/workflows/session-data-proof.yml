name: session-data-proof

# Preserved Windows ARM64 development-build pair only; no installer, GUI, provider or multi-store qualification.
on:
  push:
    branches: [session-data-proof]
    paths: [.github/workflows/session-data-proof.yml, apps/cli/script/session-data-proof.ts]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compatibility:
    runs-on: windows-11-arm
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-windows-aarch64.zip
      - name: Install without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Bind preserved builds to successful source runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $old = gh api repos/${{ github.repository }}/actions/runs/38148620759 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'PREDECESSOR_RUN_UNAVAILABLE' }
          $new = gh api repos/${{ github.repository }}/actions/runs/38200134044 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'CANDIDATE_RUN_UNAVAILABLE' }
          if ($old.conclusion -ne 'success' -or $old.head_sha -ne '1c7761973a2e3f1b919e259f7df43c68b5e0bb86') { throw 'PREDECESSOR_SOURCE_MISMATCH' }
          if ($new.conclusion -ne 'success' -or $new.head_sha -ne '2c758e21f23205ef1f584503ebdd129c5ca645aa') { throw 'CANDIDATE_SOURCE_MISMATCH' }
          @{ predecessor = $old; candidate = $new } | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8 provenance.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 38148620759
          name: windows-arm64-resources
          path: predecessor
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 38148620759
          name: runtime-proof-windows-arm64
          path: predecessor
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 38200134044
          name: windows-arm64-resources
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 38200134044
          name: runtime-proof-windows-arm64
          path: candidate
      - name: Require stale-snapshot control to detect candidate write loss
        run: |
          $ErrorActionPreference = 'Stop'
          $output = & bun apps/cli/script/session-data-proof.ts --predecessor predecessor --candidate candidate --provenance provenance.json --report negative.json --control stale-snapshot --control-report stale-control.json 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -eq 0 -or ($output -join "`n") -notmatch 'STALE_SNAPSHOT_CONTROL_DETECTED') { throw 'STALE_SNAPSHOT_CONTROL_DID_NOT_DETECT_WRITE_LOSS' }
          if (!(Test-Path -LiteralPath stale-control.json -PathType Leaf)) { throw 'STALE_CONTROL_EVIDENCE_MISSING' }
          $control = Get-Content -Raw -LiteralPath stale-control.json | ConvertFrom-Json
          if ($control.control -ne 'stale-snapshot' -or $control.phase -ne 'predecessor-return' -or !$control.snapshotRestored -or $control.reason -ne 'CANDIDATE_WRITES_LOST_OR_DATA_CHANGED' -or ($control.precedingPhases -join ',') -ne 'predecessor-seed,candidate-upgrade,candidate-relaunch') { throw 'STALE_CONTROL_EVIDENCE_INVALID' }
          if (Test-Path -LiteralPath negative.json) { throw 'NEGATIVE_CONTROL_PUBLISHED_SUCCESS' }
          exit 0
      - name: Execute preserved-build upgrade and return
        run: |
          bun apps/cli/script/session-data-proof.ts --predecessor predecessor --candidate candidate --provenance provenance.json --report session-data-proof.json
          if ($LASTEXITCODE -ne 0) { throw 'SESSION_DATA_PROOF_FAILED' }
          if (!(Test-Path -LiteralPath session-data-proof.json -PathType Leaf)) { throw 'SESSION_DATA_REPORT_MISSING' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: session-data-proof-windows-arm64
          path: session-data-proof.json
          if-no-files-found: error
