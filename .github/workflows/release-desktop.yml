name: release-desktop

# Builds the prod desktop app on each native host (macOS arm64 and x64, Windows x64, Linux x64) with the packaging
# omni-desktop-smoke.yml proves: exact-source omni, the CLI payload (a Windows bundle's CLIs from a Linux producer),
# scripts/prepare.ts, electron-vite and electron-builder. A dry run (the default) uploads the installers, the update
# payloads and the assembled feed as artifacts and publishes nothing. A real run creates desktop-v<version> with the
# installers and SHA256SUMS, then replaces the assets of desktop-latest, the fixed release prod builds read their
# update feed from (electron-builder.config.ts), with the new latest*.yml and the payloads they name. The desktop
# releases stay apart from the CLI's v<version> releases and are never marked Latest.
#
# macOS is signed and notarized only when CSC_LINK (base64 .p12 of a Developer ID Application certificate),
# CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID all exist. Without them it builds unsigned,
# and those builds only announce updates with a link to the release page (packages/desktop/src/main/updater.ts):
# Squirrel.Mac cannot install into an unsigned app.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable X.Y.Z
        required: true
        type: string
      dry_run:
        description: Build and assemble only; publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-desktop
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  VERSION: ${{ inputs.version }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - name: Require a stable, unreleased version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "RELEASE_VERSION_INVALID: $VERSION" >&2; exit 1; }
          if [ "$DRY_RUN" != true ]; then
            [ "$GITHUB_REF" = refs/heads/dev ] || { echo "RELEASE_PUBLISH_REQUIRES_DEV: $GITHUB_REF" >&2; exit 1; }
            if gh release view "desktop-v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "RELEASE_EXISTS: desktop-v$VERSION" >&2; exit 1; fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/desktop-v$VERSION" >/dev/null 2>&1; then echo "RELEASE_TAG_EXISTS: desktop-v$VERSION" >&2; exit 1; fi
          fi

      - name: Sign macOS only with every Apple secret
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          present=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name:-}" ]; then present=$((present + 1)); fi
          done
          case "$present" in
            5) echo "signed=true" >> "$GITHUB_OUTPUT" ;;
            0)
              echo "signed=false" >> "$GITHUB_OUTPUT"
              echo "::warning::No Apple signing secrets: macOS builds are unsigned and only announce updates"
              ;;
            *) echo "RELEASE_SIGNING_PARTIAL: set all five Apple secrets or none" >&2; exit 1 ;;
          esac

  guest-omni:
    needs: plan
    uses: ./.github/workflows/omni-artifacts.yml

  guest-tree-sitter:
    needs: plan
    uses: ./.github/workflows/tree-sitter-artifacts.yml
    with:
      targets: '["linux-arm64","win32-x64"]'

  # A Windows desktop bundles its own CLI and the Linux CLIs its WSL guests run (scripts/cli-staging.ts). Bun on Windows
  # cannot cross-compile the Linux CLIs, so this Linux producer builds all three, as omni-desktop-smoke.yml does.
  windows-cli:
    needs: [guest-omni, guest-tree-sitter]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile --os="*" --cpu="*"
      # OMNI_ARTIFACTS=<dir>/<omni id>/ and TREE_SITTER_ARTIFACTS=<dir>/<os>-<arch>/, as build.ts reads them.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: omni-win32-x64-msvc
          path: ${{ runner.temp }}/omni-artifacts/win32-x64-msvc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: omni-linux-x64-gnu
          path: ${{ runner.temp }}/omni-artifacts/linux-x64-gnu
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: omni-linux-arm64-gnu
          path: ${{ runner.temp }}/omni-artifacts/linux-arm64-gnu
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tree-sitter-linux-arm64
          path: ${{ runner.temp }}/tree-sitter-artifacts/linux-arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tree-sitter-win32-x64
          path: ${{ runner.temp }}/tree-sitter-artifacts/win32-x64
      - name: Build and export the Windows bundle's three CLIs
        env:
          OMNI_ARTIFACTS: ${{ runner.temp }}/omni-artifacts
          TREE_SITTER_ARTIFACTS: ${{ runner.temp }}/tree-sitter-artifacts
          ORCHESTRA_CHANNEL: prod
          ORCHESTRA_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          targets="windows-x64-baseline linux-arm64 linux-x64-baseline"
          for target in $targets; do
            bun packages/cli/script/build.ts --skip-install --target "$target"
          done
          bun packages/cli/script/export-artifacts.ts --dist packages/cli/dist --out windows-cli --version "$ORCHESTRA_VERSION" \
            --target windows-x64-baseline --target linux-arm64 --target linux-x64-baseline
          # A producer directory holds each target's tree-sitter-<target>/ and ripgrep-<target>/, and each WSL guest's
          # omni pair in omni-<target>/ (scripts/cli-staging.ts reads them there).
          for target in $targets; do
            bin="packages/cli/dist/cli-$target/bin"
            cp -R "$bin/tree-sitter" "windows-cli/tree-sitter-$target"
            cp -R "$bin/ripgrep" "windows-cli/ripgrep-$target"
            if [[ "$target" == linux-* ]]; then
              mkdir -p "windows-cli/omni-$target"
              cp "$bin/hugr_omni.node" "$bin/hugr-omni-supervisor" "windows-cli/omni-$target/"
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-cli
          path: windows-cli/
          if-no-files-found: error

  desktop:
    name: desktop (${{ matrix.target }})
    needs: [plan, windows-cli]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - { host: macos-14, target: aarch64-apple-darwin, flags: --mac --arm64 }
          - { host: macos-15-intel, target: x86_64-apple-darwin, flags: --mac --x64 }
          - { host: windows-2022, target: x86_64-pc-windows-msvc, flags: --win --x64 }
          - { host: ubuntu-24.04, target: x86_64-unknown-linux-gnu, flags: --linux --x64 }
    env:
      ORCHESTRA_CHANNEL: prod
      ORCHESTRA_VERSION: ${{ inputs.version }}
      # Read by electron.vite.config.ts into the app: only a signed macOS build installs updates in place.
      ORCHESTRA_MAC_SIGNED: ${{ needs.plan.outputs.signed }}
      SIGNED: ${{ needs.plan.outputs.signed }}
      # The electron-vite build exceeds Node's default ~2 GiB heap on hosted runners (omni-desktop-smoke.yml).
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Exact-source release omni binaries
        uses: ./.github/actions/omni-binaries

      - name: Stage the omni pair for the CLI build and the app
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            macOS-ARM64) id=darwin-arm64 ;;
            macOS-X64) id=darwin-x64 ;;
            Windows-X64) id=win32-x64-msvc ;;
            Linux-X64) id=linux-x64-gnu ;;
            *) echo "::error::no omni id for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          root="$RUNNER_TEMP/omni-artifacts"
          mkdir -p "$root/$id"
          # The CLI build reads <root>/<omni id>/ (packages/script/src/omni.ts); scripts/stage-omni.ts also takes <root>.
          for dir in "$root/$id" "$root"; do
            cp "$HUGR_OMNI_ADDON" "$dir/hugr_omni.node"
            cp "$HUGR_OMNI_SUPERVISOR" "$dir/"
          done
          echo "OMNI_ARTIFACTS=$root" >> "$GITHUB_ENV"

      - name: The Windows bundle's CLIs from the Linux producer
        if: runner.os == 'Windows'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-cli
          path: ${{ runner.temp }}/windows-cli
      - name: Point the build at the produced CLIs
        if: runner.os == 'Windows'
        run: echo "ORCHESTRA_CLI_PREBUILT_DIR=$RUNNER_TEMP/windows-cli" >> "$GITHUB_ENV"

      - name: rpm for the rpm target
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      # The CLI that scripts/cli-staging.ts signs during prepare needs the identity too, so the certificate goes into a
      # keychain here instead of electron-builder's own CSC_LINK import. CSC_NAME is the identity without its
      # "Developer ID Application: " prefix, as electron-builder requires.
      - name: Import the macOS signing certificate
        if: runner.os == 'macOS' && env.SIGNED == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/orchestra-signing.keychain-db"
          password=$(openssl rand -hex 24)
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # the existing search list, one keychain path per word
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"Developer ID Application: \(.*\)"$/\1/p' | sed -n 1p)
          [ -n "$identity" ] || { echo "RELEASE_SIGNING_IDENTITY_MISSING: CSC_LINK has no Developer ID Application identity" >&2; exit 1; }
          echo "CSC_NAME=$identity" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Stage the CLI, Claude Code, omni and icons, and stamp the version
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts

      - name: Build the app
        working-directory: packages/desktop
        env:
          # No Sentry upload is configured, so the renderer ships without source maps.
          ORCHESTRA_FAST_BUILD: "1"
        run: bun x electron-vite build

      - name: Package the installers and the update feed
        working-directory: packages/desktop
        timeout-minutes: 75
        env:
          FLAGS: ${{ matrix.flags }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          overrides=""
          if [ "$RUNNER_OS" = macOS ] && [ "$SIGNED" != true ]; then
            # The unsigned packaging nix/desktop.nix proves: no identity, so no signature and no notarization.
            overrides="--config.mac.identity=null --config.mac.notarize=false --config.dmg.sign=false"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          # shellcheck disable=SC2086 # flags without spaces, split on purpose
          bun x electron-builder $FLAGS --publish never --config electron-builder.config.ts $overrides

      - name: Require the packaged app to read the desktop-latest feed
        working-directory: packages/desktop/dist
        run: |
          set -euo pipefail
          feed=$(find . -path '*esources/app-update.yml' -print -quit)
          [ -n "$feed" ] || { echo "RELEASE_APP_FEED_MISSING" >&2; exit 1; }
          cat "$feed"
          grep -qF "gustavomhss/hugr-orchestra/releases/download/desktop-latest" "$feed" || { echo "RELEASE_APP_FEED_WRONG: $feed" >&2; exit 1; }
          ls -l

      - name: Upload the installers and update payloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.target }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.blockmap
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload this build's update feed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: latest-yml-${{ matrix.target }}
          path: packages/desktop/dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

  # Merges the per-build feeds (the two macOS builds share latest-mac.yml) and checks that every payload a feed names
  # exists with the size and sha512 it records. Runs on dry runs too: its artifact is what a real run publishes.
  feed:
    needs: [plan, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: latest-yml-*
          path: ${{ runner.temp }}/latest-yml
      - name: Assemble and verify the update feed and checksums
        env:
          LATEST_YML_DIR: ${{ runner.temp }}/latest-yml
          LATEST_YML_OUT: ${{ runner.temp }}/feed
          LATEST_PAYLOAD_DIR: ${{ runner.temp }}/dist
          ORCHESTRA_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$LATEST_YML_OUT"
          bun packages/desktop/scripts/finalize-latest-yml.ts
          for feed in latest.yml latest-mac.yml latest-linux.yml; do
            test -s "$LATEST_YML_OUT/$feed" || { echo "RELEASE_FEED_MISSING: $feed" >&2; exit 1; }
            cat "$LATEST_YML_OUT/$feed"
          done
          (cd "$LATEST_PAYLOAD_DIR" && sha256sum -- *.dmg *.zip *.exe *.AppImage *.deb *.rpm) > "$LATEST_YML_OUT/SHA256SUMS"
          cat "$LATEST_YML_OUT/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-desktop-feed
          path: ${{ runner.temp }}/feed/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ !inputs.dry_run }}
    needs: [plan, feed]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNED: ${{ needs.plan.outputs.signed }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-desktop-feed
          path: feed

      - name: Create desktop-v<version> with the installers and SHA256SUMS
        run: |
          set -euo pipefail
          tag="desktop-v$VERSION"
          # Checked again: gh release create attaches to an existing tag instead of failing.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "RELEASE_EXISTS: $tag" >&2; exit 1; fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then echo "RELEASE_TAG_EXISTS: $tag" >&2; exit 1; fi
          {
            echo "Download the installer for your system and check it against SHA256SUMS."
            echo
            echo "Windows and AppImage installs update themselves. deb and rpm installs tell you when a new version is out and link to its release page."
            if [ "$SIGNED" != true ]; then
              echo
              echo "The macOS builds in this release are not signed or notarized. They tell you when a new version is out but do not install it themselves. If macOS refuses to open the app, run \`xattr -dr com.apple.quarantine \"/Applications/HuGR Orchestra.app\"\`."
            fi
          } > notes.md
          shopt -s nullglob
          installers=(dist/*.dmg dist/*.zip dist/*.exe dist/*.AppImage dist/*.deb dist/*.rpm)
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "HuGR Orchestra $VERSION" --notes-file notes.md "${installers[@]}" feed/SHA256SUMS

      - name: Replace the desktop-latest feed
        run: |
          set -euo pipefail
          release=desktop-latest
          if ! gh release view "$release" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$release" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "HuGR Orchestra desktop update feed" \
              --notes "The update feed installed desktop apps read. Its files are replaced on every desktop release; installers are in the desktop-v<version> releases."
          fi
          # Payloads first, then the feeds that name them, so a feed never names a file that is not there yet.
          payloads=()
          while read -r name; do
            payloads+=("dist/$name")
            if [ -f "dist/$name.blockmap" ]; then payloads+=("dist/$name.blockmap"); fi
          done < <(sed -n 's/^  - url: //p' feed/latest*.yml | sort -u)
          [ "${#payloads[@]}" -gt 0 ] || { echo "RELEASE_FEED_EMPTY" >&2; exit 1; }
          gh release upload "$release" --repo "$GITHUB_REPOSITORY" --clobber "${payloads[@]}"
          gh release upload "$release" --repo "$GITHUB_REPOSITORY" --clobber feed/latest*.yml
          # Drop what an earlier release left that this feed no longer names.
          keep=$(printf '%s\n' "${payloads[@]##*/}"; cd feed && printf '%s\n' latest*.yml)
          gh release view "$release" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r asset; do
            grep -qxF -- "$asset" <<<"$keep" || gh release delete-asset "$release" "$asset" --repo "$GITHUB_REPOSITORY" --yes
          done
