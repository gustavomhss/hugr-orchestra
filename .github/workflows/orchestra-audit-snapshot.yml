name: Orchestra audit CI evidence
on:
  push:
    branches: [visual-migration-plan]
    paths: [.github/workflows/orchestra-audit-snapshot.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: orchestra-execution-adversarial-audit
  cancel-in-progress: false
jobs:
  evidence:
    if: github.repository == 'gmhelmold/HuGR-Orchestra'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read pinned Atlas job log and annotations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,urllib.request
          root=pathlib.Path('/tmp/orchestra-ci-audit');root.mkdir()
          base='https://api.github.com/repos/gmhelmold/HuGR-Orchestra/'
          def read(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'Orchestra-Read-Only-Audit'})
              with urllib.request.urlopen(req,timeout=60) as r:return r.read()
          job=108568928270
          log=read('actions/jobs/'+str(job)+'/logs')
          (root/'atlas-job.log').write_bytes(log)
          metadata=json.loads(read('actions/jobs/'+str(job)))
          (root/'atlas-job.json').write_text(json.dumps(metadata,indent=2))
          ann=json.loads(read('check-runs/'+str(job)+'/annotations?per_page=100'))
          (root/'annotations.json').write_text(json.dumps(ann,indent=2))
          lines=log.decode('utf-8-sig').splitlines();hits=[i for i,s in enumerate(lines) if re.search(r'::error|##\[error\]|AssertionError| FAIL|Failed|failed|Error:|✗',s)]
          visible=set()
          for i in hits:
              visible.update(range(max(0,i-4),min(len(lines),i+5)))
          (root/'failure-excerpts.txt').write_text('\n'.join(str(i+1)+': '+lines[i] for i in sorted(visible))+'\n')
          (root/'summary.json').write_text(json.dumps({'kind':'existing-CI-readback-not-new-product-run','job_id':job,'run_id':metadata['run_id'],'conclusion':metadata['conclusion'],'head_sha':metadata['head_sha'],'log_sha256':hashlib.sha256(log).hexdigest(),'steps':metadata['steps'],'annotations':ann},indent=2))
          print(json.dumps({'read_existing_job':job,'run':metadata['run_id'],'conclusion':metadata['conclusion'],'error_matches':len(hits)}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orchestra-audit-ci-evidence
          path: /tmp/orchestra-ci-audit/
          retention-days: 3
          if-no-files-found: error
