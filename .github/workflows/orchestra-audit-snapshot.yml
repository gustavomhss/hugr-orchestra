name: Orchestra final adversarial audit verification
on:
  push:
    branches: [visual-migration-plan]
    paths: [.github/workflows/orchestra-audit-snapshot.yml]
permissions:
  contents: write
concurrency:
  group: orchestra-execution-adversarial-audit
  cancel-in-progress: false
jobs:
  verify-audit:
    if: github.repository == 'gmhelmold/HuGR-Orchestra'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: visual-migration-plan
          fetch-depth: 1
      - name: Check protected inputs and correct audit run attribution
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('specs/orchestra-visual');report=root/'reviews/full-execution-audit'
          data=json.loads((report/'RESULTS.json').read_text())
          for path,expected in data['source_fingerprints'].items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==expected,'Audited input changed '+path
          for line in (root/'MANIFEST.sha256').read_text().splitlines():
              if not line.strip():continue
              expected,path=line.split(None,1);path=path.lstrip('* ')
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==expected,'Original file changed '+path
          p=report/'REVIEW.md';text=p.read_text()
          assert data['existing_ci']['run_id']==36301102952
          assert text.count('36301092484')==1,'Unexpected audit metadata revision'
          p.write_text(text.replace('36301092484','36301102952'))
          def manifest():
              rows=[]
              for f in sorted(root.rglob('*')):
                  if not f.is_file() or f.name=='MANIFEST.sha256' or '__pycache__' in f.parts or f.suffix=='.pyc':continue
                  rows.append(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.relative_to(root).as_posix())
              (root/'MANIFEST.sha256').write_text('\n'.join(rows)+'\n')
          manifest()
          print(json.dumps({'protected_input_fingerprints':len(data['source_fingerprints']),'audit_citation_run_corrected':36301102952,'product_changed':False}))
          PY
      - name: Reproduce the audited counterexamples in temporary repositories
        run: |
          set -euo pipefail
          cd specs/orchestra-visual
          python3 reviews/full-execution-audit/probes.py --package . --out /tmp/orchestra-full-audit-probes.json
          python3 - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('/tmp/orchestra-full-audit-probes.json').read_text())['results']
          assert d['census_boundary']['empty_scan_roots_errors']==[]
          assert d['census_cli']['normal']['exit_code']==1 and d['census_cli']['empty']['exit_code']==0
          assert d['ancestor_stage_metadata']['producer_effective_digest_unchanged']
          assert d['ancestor_stage_metadata']['wrong_task_stage_rejected']
          assert d['receipt_freshness_boundary']['later_clean_commit_direct_errors']==[]
          assert d['receipt_freshness_boundary']['selector_invalid_claim']
          assert d['explicit_synthetic_evidence']['with_real_isolated_git_check_errors']==[]
          assert d['widget_hash_granularity']['changed_count']==40 and d['widget_hash_granularity']['unrelated_count']==28
          assert d['regression_control']['input_8_to_49ms']=='FAIL'
          assert not d['package_integrity']['hash_mismatches'] and not d['package_integrity']['unlisted_files']
          print('Audit findings reproduced; this is NOT approval of the defective boundaries or of the product.')
          PY
      - name: Repeat unchanged tooling suite and normative checks
        run: |
          set -euo pipefail
          cd specs/orchestra-visual
          python3 tools/verify_brand.py
          python3 tools/validate_plan.py
          python3 tools/render_maps.py --check
          python3 tools/render_issues.py --check
          python3 -m unittest discover -s tools -p 'test_*.py' -v > /tmp/orchestra-full-audit-suite.log 2>&1
          tail -6 /tmp/orchestra-full-audit-suite.log
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/orchestra-full-audit-suite.log').read_text()
          assert re.search(r'Ran 248 tests',s) and s.rstrip().endswith('OK')
          PY
      - name: Publish audit metadata only, then verify committed files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path('specs/orchestra-visual');dest=root/'reviews/full-execution-audit'
          probes=json.loads(pathlib.Path('/tmp/orchestra-full-audit-probes.json').read_text())
          canonical=json.loads((dest/'RESULTS.json').read_text())
          for path,h in canonical['source_fingerprints'].items():assert hashlib.sha256((root/path).read_bytes()).hexdigest()==h,path
          (dest/'REPRODUCED.json').write_text(json.dumps(probes,ensure_ascii=False,indent=2)+'\n')
          log=pathlib.Path('/tmp/orchestra-full-audit-suite.log').read_bytes();(dest/'tooling-tests.log').write_bytes(log)
          metadata={'kind':'adversarial-audit-reproduction-not-product-approval','status':'AUDIT_REPRODUCED','audited_plan_commit':canonical['audited_plan_commit'],'publication_input_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'run_url':os.environ['RUN_URL'],'unchanged_tooling_tests':248,'probes_reproduced':list(probes['results']),'canonical_inputs_unchanged':True,'findings_resolved':False,'product_execution':'NOT_RUN','merge_approved':False,'suite_log_sha256':hashlib.sha256(log).hexdigest(),'actual_ci_failure_run':36301102952}
          (dest/'PUBLICATION.json').write_text(json.dumps(metadata,ensure_ascii=False,indent=2)+'\n')
          rows=[]
          for f in sorted(root.rglob('*')):
              if f.is_file() and f.name!='MANIFEST.sha256' and '__pycache__' not in f.parts and f.suffix!='.pyc':rows.append(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.relative_to(root).as_posix())
          (root/'MANIFEST.sha256').write_text('\n'.join(rows)+'\n')
          changed=subprocess.check_output(['git','diff','--name-only','-z'],text=True).split('\0')
          added=subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z'],text=True).split('\0')
          for path in filter(None,changed+added):assert path=='specs/orchestra-visual/MANIFEST.sha256' or path.startswith('specs/orchestra-visual/reviews/full-execution-audit/'),'Outside audit scope '+path
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add specs/orchestra-visual/MANIFEST.sha256 specs/orchestra-visual/reviews/full-execution-audit
          git commit -m 'docs(app): verify full execution audit without changing contracts'
          git push origin HEAD:visual-migration-plan
          python3 - <<'PY'
          import hashlib,pathlib,subprocess
          root=pathlib.Path('specs/orchestra-visual')
          for line in (root/'MANIFEST.sha256').read_text().splitlines():
              h,p=line.split(None,1);p=p.lstrip('* ')
              data=subprocess.check_output(['git','show','HEAD:specs/orchestra-visual/'+p])
              assert hashlib.sha256(data).hexdigest()==h,p
          print('Committed audit artifacts and manifest verified; no product task or PR approval performed.')
          PY
