name: native

# The Linux accessibility helper is Python run inside the pinned a11y test image (real D-Bus, Xvfb,
# AT-SPI registry and GTK). CI runs once per epic like the other workflows: add the `epic` label to
# the epic PR (remove and re-add it to rerun) or dispatch the workflow manually.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'epic') && format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) || format('{0}-skip-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helper:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'epic'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Refs without the native suites (they live with the Linux workspace) skip every step.
      - name: Build a11y test image
        id: image
        if: hashFiles('apps/desktop/test/native/Dockerfile') != ''
        run: docker build --provenance=false --tag orchestra-a11y-test:ci test/native

      # Every suite runs in a fresh container without network, as the image's own UID, with the package
      # mounted read-only. Xvfb must exist before D-Bus activates the registry, so DISPLAY is exported
      # into the activation environment; without it at-spi2-registryd cannot synthesize keys.
      - name: Write suite runner
        if: steps.image.outcome == 'success'
        run: |
          cat > "$RUNNER_TEMP/suite" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          script="$1"
          shift
          docker run --rm --network none --user 1000:1000 -v "$PWD":/work:ro -w /work \
            --entrypoint dbus-run-session orchestra-a11y-test:ci -- \
            xvfb-run -a sh -c 'dbus-update-activation-environment DISPLAY XAUTHORITY && exec python3 -B "$@"' \
            suite "test/native/$script" "$@"
          SH
          chmod +x "$RUNNER_TEMP/suite"

      - name: Snapshot
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: $RUNNER_TEMP/suite test_snapshot.py --self-check

      - name: Large trees
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: $RUNNER_TEMP/suite test_large_tree.py --payload resources/linux/app-dock-accessibility --self-check

      - name: Helper
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: $RUNNER_TEMP/suite test_helper.py --payload resources/linux/app-dock-accessibility --self-check

      - name: Workspace scope
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: $RUNNER_TEMP/suite test_workspace.py --payload resources/linux/app-dock-accessibility --self-check

      - name: Bus transport
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: $RUNNER_TEMP/suite test_bus.py --self-check

      - name: Runtime session
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: $RUNNER_TEMP/suite test_runtime_session.py --workspace resources/linux-runtime/workspace.py --self-check

      - name: Editor settings
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: $RUNNER_TEMP/suite test_editor_settings.py --workspace resources/linux-runtime/workspace.py --self-check

      - name: App launch
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: $RUNNER_TEMP/suite test_app_launch.py --workspace resources/linux-runtime/workspace.py --self-check

      - name: App restore
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: $RUNNER_TEMP/suite test_app_restore.py --workspace resources/linux-runtime/workspace.py --self-check

      - name: Actions with the real registry
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: $RUNNER_TEMP/suite test_actions.py

      - name: Keyboard
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: $RUNNER_TEMP/suite keyboard_regression.py

      - name: App dialogs
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: $RUNNER_TEMP/suite test_dialogs.py

      - name: Modal dialogs opened by actions
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: |
          $RUNNER_TEMP/suite test_modal_actions.py
          $RUNNER_TEMP/suite test_modal_actions.py --mutations

  # The Docker-backed runtime cycle: create, launch, stop (recording open apps), restart (reopening them), stop.
  # The runner's Docker builds the workspace image from resources/linux-runtime when no image is given.
  workspace:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'epic'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # bun test lanes find rg on PATH and must never download it (packages/core/src/ripgrep/binary.ts).
      - name: ripgrep
        uses: ./.github/actions/ripgrep

      # Omni is the default process layer: the runtime's docker commands spawn through it, so the job needs its pair.
      - name: Omni binaries
        uses: ./.github/actions/omni-binaries

      - name: Prewarm production Linux runtime image
        run: docker build --progress=plain --tag orchestra-linux-prewarm:ci resources/linux-runtime

      - name: Runtime cycle with real Docker
        env:
          APP_DOCK_RUNTIME_INTEGRATION: "1"
          APP_DOCK_RUNTIME_TEST_TMP: ${{ runner.temp }}/orchestra
        run: bun test --timeout 1200000 src/main/app-dock-runtime.test.ts

  # The MCP Dock security, RPC and tools harnesses: each bundles and launches a real Electron against local fixtures
  # (a local https server, no internet, no model) and writes its artifact JSON under APP_DOCK_ARTIFACT_ROOT. A failure
  # sets a non-zero exit code. The live and YouTube harnesses need a model and the internet, so they stay manual.
  app-dock:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'epic'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Electron 42 ships its own installer rather than a postinstall step; predev runs the same script.
      - name: Electron binary
        run: bun run install-electron

      # Electron runs under a virtual X display; the harnesses start it with the same xvfb-run wrapper as the native suites.
      - name: Linux GUI display capability
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, so Electron's Chromium sandbox
      # cannot start and the harnesses fail before any MCP Dock code runs. Allowing user namespaces keeps the sandbox on.
      - name: Chromium sandbox user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Artifact root
        run: echo "APP_DOCK_ARTIFACT_ROOT=$RUNNER_TEMP/app-dock" >> "$GITHUB_ENV"

      - name: Security harness
        timeout-minutes: 10
        env:
          ELECTRON_ENABLE_LOGGING: "1"
        run: xvfb-run -a bun run test:app-dock:e2e

      - name: RPC harness
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          ELECTRON_ENABLE_LOGGING: "1"
        run: xvfb-run -a bun run test:app-dock:rpc

      - name: Tools harness
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          ELECTRON_ENABLE_LOGGING: "1"
        run: xvfb-run -a bun run test:app-dock:tools

      - name: Preserve MCP Dock artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-dock-artifacts-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-dock
          if-no-files-found: ignore
          retention-days: 7
