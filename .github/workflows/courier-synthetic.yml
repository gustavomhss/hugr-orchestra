name: Courier synthetic only
on:
  workflow_dispatch:
  push:
    paths: ['courier-synthetic/**', '.github/workflows/courier-synthetic.yml']
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict synthetic unittest (no campaign data)
        run: python -I -S -B courier-synthetic/test_courier.py
