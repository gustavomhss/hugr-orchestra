name: artifact-native

# Change-scoped native ABI proof. These hosted lanes do not build the whole CLI
# or certify Nix outputs; every lane must execute its required native entrypoint.
on:
  push:
    branches: ["ci-artifact-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  darwin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-15-intel, lane: darwin-x64 }
          - { host: macos-15, lane: darwin-arm64 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Execute on case-insensitive APFS
        shell: bash
        env:
          ORCHESTRA_ARTIFACT_NATIVE_LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/artifact-native"
          mkdir -p "$fixture/mount"
          hdiutil create -size 128m -fs APFS -volname ArtifactNative "$fixture/fixture.dmg"
          hdiutil attach "$fixture/fixture.dmg" -nobrowse -mountpoint "$fixture/mount"
          trap 'hdiutil detach "$fixture/mount"' EXIT
          export ORCHESTRA_ARTIFACT_BUNFIG="$fixture/empty.toml"
          : > "$ORCHESTRA_ARTIFACT_BUNFIG"
          export ORCHESTRA_ARTIFACT_TEST_ROOT="$fixture/mount"
          ORCHESTRA_ARTIFACT_DARWIN_SDK="$(xcrun --sdk macosx --show-sdk-path)"
          export ORCHESTRA_ARTIFACT_DARWIN_SDK
          cd packages/cli
          bun --config="$ORCHESTRA_ARTIFACT_BUNFIG" test ./test/artifact-native-lane.test.ts --timeout 120000

  musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-24.04
            lane: linux-musl-x64
            archive: bun-linux-x64-musl
            sha256: 14bd9aedeebf1dba67e8def9531c89bc989ecfdf1de42e5bfcaf1b8cd9294719
          - host: ubuntu-24.04-arm
            lane: linux-musl-arm64
            archive: bun-linux-aarch64-musl
            sha256: b98e0ad3625c5c00d1d5b5ff55605c7adddbfae151861e68ade57b2d3b8703bb
    runs-on: ${{ matrix.host }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Acquire verified native musl Bun
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/artifact-native"
          mkdir -p "$fixture"
          curl --fail --location --retry 2 "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/$ARCHIVE.zip" --output "$fixture/bun.zip"
          printf '%s  %s\n' "$SHA256" "$fixture/bun.zip" | sha256sum --check --strict
          unzip "$fixture/bun.zip" -d "$fixture"
          mv "$fixture/$ARCHIVE/bun" "$fixture/bun"
          chmod 755 "$fixture/bun"
          : > "$fixture/empty.toml"
          mkdir -p "$fixture/image"
          docker build --tag artifact-musl:ci --file - "$fixture/image" <<'DOCKERFILE'
          FROM alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
          RUN apk add --no-cache libstdc++ libgcc
          DOCKERFILE
      - name: Execute on native Alpine musl 1.2.5
        shell: bash
        env:
          ORCHESTRA_ARTIFACT_NATIVE_LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/artifact-native,target=/native,readonly" \
            --workdir /work/packages/cli \
            --env RUNNER_OS=Linux \
            --env "ORCHESTRA_ARTIFACT_NATIVE_LANE=$ORCHESTRA_ARTIFACT_NATIVE_LANE" \
            --env ORCHESTRA_ARTIFACT_BUNFIG=/native/empty.toml \
            artifact-musl:ci \
            /native/bun --config=/native/empty.toml test ./test/artifact-native-lane.test.ts --timeout 120000

  mixed-libc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, lane: linux-glibc-musl-x64 }
          - { host: ubuntu-24.04-arm, lane: linux-glibc-musl-arm64 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Keep glibc runtime with foreign musl installed
        shell: bash
        env:
          ORCHESTRA_ARTIFACT_NATIVE_LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes musl
          export ORCHESTRA_ARTIFACT_BUNFIG="$RUNNER_TEMP/artifact-empty.toml"
          : > "$ORCHESTRA_ARTIFACT_BUNFIG"
          cd packages/cli
          bun --config="$ORCHESTRA_ARTIFACT_BUNFIG" test ./test/artifact-native-lane.test.ts --timeout 120000
