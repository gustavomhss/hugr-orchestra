name: genesis-s4-knowledge-prepare
on:
  workflow_dispatch:
    inputs:
      runtime_sha:
        description: Exact compatible runtime commit SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Pin runtime and install Atlas dependencies
        env:
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
        run: |
          set -euo pipefail
          [[ "$RUNTIME_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$RUNTIME_SHA^{commit}"
          git worktree add --detach "$RUNNER_TEMP/s4-runtime" "$RUNTIME_SHA"
          test "$(git -C "$RUNNER_TEMP/s4-runtime" rev-parse HEAD)" = "$RUNTIME_SHA"
          npm ci --prefix "$RUNNER_TEMP/s4-runtime/modules/atlas"
      - name: Materialize exact S4 and prepare
        env:
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
        run: |
          set -euo pipefail
          python3 modules/atlas/docs/design/genesis-chatgpt-results/20261111-v3-fresh/s4/runtime/own-20261128/prepare-full15.py \
            --repository "$GITHUB_WORKSPACE" --runtime-root "$RUNNER_TEMP/s4-runtime" --runtime-sha "$RUNTIME_SHA" \
            --source-root "$RUNNER_TEMP/s4-source" --output-dir "$RUNNER_TEMP/s4-evidence"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s4-knowledge-prepare-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/s4-evidence
          if-no-files-found: warn
          retention-days: 30
