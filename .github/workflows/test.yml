name: test

# CI runs once per epic, not per unit of work: add the `epic` label to the epic PR
# (remove and re-add it to rerun) or dispatch the workflow manually.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      windows_e2e:
        description: Also run the e2e suite on Windows (unit tests always run on Windows)
        type: boolean
        default: false
      cold:
        description: Run every test, replaying no Turbo cache and skipping no recorded pass (measures cold lane times)
        type: boolean
        default: false

concurrency:
  # Non-epic label events skip every job; give them their own group so they cannot cancel an epic run.
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'epic') && format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) || format('{0}-skip-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The account runs at most 20 hosted jobs at once across all workflows and PRs, and GitHub
  # cancels jobs it cannot place. One epic run (this file plus typecheck, nix-eval, storybook and
  # native) has 21 jobs, but atlas scope and the two Omni producers finish before atlas and the
  # unit jobs start, so at most 19 run at once.
  #
  # Every job has a timeout: a hung Windows build once held a runner past 40 minutes, and the
  # GitHub default is 6 hours.
  atlas-scope:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'epic'
    name: atlas scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Detect Atlas-relevant changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          # WAIVER (human-authorized 2026-09-25) — PR #126 may skip Atlas while it repairs
          # Atlas guard debt and Maestro documentation only. Any other path, including Atlas product
          # code, still runs the full Atlas job. This exception applies to no other PR.
          if [ "$PR_NUMBER" = "126" ] && [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -Evq '^(specs/hugr-maestro/.*\.md|foundation/atlas/harness/gates/(godfile-guard(\.test)?\.mjs|godfile-waivers\.json|layer-guard(\.test)?\.mjs)|foundation/atlas/docs/requirements/properties-(tls|mem|authoring|idx)\.md|\.github/workflows/test\.yml)$'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(foundation/atlas/|\.github/workflows/test\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  atlas:
    name: atlas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: atlas-scope
    # Atlas guards cover its vendor subtree; a failed scope detector fails this workflow rather than skipping it.
    if: github.event_name != 'pull_request' || needs.atlas-scope.outputs.changed == 'true'
    defaults:
      run:
        working-directory: foundation/atlas
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: foundation/atlas/package-lock.json

      # foundation/atlas/.github/workflows/ci.yml documents Atlas's standalone
      # contract. This host-level job makes that contract reachable in this repo.
      - name: Install Atlas dependencies
        run: npm ci

      - name: Typecheck Atlas
        run: npm run typecheck

      - name: Set Atlas EARS baseline
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
        run: |
          if TREE=$(git rev-parse "$BASE_SHA:foundation/atlas" 2>/dev/null); then
            echo "Using Atlas tree from $BASE_SHA"
          else
            TREE=$(git mktree </dev/null)
            echo "Atlas absent at $BASE_SHA; using empty baseline tree"
          fi
          ATLAS_BASE=$(git -c user.name=atlas-ci -c user.email=atlas-ci@example.invalid commit-tree "$TREE" -m "Atlas CI baseline")
          echo "EARS_COAMEND_BASE=$ATLAS_BASE" >> "$GITHUB_ENV"

      - name: Run Atlas guards
        run: |
          npm run godfile-guard
          npm run layer-guard
          npm run reference-model-guard
          npm run spec-conformance-guard
          npm run id-integrity
          npm run command-doc-guard
          npm run wiring-guard
          npm run adr-citation-guard
          npm run req-clause-guard
          npm run ears-coamend-guard
          npm run doc-transcript-guard
          npm run service-gate-guard
          npm run own-snapshot-guard

      - name: Test Own snapshot materializer
        run: node --test scripts/materialize-own-snapshot.test.mjs

      - name: Test Own snapshot gate
        run: npm test -- harness/gates/own-snapshot-guard.test.mjs

      - name: Detect Atlas product changes
        id: atlas-diff
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          if echo "$CHANGED" | grep -qE '^(foundation/atlas/(packages/|harness/|\.github/)|\.github/workflows/test\.yml)'; then
            echo "touches_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "touches_code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test Atlas product suite
        if: github.event_name != 'pull_request' || steps.atlas-diff.outputs.touches_code == 'true'
        run: npm test

  # packages/orchestra holds almost all unit-test time, so it runs in Bun shards; every other
  # package runs through Turbo in unit-rest, where unchanged packages replay from the Turbo cache.
  omni:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'epic'
    name: omni test binaries (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Exact-source omni binaries
        uses: ./.github/actions/omni-binaries
      - name: Share binaries with consuming test jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omni-test-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ env.HUGR_OMNI_ADDON }}
            ${{ env.HUGR_OMNI_SUPERVISOR }}
          if-no-files-found: error
          retention-days: 7

  unit:
    needs: omni
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'epic'
    name: unit (${{ matrix.name }} orchestra ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        # Measured test time on 2026-10-12 was 2215 s on Linux and 3918 s on Windows, where the same
        # files vary by up to 40% between runs. Three Windows shards (~1306 s each) left no room under
        # the 27-minute watchdog below, so Windows gets four (~980 s each).
        include:
          - { name: linux, host: ubuntu-latest, shard: 1, shards: 2 }
          - { name: linux, host: ubuntu-latest, shard: 2, shards: 2 }
          - { name: windows, host: windows-latest, shard: 1, shards: 4 }
          - { name: windows, host: windows-latest, shard: 2, shards: 4 }
          - { name: windows, host: windows-latest, shard: 3, shards: 4 }
          - { name: windows, host: windows-latest, shard: 4, shards: 4 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Re-labeling an epic re-runs every job; a shard whose inputs already passed in this PR skips.
      - name: Check for a previous pass
        if: ${{ !inputs.cold }}
        id: previous
        uses: ./.github/actions/previous-pass
        with:
          task: orchestra#test
          name: orchestra-${{ matrix.shard }}of${{ matrix.shards }}

      - name: Setup Bun
        if: steps.previous.outputs.hit != 'true'
        uses: ./.github/actions/setup-bun

      # Tests find rg on PATH and must never download it (packages/core/src/ripgrep/binary.ts).
      - name: ripgrep
        if: steps.previous.outputs.hit != 'true'
        uses: ./.github/actions/ripgrep

      - name: Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor; bubblewrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0


      - name: Native test binaries
        uses: ./.github/actions/omni-binaries
        with:
          artifact: omni-test-${{ runner.os }}-${{ runner.arch }}

      - name: Configure git identity
        if: steps.previous.outputs.hit != 'true'
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "orchestra"

      # Per-file timings show where suite time goes; the edit stays inside the runner checkout.
      - name: Enable JUnit timings
        if: steps.previous.outputs.hit != 'true'
        run: printf "\n[test.reporter]\njunit = '%s'\n" "$RUNNER_TEMP/junit-orchestra-${{ matrix.shard }}.xml" >> packages/orchestra/bunfig.toml

      - name: Run orchestra tests
        if: steps.previous.outputs.hit != 'true'
        timeout-minutes: 30
        working-directory: packages/orchestra
        # Not --parallel: on 2026-10-05 it made shards slower and broke timing-sensitive tests.
        # Shards are balanced by measured time (script/test-shard.ts), not by file count; the
        # assignment fails the step if the script fails instead of falling back to every file.
        #
        # A test that blocks the event loop never reaches its per-test timeout, and Bun writes JUnit only on
        # exit, so a hung run used to end at the step timeout with no clue. Windows, where runs have hung, prints
        # every test, so the log ends at the file and test that hung. The watchdog stops the run three minutes
        # before the step timeout and lists the processes still running.
        run: |
          files=$(bun script/test-shard.ts ${{ matrix.name }} ${{ matrix.shard }} ${{ matrix.shards }})
          [ -n "$files" ] || { echo "::error::orchestra shard produced an empty file list"; exit 1; }
          mapfile -t selected <<< "$files"
          report=()
          [ "$RUNNER_OS" = Windows ] || report=(--only-failures)
          bun test --timeout 30000 "${report[@]}" "${selected[@]}" &
          tests=$!
          deadline=$((SECONDS + 27 * 60))
          while kill -0 $tests 2>/dev/null && [ $SECONDS -lt $deadline ]; do sleep 5; done
          if kill -0 $tests 2>/dev/null; then
            echo "::error::orchestra tests still running after 27 minutes; the last file and test above hung. Processes still running:"
            if [ "$RUNNER_OS" = Windows ]; then
              powershell -NoProfile -Command 'Get-CimInstance Win32_Process | Sort-Object ProcessId | Format-Table ProcessId, ParentProcessId, CreationDate, CommandLine -Wrap | Out-String -Width 400'
            else
              ps -eo pid,ppid,etime,args
            fi
            kill $tests
            exit 1
          fi
          wait $tests
        env:
          ORCHESTRA_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - name: Upload JUnit timings
        if: always() && steps.previous.outputs.hit != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ matrix.name }}-orchestra-${{ matrix.shard }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: ${{ runner.temp }}/junit-*.xml

      - name: Record the pass
        if: steps.previous.outputs.hit != 'true' && steps.previous.outputs.key != ''
        run: mkdir -p .tests-passed && echo "${{ github.sha }}" > .tests-passed/sha

      - name: Save the pass
        if: steps.previous.outputs.hit != 'true' && steps.previous.outputs.key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tests-passed
          key: ${{ steps.previous.outputs.key }}

  unit-rest:
    needs: omni
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'epic'
    name: unit (${{ matrix.name }} ${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        # Split by measured time. On cold Turbo caches (run 38221067577, 2026-10-12) one Linux job of every package plus
        # the HttpApi and Relay gates ran 1093 + 582 + over 370 s and hit its 35-minute limit, and Windows took 1514 s of
        # its 30-minute test step with core alone at 1081 s. Core runs by itself on Windows; the legacy rollback checks,
        # 85 s in a job of their own, run after the other Windows packages.
        include:
          - { name: linux, host: ubuntu-latest, part: packages, label: "other packages, godfile", filters: "--filter=!orchestra" }
          - { name: linux, host: ubuntu-latest, part: gates, label: "httpapi, relay" }
          - { name: windows, host: windows-latest, part: core, label: "core", filters: "--filter=@orchestra/core" }
          # httpapi-codegen is a build-time generator whose tests pin POSIX paths, so it runs on Linux only.
          - { name: windows, host: windows-latest, part: rest, label: "other packages, legacy rollback",
              filters: "--filter=!orchestra --filter=!@orchestra/core --filter=!@orchestra/httpapi-codegen" }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Tests find rg on PATH and must never download it (packages/core/src/ripgrep/binary.ts).
      - name: ripgrep
        uses: ./.github/actions/ripgrep

      - name: Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor; bubblewrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0


      - name: Native test binaries
        uses: ./.github/actions/omni-binaries
        with:
          artifact: omni-test-${{ runner.os }}-${{ runner.arch }}

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "orchestra"

      # Turbo 2 keeps its local cache in .turbo/cache. A run restores its PR's newest entry, else the one cache-warm
      # saved on dev. Turbo checks each entry against its own task hash, so the key only selects the newest blob.
      - name: Restore Turbo cache
        if: matrix.filters && !inputs.cold
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-test-${{ runner.os }}-${{ matrix.part }}-${{ github.sha }}-${{ github.run_attempt }}
          # PR entries carry their own prefix so typecheck.yml, which restores turbo-<os>-, keeps reading dev's.
          restore-keys: |
            turbo-test-${{ runner.os }}-${{ matrix.part }}-
            turbo-test-${{ runner.os }}-
            turbo-${{ runner.os }}-

      # Extension: installed Atlas code must match its canonical producer before any consumer proof.
      - name: Check generated Atlas boundary
        if: matrix.part == 'packages'
        working-directory: packages/atlas-boundary
        run: bun run check:generated

      - name: Fetch target branch for godfile
        if: matrix.part == 'packages'
        run: git fetch origin +dev:refs/remotes/origin/dev --depth=1

      - name: Test godfile gate
        if: matrix.part == 'packages'
        run: bun --cwd packages/core test test/godfile.test.ts
        env:
          # Build-time scanner test starts no runtime child; ordinary suites below stay default-native.
          ORCHESTRA_EXPERIMENTAL_OMNI_SPAWNER: "0"

      - name: Run godfile gate
        if: matrix.part == 'packages'
        run: bun run check:godfile

      - name: Run spawn-import gate
        if: matrix.part == 'packages'
        run: bun run check:spawn-imports

      # Every pinned ripgrep digest, not only the runners' platforms, against upstream's .sha256 files.
      - name: Run ripgrep pin gate
        if: matrix.part == 'packages'
        run: bun run check:ripgrep-pins

      - name: Run unit tests
        if: matrix.filters
        timeout-minutes: 30
        run: |
          read -ra filters <<< "$FILTERS"
          # Cold embedded startup on Windows and contract generation on Linux exceeded unchanged deadlines
          # when sharing the runner with another runtime suite. Keep every package and per-test budget.
          concurrency=1
          # Turbo stops scheduling at the first failed task by default, so one red package hid every package after it
          # (run 38157434225: core failed and the CLI suite never started). Each package runs once its dependencies
          # pass; any failure still fails the step.
          GITHUB_ACTIONS=false bun turbo test --concurrency="$concurrency" --continue=dependencies-successful "${filters[@]}"
        env:
          FILTERS: ${{ matrix.filters }}
          ORCHESTRA_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      # Saved even when a package failed: Turbo records only passing tasks, so re-labeling the PR replays them
      # (about 1 MB per entry).
      - name: Save Turbo cache
        if: always() && matrix.filters
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-test-${{ runner.os }}-${{ matrix.part }}-${{ github.sha }}-${{ github.run_attempt }}

      - name: Check generated client
        if: matrix.part == 'gates'
        working-directory: packages/client
        run: bun run check:generated

      - name: Build HttpApi exerciser dependencies
        if: matrix.part == 'gates'
        run: bun turbo build --filter=orchestra^...

      - name: Run HttpApi exerciser gates
        if: matrix.part == 'gates'
        # The gates finish in a few minutes; fail fast instead of holding the runner if a scenario wedges.
        timeout-minutes: 15
        working-directory: packages/orchestra
        run: bun run test:httpapi

      # Relay's retained Python oracle runs even when an earlier step failed, so one failure does not
      # hide the other. Benchmark runtime tests nest real pytest campaigns and stay manual:
      # `python -m pytest tests/test_benchmark_runtime.py` from modules/relay.
      - name: Setup Python for Relay
        if: ${{ !cancelled() && matrix.part == 'gates' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modules/relay/requirements-dev.txt

      - name: Install Relay test dependencies
        if: ${{ !cancelled() && matrix.part == 'gates' }}
        run: python -m pip install -r modules/relay/requirements-dev.txt

      - name: Test Relay
        if: ${{ !cancelled() && matrix.part == 'gates' }}
        timeout-minutes: 10
        working-directory: modules/relay
        # tests/test_docs.py already runs the doc structure guard on the real tree; only the index check is extra.
        run: |
          python -m pytest tests -q -p no:cacheprovider --ignore=tests/test_benchmark_runtime.py
          python bin/gen-doc-index.py --check

      # Legacy rollback: the same native binaries, with omni turned off for these two suites only. They run even when
      # a package failed above, as they did in a job of their own.
      - name: Real AppProcess default and legacy backend selection
        if: ${{ !cancelled() && matrix.part == 'rest' }}
        working-directory: packages/core
        run: bun test test/omni-default-mode.test.ts test/effect/cross-spawn-spawner.test.ts --timeout 30000
        env:
          ORCHESTRA_EXPERIMENTAL_OMNI_SPAWNER: "0"
          ORCHESTRA_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"

      - name: Legacy shell process behavior
        if: ${{ !cancelled() && matrix.part == 'rest' }}
        working-directory: packages/orchestra
        run: bun test test/util/process-omni.test.ts --timeout 30000
        env:
          ORCHESTRA_EXPERIMENTAL_OMNI_SPAWNER: "0"
          ORCHESTRA_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"

  e2e:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'epic'
    name: e2e (${{ matrix.settings.name }} ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        # Each shard boots its own app server, so shards share no state.
        shard: [1, 2, 3]
        # e2e drives Chromium against a per-page mocked backend, so Windows repeats the Linux
        # coverage; it runs only when dispatched with windows_e2e. Windows unit tests always run.
        settings: ${{ fromJSON(inputs.windows_e2e && '[{"name":"linux","host":"ubuntu-latest"},{"name":"windows","host":"windows-latest"}]' || '[{"name":"linux","host":"ubuntu-latest"}]') }}
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 40
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # e2e drives the app package; its Turbo hash covers the app plus every workspace dependency.
      - name: Check for a previous pass
        if: ${{ !inputs.cold }}
        id: previous
        uses: ./.github/actions/previous-pass
        with:
          task: "@orchestra/app#test"
          name: e2e-${{ matrix.settings.name }}-${{ matrix.shard }}of3

      - name: Setup Node
        if: steps.previous.outputs.hit != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Playwright 1.59 hangs while extracting Chromium with Node 24.16.
          node-version: "24.15"

      - name: Setup Bun
        if: steps.previous.outputs.hit != 'true'
        uses: ./.github/actions/setup-bun

      # Tests find rg on PATH and must never download it (packages/core/src/ripgrep/binary.ts).
      - name: ripgrep
        if: steps.previous.outputs.hit != 'true'
        uses: ./.github/actions/ripgrep

      - name: Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor; bubblewrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0


      - name: Read Playwright version
        if: steps.previous.outputs.hit != 'true'
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # cache-warm saves the browsers on dev; per-PR copies (about 540 MB each) only crowd the 10 GB quota.
      - name: Restore Playwright browsers
        if: steps.previous.outputs.hit != 'true'
        id: playwright-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux' && steps.previous.outputs.hit != 'true'
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true' && steps.previous.outputs.hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Run app e2e tests
        if: steps.previous.outputs.hit != 'true'
        working-directory: packages/app
        # Specs are split by measured time (script/e2e-shard.ts), not file count; the assignment fails the step
        # if the script fails instead of falling back to every spec.
        run: |
          files=$(bun script/e2e-shard.ts ${{ matrix.shard }} 3)
          [ -n "$files" ] || { echo "::error::e2e shard produced an empty file list"; exit 1; }
          mapfile -t selected <<< "$files"
          bun run test:e2e:local "${selected[@]}"
        env:
          CI: true
        # The unsharded single-worker suite took 20-30 minutes.
        timeout-minutes: 30

      - name: Upload Playwright artifacts
        if: always() && steps.previous.outputs.hit != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.settings.name }}-${{ matrix.shard }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report

      - name: Record the pass
        if: steps.previous.outputs.hit != 'true' && steps.previous.outputs.key != ''
        run: mkdir -p .tests-passed && echo "${{ github.sha }}" > .tests-passed/sha

      - name: Save the pass
        if: steps.previous.outputs.hit != 'true' && steps.previous.outputs.key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tests-passed
          key: ${{ steps.previous.outputs.key }}
