name: test

# CI runs once per epic, not per unit of work: add the `epic` label to the epic PR
# (remove and re-add it to rerun) or dispatch the workflow manually.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      windows_e2e:
        description: Also run the e2e suite on Windows (unit tests always run on Windows)
        type: boolean
        default: false
      cold:
        description: Run every test, replaying no Turbo cache and skipping no recorded pass (measures cold lane times)
        type: boolean
        default: false
      # The merge queue's lane gate (docs/specs/maestro-lead/merge-queue.md section 7.2): a lane bundle dispatches this
      # workflow with its affected packages, and unit tests run only those. Empty runs everything, as before.
      packages:
        description: Comma-separated workspace packages to unit-test (a merge queue lane); empty tests every package
        type: string
        default: ""

concurrency:
  # Non-epic label events skip every job; give them their own group so they cannot cancel an epic run.
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'epic') && format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) || format('{0}-skip-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The account runs at most 20 hosted jobs at once across all workflows and PRs, and GitHub
  # cancels jobs it cannot place. The unit and e2e matrices are sized by `plan` from measured times
  # (packages/script/src/test-plan.ts, packages/script/src/test-timings.json), about 4.5 minutes of test time per Linux job and
  # 6 per Windows job, so their job count follows the suite. `max-parallel` on both matrices keeps at
  # most 15 of them running at once; the rest queue instead of being cancelled. Add the 4 fixed jobs
  # (atlas scope, atlas, the two Omni producers) and the plan job to count what one epic run asks for.
  #
  # Every test job has a 10-minute timeout, setup included: a hung Windows build once held a runner
  # past 40 minutes, and the GitHub default is 6 hours. A job that grows past it needs more shards
  # (refresh packages/script/src/test-timings.json), not a longer timeout. See .orchestra/skills/ci-lanes-maintenance.
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'epic'
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      unit: ${{ steps.plan.outputs.unit }}
      e2e: ${{ steps.plan.outputs.e2e }}
      e2e_shards: ${{ steps.plan.outputs.e2e_shards }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # The planner is plain TypeScript run by Node's type stripping, so this job installs nothing else.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Plan the shards
        id: plan
        run: node packages/script/src/test-plan.ts plan

  atlas-scope:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'epic'
    name: atlas scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Detect Atlas-relevant changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # A lane dispatch runs Atlas only when its packages include Atlas.
            if [ -n "$PACKAGES" ] && [[ ",$PACKAGES," != *",atlas,"* && ",$PACKAGES," != *",@orchestra/atlas-boundary,"* ]]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if printf '%s\n' "$changed" | grep -Eq '^(modules/atlas/|\.github/workflows/test\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  atlas:
    name: atlas
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: atlas-scope
    # Atlas guards cover its vendor subtree; a failed scope detector fails this workflow rather than skipping it.
    if: (github.event_name != 'pull_request' && inputs.packages == '') || needs.atlas-scope.outputs.changed == 'true'
    defaults:
      run:
        working-directory: modules/atlas
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: modules/atlas/package-lock.json

      # modules/atlas/.github/workflows/ci.yml documents Atlas's standalone
      # contract. This host-level job makes that contract reachable in this repo.
      - name: Install Atlas dependencies
        run: npm ci

      - name: Typecheck Atlas
        run: npm run typecheck

      - name: Set Atlas EARS baseline
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
        run: node ../../script/atlas-baseline.mjs "$BASE_SHA"

      - name: Run Atlas guards
        run: |
          npm run godfile-guard
          npm run layer-guard
          npm run reference-model-guard
          npm run spec-conformance-guard
          npm run id-integrity
          npm run command-doc-guard
          npm run wiring-guard
          npm run adr-citation-guard
          npm run req-clause-guard
          npm run ears-coamend-guard
          npm run doc-transcript-guard
          npm run service-gate-guard
          npm run own-snapshot-guard

      - name: Test Own snapshot materializer
        run: node --test scripts/materialize-own-snapshot.test.mjs

      - name: Test Atlas historical source roots
        run: node --test scripts/git-source-root.test.mjs scripts/own-history.test.mjs

      - name: Test Own snapshot gate
        run: npm test -- harness/gates/own-snapshot-guard.test.mjs

      - name: Detect Atlas product changes
        id: atlas-diff
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          if echo "$CHANGED" | grep -qE '^(modules/atlas/(packages/|harness/|\.github/)|\.github/workflows/test\.yml)'; then
            echo "touches_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "touches_code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test Atlas product suite
        if: github.event_name != 'pull_request' || steps.atlas-diff.outputs.touches_code == 'true'
        run: npm test

  # Every package runs through Turbo in unit-rest, where unchanged packages replay from the Turbo cache.
  omni:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'epic'
    name: omni test binaries (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Exact-source omni binaries
        uses: ./.github/actions/omni-binaries
      - name: Share binaries with consuming test jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omni-test-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ env.HUGR_OMNI_ADDON }}
            ${{ env.HUGR_OMNI_SUPERVISOR }}
          if-no-files-found: error
          retention-days: 7

  unit-rest:
    needs: [omni, plan]
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'epic'
    name: unit (${{ matrix.name }} ${{ matrix.label }})
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        # Planned by packages/script/src/test-plan.ts from packages/script/src/test-timings.json: core is sharded on both systems by measured
        # time (longest file first), and the other packages keep fixed lanes. Each include entry carries the flags its
        # steps read (turbo, electron, repo_gates, relay, httpapi, hosted, rollback).
        # Linux is pinned: on 2026-10-26 ubuntu-latest moved to 26.04, where bubblewrap cannot apply seccomp in a nested
        # user namespace (run 40263348230), so every LIVE sandbox test failed. Move once the sandbox supports it.
        include: ${{ fromJSON(needs.plan.outputs.unit) }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: ${{ matrix.shard && '1' || '0' }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Tests find rg on PATH and must never download it (packages/core/src/ripgrep/binary.ts).
      - name: ripgrep
        uses: ./.github/actions/ripgrep

      - name: Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor; bubblewrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0


      - name: Linux Electron dependencies
        if: matrix.electron
        run: sudo apt-get install -y -qq xvfb xauth libgtk-3-0 libnss3 libasound2t64

      - name: Native test binaries
        uses: ./.github/actions/omni-binaries
        with:
          artifact: omni-test-${{ runner.os }}-${{ runner.arch }}

      # The CLI's native Windows artifact controls compile with `rustup run 1.98.0` (packages/core/src/
      # artifact-native-windows.ts). The same-run omni artifact above skips cargo, so nothing else installs the
      # toolchain pinned by native/omni/rust-toolchain.toml on this lane.
      - name: Rust toolchain (rust-toolchain.toml)
        if: runner.os == 'Windows' && matrix.turbo && !matrix.shard
        working-directory: native/omni
        run: rustup show active-toolchain || rustup toolchain install

      - name: Configure git identity
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      # Turbo 2 keeps its local cache in .turbo/cache. A run restores its PR's newest entry, else the one cache-warm
      # saved on dev. Turbo checks each entry against its own task hash, so the key only selects the newest blob.
      - name: Restore Turbo cache
        if: matrix.turbo && !inputs.cold
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-test-${{ runner.os }}-${{ matrix.part }}-${{ github.sha }}-${{ github.run_attempt }}
          # PR entries carry their own prefix so typecheck.yml, which restores turbo-<os>-, keeps reading dev's.
          restore-keys: |
            turbo-test-${{ runner.os }}-${{ matrix.part }}-
            turbo-test-${{ runner.os }}-
            turbo-${{ runner.os }}-

      # Extension: installed Atlas code must match its canonical producer before any consumer proof.
      - name: Check generated Atlas boundary
        if: matrix.repo_gates
        working-directory: modules/atlas/boundary
        run: bun run check:generated

      - name: Fetch target branch for godfile
        if: matrix.repo_gates
        run: git fetch origin +dev:refs/remotes/origin/dev --depth=1

      - name: Test godfile gate
        if: matrix.repo_gates
        run: bun --cwd packages/core test test/godfile.test.ts
        env:
          # Build-time scanner test starts no runtime child; ordinary suites below stay default-native.
          ORCHESTRA_EXPERIMENTAL_OMNI_SPAWNER: "0"

      # Lives beside the engine, not in a package: it imports script/guards, which module boundaries forbid across a package root.
      - name: Test guards
        if: matrix.repo_gates
        working-directory: script/guards
        run: bun test ./guards.test.ts
        env:
          ORCHESTRA_EXPERIMENTAL_OMNI_SPAWNER: "0"

      - name: Run godfile gate
        if: matrix.repo_gates
        run: bun run check:godfile

      - name: Run spawn-import gate
        if: matrix.repo_gates
        run: bun run check:spawn-imports

      # The base comparison fails when the boundary ledger gains a key or a per-rule count over dev's; it needs the full
      # history this job's packages lane checks out (fetch-depth 0), like the godfile gate.
      - name: Run module-boundary gate
        if: matrix.repo_gates
        run: bun run check:boundaries --base origin/dev

      # Every pinned ripgrep digest, not only the runners' platforms, against upstream's .sha256 files.
      - name: Run ripgrep pin gate
        if: matrix.repo_gates
        run: bun run check:ripgrep-pins
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run unit tests
        if: matrix.turbo
        # The job limit is 10 minutes with setup; a failed step still reaches the Turbo cache save.
        timeout-minutes: 8
        run: |
          read -ra filters <<< "$FILTERS"
          # A shard that selects no test task must fail, not pass: a filter that stops matching would otherwise
          # turn a lane green while running nothing.
          if [ -z "$SHARD" ]; then
            selected=$(bun turbo test --dry=json "${filters[@]}" | jq -r '[.tasks[]? | select(.task == "test" and ((.command // "") != "<NONEXISTENT>")) | .package] | sort | join(" ")')
            echo "shard $PART selects: $selected"
            [ -n "$selected" ] || { echo "::error::shard $PART selects no test task"; exit 1; }
          fi
          # A lane dispatch tests only its packages that this shard selects; a shard with none of them has nothing to run.
          if [ -n "$PACKAGES" ]; then
            shard=$(bun turbo test --dry=json "${filters[@]}" | jq -r '.tasks[]? | select(.task == "test" and ((.command // "") != "<NONEXISTENT>")) | .package' | sort -u)
            wanted=$(tr ', ' '\n\n' <<< "$PACKAGES" | sed '/^$/d' | sort -u)
            mapfile -t lane < <(comm -12 <(printf '%s\n' "$shard") <(printf '%s\n' "$wanted"))
            [ -n "${lane[0]:-}" ] || { echo "shard $PART has no package of this lane"; exit 0; }
            echo "shard $PART tests lane packages: ${lane[*]}"
            filters=("${lane[@]/#/--filter=}")
          fi
          # Core is sharded on both systems: shard i/n takes the i-th bin of the time-balanced split (packages/script/src/test-plan.ts).
          # The plan job and this step read the same inputs, so the n shards cover every test file once.
          if [ -n "$SHARD" ]; then
            if [ -n "$PACKAGES" ] && ! tr ', ' '\n\n' <<< "$PACKAGES" | grep -qx '@orchestra/core'; then echo "shard $PART has no package of this lane"; exit 0; fi
            mapfile -t files < <(bun packages/script/src/test-plan.ts shard packages/core "$(tr '[:upper:]' '[:lower:]' <<< "$RUNNER_OS")" "${SHARD%/*}" "${SHARD#*/}")
            [ -n "${files[0]:-}" ] || { echo "::error::shard $PART selects no test file"; exit 1; }
            echo "shard $PART runs ${#files[@]} files"
            # A cold run also writes a JUnit report; its per-file times refresh packages/script/src/test-timings.json.
            report=()
            if [ "$COLD" = "true" ]; then
              mkdir -p "$RUNNER_TEMP/junit"
              report=(--reporter=junit "--reporter-outfile=$RUNNER_TEMP/junit/$(tr '[:upper:]' '[:lower:]' <<< "$RUNNER_OS")-$PART.xml")
            fi
            # Through turbo, so each shard keeps its own cache entry: the file list is part of the task hash.
            GITHUB_ACTIONS=false exec bun turbo test --filter=@orchestra/core -- "${files[@]}" "${report[@]}"
          fi
          # Cold embedded startup on Windows and contract generation on Linux exceeded unchanged deadlines
          # when sharing the runner with another runtime suite. Keep every package and per-test budget.
          concurrency=1
          # Turbo stops scheduling at the first failed task by default, so one red package hid every package after it
          # (run 38157434225: core failed and the CLI suite never started). Each package runs once its dependencies
          # pass; any failure still fails the step.
          GITHUB_ACTIONS=false bun turbo test --concurrency="$concurrency" --continue=dependencies-successful "${filters[@]}"
        env:
          FILTERS: ${{ matrix.filters }}
          PART: ${{ matrix.part }}
          SHARD: ${{ matrix.shard }}
          COLD: ${{ inputs.cold }}
          PACKAGES: ${{ inputs.packages }}
          ORCHESTRA_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      # Saved even when a package failed: Turbo records only passing tasks, so re-labeling the PR replays them
      # (about 1 MB per entry).
      - name: Save Turbo cache
        if: always() && matrix.turbo
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-test-${{ runner.os }}-${{ matrix.part }}-${{ github.sha }}-${{ github.run_attempt }}

      # A cold run keeps the JUnit reports; `bun packages/script/src/test-plan.ts refresh <dir>` folds them into packages/script/src/test-timings.json.
      - name: Upload JUnit timings
        if: always() && inputs.cold && matrix.shard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ runner.os }}-${{ matrix.part }}
          path: ${{ runner.temp }}/junit
          if-no-files-found: ignore
          retention-days: 14

      - name: Check generated client
        if: matrix.httpapi
        working-directory: packages/client
        run: bun run check:generated

      - name: Run HttpApi exerciser gates
        if: matrix.httpapi
        # Effect mode runs every scenario against a fresh in-memory server; fail instead of holding the runner if one wedges.
        timeout-minutes: 8
        working-directory: packages/server
        run: bun run test:httpapi

      # Hosted proofs are excluded from Bun's suffix discovery and run by exact path, so they run here and nowhere else.
      # Linux needs the AppArmor relaxation above for bubblewrap; the srt endpoint proof starts Cassandra, ScyllaDB and
      # PostgreSQL in Docker, which the runner provides. `declared` asks the omni control to count only tests that declare
      # a spawn (a hosted proof is not a suite). The endpoint proof goes first: it requires the srt runtime to be absent,
      # and the other two install it.
      - name: Run hosted sandbox proofs
        if: matrix.hosted && runner.os == 'Linux'
        timeout-minutes: 8
        working-directory: packages/core
        run: bun test --timeout 120000 ./test/tool-safety-srt-endpoint.hosted.ts ./test/tool-safety-srt-read-alias.hosted.ts ./test/tool-safety-sandbox-project-config.hosted.ts
        env:
          ORCHESTRA_OMNI_CONTROL: declared

      # Linux observes procfs birth and Windows pins a .NET handle: the one proof runs on both.
      - name: Run hosted process query proof
        if: ${{ !cancelled() && matrix.hosted }}
        timeout-minutes: 5
        working-directory: packages/core
        run: bun test --timeout 120000 ./test/windows-process-query.hosted.ts
        env:
          ORCHESTRA_OMNI_CONTROL: declared

      # Relay's retained Python oracle runs even when an earlier step failed, so one failure does not
      # hide the other. Benchmark runtime tests nest real pytest campaigns and stay manual:
      # `python -m pytest tests/test_benchmark_runtime.py` from modules/relay.
      - name: Setup Python for Relay
        if: ${{ !cancelled() && matrix.relay }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modules/relay/requirements-dev.txt

      - name: Install Relay test dependencies
        if: ${{ !cancelled() && matrix.relay }}
        run: python -m pip install -r modules/relay/requirements-dev.txt

      - name: Test Relay
        if: ${{ !cancelled() && matrix.relay }}
        timeout-minutes: 5
        working-directory: modules/relay
        # tests/test_docs.py already runs the doc structure guard on the real tree; only the index check is extra.
        # Every test isolates itself in tmp_path, ephemeral ports and env-scoped directories, so xdist is safe;
        # `--durations` shows which tests to watch. The two shell tests are scripts, not pytest files.
        run: |
          python -m pytest tests -q -p no:cacheprovider -n auto --durations=15 --ignore=tests/test_benchmark_runtime.py
          bash tests/test_arm_hook.sh
          bash tests/test_concurrent_gate.sh
          python bin/gen-doc-index.py --check

      # Legacy rollback: the same native binaries, with omni turned off for these two suites only. They run even when
      # a package failed above, as they did in a job of their own.
      - name: Real AppProcess default and legacy backend selection
        if: ${{ !cancelled() && matrix.rollback && (inputs.packages == '' || contains(format(',{0},', inputs.packages), ',@orchestra/core,')) }}
        working-directory: packages/core
        run: bun test test/omni-default-mode.test.ts test/effect/cross-spawn-spawner.test.ts --timeout 30000
        env:
          ORCHESTRA_EXPERIMENTAL_OMNI_SPAWNER: "0"
          ORCHESTRA_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"

  e2e:
    # A lane dispatch runs e2e only when its packages include the app shell.
    if: (github.event_name == 'workflow_dispatch' && (inputs.packages == '' || contains(format(',{0},', inputs.packages), ',@orchestra/app,'))) || github.event.label.name == 'epic'
    needs: plan
    name: e2e (${{ matrix.settings.name }} ${{ matrix.shard }}/${{ needs.plan.outputs.e2e_shards }})
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        # Each shard boots its own app server, so shards share no state. The plan sizes the count from
        # packages/app-shell/script/e2e-timings.json (about 4.5 minutes of specs per shard).
        shard: ${{ fromJSON(needs.plan.outputs.e2e) }}
        # e2e drives Chromium against a per-page mocked backend, so Windows repeats the Linux
        # coverage; it runs only when dispatched with windows_e2e. Windows unit tests always run.
        settings: ${{ fromJSON(inputs.windows_e2e && '[{"name":"linux","host":"ubuntu-24.04"},{"name":"windows","host":"windows-latest"}]' || '[{"name":"linux","host":"ubuntu-24.04"}]') }}
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # e2e drives the app shell package; its Turbo hash covers the shell plus every workspace dependency.
      - name: Check for a previous pass
        if: ${{ !inputs.cold }}
        id: previous
        uses: ./.github/actions/previous-pass
        with:
          task: "@orchestra/app#test"
          name: e2e-${{ matrix.settings.name }}-${{ matrix.shard }}of${{ needs.plan.outputs.e2e_shards }}

      - name: Setup Node
        if: steps.previous.outputs.hit != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Playwright 1.59 hangs while extracting Chromium with Node 24.16.
          node-version: "24.15"

      - name: Setup Bun
        if: steps.previous.outputs.hit != 'true'
        uses: ./.github/actions/setup-bun

      # Tests find rg on PATH and must never download it (packages/core/src/ripgrep/binary.ts).
      - name: ripgrep
        if: steps.previous.outputs.hit != 'true'
        uses: ./.github/actions/ripgrep

      - name: Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor; bubblewrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0


      - name: Read Playwright version
        if: steps.previous.outputs.hit != 'true'
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # cache-warm saves the browsers on dev; per-PR copies (about 540 MB each) only crowd the 10 GB quota.
      - name: Restore Playwright browsers
        if: steps.previous.outputs.hit != 'true'
        id: playwright-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux' && steps.previous.outputs.hit != 'true'
        working-directory: packages/app-shell
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true' && steps.previous.outputs.hit != 'true'
        working-directory: packages/app-shell
        run: bunx playwright install chromium

      - name: Run app e2e tests
        if: steps.previous.outputs.hit != 'true'
        working-directory: packages/app-shell
        # Specs are split by measured time (script/e2e-shard.ts), not file count; the assignment fails the step
        # if the script fails instead of falling back to every spec.
        run: |
          files=$(bun script/e2e-shard.ts ${{ matrix.shard }} ${{ needs.plan.outputs.e2e_shards }})
          [ -n "$files" ] || { echo "::error::e2e shard produced an empty file list"; exit 1; }
          mapfile -t selected <<< "$files"
          bun run test:e2e:local "${selected[@]}"
        env:
          CI: true
        # The unsharded single-worker suite took 20-30 minutes; a shard is planned at about 4.5.
        timeout-minutes: 8

      - name: Upload Playwright artifacts
        if: always() && steps.previous.outputs.hit != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.settings.name }}-${{ matrix.shard }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app-shell/e2e/test-results
            packages/app-shell/e2e/playwright-report

      - name: Record the pass
        if: steps.previous.outputs.hit != 'true' && steps.previous.outputs.key != ''
        run: mkdir -p .tests-passed && echo "${{ github.sha }}" > .tests-passed/sha

      - name: Save the pass
        if: steps.previous.outputs.hit != 'true' && steps.previous.outputs.key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tests-passed
          key: ${{ steps.previous.outputs.key }}
