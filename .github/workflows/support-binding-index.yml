name: Support evaluation manifest binding index
on:
  push:
    branches: [genesis-support-10-binding-index]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: modules/atlas
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: modules/atlas/package-lock.json
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Build and typecheck workspace
        run: npm run build
      - name: Differential synthetic binding-index tests
        run: npx --no-install vitest run packages/adapter-io/test/evaluation-manifest-binding-index.test.ts --reporter=default
