name: toolkit-arm

# Manual only: the backend toolkit pins linux-arm64 and darwin-arm64 targets, but test:ci runs x64 hosts. Dispatch
# this on a ref to observe the real engines on Arm; it costs nothing until run. `tests` runs the toolkit test files
# (real pinned engines in backend-toolkit-cli, fixtures elsewhere); `prefetch` acquires every engine one at a time,
# runs each with its version flag, and lists the result per engine in the job summary.
# Scope `tree-sitter` runs only the native grammar lane: the published linux-arm64 prebuilds must fail to load here,
# and the core binding must be absent after an install without lifecycle scripts (as Nix and the release lanes install);
# both then load and parse, under Node and Bun, after packages/script/src/tree-sitter-prebuilds-cli.ts builds them from source,
# and the compiled linux-arm64 CLI extracts symbols with the copies it ships in bin/tree-sitter.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Which Arm lanes to run
        type: choice
        options: [toolkit, tree-sitter]
        default: toolkit

permissions:
  contents: read

jobs:
  arm:
    if: inputs.scope != 'tree-sitter'
    name: ${{ matrix.part }} (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04-arm, macos-15]
        part: [tests, prefetch]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # bun test lanes find rg on PATH and must never download it (packages/core/src/ripgrep/binary.ts).
      - name: ripgrep
        uses: ./.github/actions/ripgrep

      # The toolkit's installers run through the hugr-omni spawner, which cargo builds here on a cache miss.
      - name: omni binaries
        uses: ./.github/actions/omni-binaries

      - name: Host
        run: |
          echo "arch=$(uname -m) runner_arch=$RUNNER_ARCH"
          cd packages/core
          bun -e 'import { BackendToolkitTarget } from "./src/backend-toolkit/target"; console.log(JSON.stringify(BackendToolkitTarget.detect()))'

      - name: Toolkit tests
        if: matrix.part == 'tests'
        working-directory: packages/core
        run: GITHUB_ACTIONS=false bun test --timeout 120000 ./test/backend-toolkit*.test.ts

      - name: Acquire every engine
        if: matrix.part == 'prefetch'
        working-directory: packages/core
        run: |
          cat > .toolkit-arm-probe.ts <<'TS'
          import { appendFileSync } from "fs"
          import { Effect } from "effect"
          import { BackendToolkit } from "./src/backend-toolkit"
          import { BackendToolkitManifest } from "./src/backend-toolkit/manifest"
          import { BackendToolkitTarget } from "./src/backend-toolkit/target"

          const host = BackendToolkitTarget.detect()
          const rows: string[] = [`host: ${JSON.stringify(host)}`, "", "| engine | state | probe |", "| --- | --- | --- |"]
          let broken = 0
          for (const id of Object.keys(BackendToolkitManifest.ENGINES) as BackendToolkitManifest.EngineId[]) {
            const [state] = await Effect.runPromise(BackendToolkit.prefetch([id]))
            if (state.status !== "ready") {
              if (state.status !== "unsupported") broken++
              rows.push(`| ${id} | ${state.status}: ${"cause" in state ? state.cause : "reason" in state ? "unsupported-target:" + state.reason : ""} | |`)
              continue
            }
            // Engines disagree on the spelling; the first that exits 0 proves the binary executes on this host.
            const tries = [["--version"], ["version"], ["-version"], ["-v"], ["--help"]].map((args) => ({
              args,
              probe: Bun.spawnSync([state.executable, ...args], { stdout: "pipe", stderr: "pipe", timeout: 30_000 }),
            }))
            const hit = tries.find((item) => item.probe.exitCode === 0) ?? tries[0]
            if (hit.probe.exitCode !== 0) broken++
            const lines = (hit.probe.stdout.toString() + hit.probe.stderr.toString()).trim().split("\n")
            const shown = (hit.probe.exitCode === 0 ? lines[0] : lines.at(-1)) ?? ""
            rows.push(`| ${id} | ready | ${hit.args.join(" ")} exit ${hit.probe.exitCode}: ${shown.replaceAll("|", "/")} |`)
          }
          console.log(rows.join("\n"))
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### prefetch ${process.env.RUNNER_ARCH} ${process.env.RUNNER_OS}\n${rows.join("\n")}\n`)
          if (broken) throw new Error(`${broken} engine(s) failed to acquire or run`)
          TS
          bun .toolkit-arm-probe.ts

  tree-sitter:
    if: inputs.scope == 'tree-sitter'
    name: tree-sitter grammars (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Explicit flags skip the node_modules cache, whose key Linux x64 and Arm share. --ignore-scripts leaves the core
      # tree-sitter package without the build its install script would compile, as a packaging install does.
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile --ignore-scripts

      # bun test lanes find rg on PATH and must never download it (packages/core/src/ripgrep/binary.ts).
      - name: ripgrep
        uses: ./.github/actions/ripgrep

      - name: Guard tests before any repair
        working-directory: packages/script
        run: bun test --timeout 600000 ./src/tree-sitter-prebuilds.test.ts

      - name: Published typescript and javascript prebuilds and the core binding do not load on Arm
        working-directory: modules/maestro/arsenal
        run: |
          for grammar in tree-sitter-typescript tree-sitter-javascript; do
            if node -e 'const ts = require.resolve("tree-sitter-typescript"); require(require.resolve(process.argv[1], { paths: [ts] }))' "$grammar"; then
              echo "::error::$grammar loaded before the repair; the upstream bug this lane proves is gone"
              exit 1
            fi
          done
          if node -e 'require("tree-sitter")'; then
            echo "::error::the core tree-sitter binding loaded before the repair; the install was not script-free"
            exit 1
          fi

      - name: Rebuild from source
        run: bun packages/script/src/tree-sitter-prebuilds-cli.ts linux arm64

      - name: Every grammar loads and parses with the repaired prebuilds
        working-directory: modules/maestro/arsenal
        run: |
          node -e '
            const Parser = require("tree-sitter")
            const ts = require.resolve("tree-sitter-typescript")
            const grammars = { typescript: require("tree-sitter-typescript").typescript, tsx: require("tree-sitter-typescript").tsx,
              javascript: require(require.resolve("tree-sitter-javascript", { paths: [ts] })), python: require("tree-sitter-python") }
            const source = { typescript: "const a: number = 1", tsx: "const a = <b/>", javascript: "const a = 1", python: "a = 1" }
            for (const [name, language] of Object.entries(grammars)) {
              const parser = new Parser()
              parser.setLanguage(language)
              const root = parser.parse(source[name]).rootNode
              if (root.hasError) throw new Error(`${name} parse error: ${root.toString()}`)
              console.log(`${name}: ${root.type} ${root.toString()}`)
            }'
          # Bun loads only prebuilds/linux-arm64/tree-sitter.node; arsenal's own extraction must be complete there.
          bun -e '
            import { extractNative } from "./src/onboard/extract.ts"
            const result = extractNative("a.ts", "import { b } from \"./b\"\nexport const a: number = 1")
            console.log(JSON.stringify(result))
            if (!result.coverage.complete || result.symbols[0]?.name !== "a") process.exit(1)'
          # The guard now passes with nothing left to rebuild.
          bun ../../../packages/script/src/tree-sitter-prebuilds-cli.ts linux arm64 | grep -F '"rebuilt":[]'

      # A compiled CLI has no node_modules: it ships these bindings in bin/tree-sitter and parses from beside itself.
      - name: The compiled linux-arm64 CLI extracts real symbols with the tree-sitter it ships
        working-directory: apps/cli
        run: GITHUB_ACTIONS=false bun test --timeout 900000 ./test/tree-sitter-bundle.test.ts
