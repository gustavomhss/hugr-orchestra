name: genesis-runtime-qualification

# Residual qualification only; original atlas-pilot remains the shared gate evidence.
on:
  workflow_dispatch:
  push:
    branches: ["genesis-runtime-resume"]
    paths:
      - ".github/workflows/genesis-runtime-qualification.yml"
      - "modules/atlas/docs/design/genesis-chatgpt-results/20261111-v3-fresh/resume-20261128/runtime-qualification/qualification.py"
      - "modules/atlas/docs/design/genesis-chatgpt-results/20261111-v3-fresh/resume-20261128/runtime-qualification/input-lock.json"

permissions:
  contents: read

concurrency:
  group: genesis-runtime-qualification-${{ github.ref }}
  cancel-in-progress: false

env:
  RUNTIME_SHA: 9b0188b2be5ea69638dff8a44e3e931b4d6d8b10
  QUALIFICATION_PATH: modules/atlas/docs/design/genesis-chatgpt-results/20261111-v3-fresh/resume-20261128/runtime-qualification

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Pin runtime in its own worktree
        shell: bash
        run: |
          set -euo pipefail
          QUALIFICATION_ROOT="$RUNNER_TEMP/genesis-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "QUALIFICATION_ROOT=$QUALIFICATION_ROOT" >> "$GITHUB_ENV"
          test ! -e "$QUALIFICATION_ROOT"
          mkdir -p "$QUALIFICATION_ROOT"
          git cat-file -e "$RUNTIME_SHA^{commit}"
          git worktree add --detach "$QUALIFICATION_ROOT/runtime" "$RUNTIME_SHA"
          test "$(git -C "$QUALIFICATION_ROOT/runtime" rev-parse HEAD)" = "$RUNTIME_SHA"
      - name: Install exact Atlas dependencies
        working-directory: ${{ env.QUALIFICATION_ROOT }}/runtime/modules/atlas
        run: npm ci
      - name: Build and typecheck the pinned runtime
        working-directory: ${{ env.QUALIFICATION_ROOT }}/runtime/modules/atlas
        run: bun typecheck
      - name: Verify installed hashing dependency drift is refused
        working-directory: ${{ env.QUALIFICATION_ROOT }}/runtime/modules/atlas
        shell: bash
        run: |
          set -euo pipefail
          CONTROL_DIR="$QUALIFICATION_ROOT/noble-control"
          mkdir "$CONTROL_DIR"
          export ATLAS_ISOLATED_NOBLE_CONTROL=1
          export ATLAS_NOBLE_CONTROL_RUNTIME="$RUNTIME_SHA"
          export ATLAS_NOBLE_CONTROL_RECEIPT="$CONTROL_DIR/receipt.json"
          TEST=packages/adapter-io/test/evaluation-runtime-noble.test.ts
          KERNEL_MANIFEST=packages/kernel/package.json
          cp "$KERNEL_MANIFEST" "$CONTROL_DIR/kernel.corrected.json"
          trap 'cp "$CONTROL_DIR/kernel.corrected.json" "$KERNEL_MANIFEST"' EXIT
          git show db9b4235022c4df32fe3bfd4faeea8adcd69abb7:modules/atlas/packages/kernel/package.json > "$KERNEL_MANIFEST"
          set +e
          npx --no-install vitest run "$TEST" --reporter=json --outputFile="$CONTROL_DIR/baseline.json"
          baseline_status=$?
          set -e
          test "$baseline_status" -eq 1
          node - "$CONTROL_DIR/baseline.json" <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const failures = report.testResults.flatMap((file) => file.assertionResults).filter((test) => test.status === 'failed')
          if (failures.length !== 1 || !failures[0].failureMessages.some((message) => message.includes('installed Noble bytes must be bound'))) {
            throw new Error('Baseline did not fail the installed dependency binding assertion')
          }
          NODE
          cp "$CONTROL_DIR/kernel.corrected.json" "$KERNEL_MANIFEST"
          trap - EXIT
          npx --no-install vitest run "$TEST" --reporter=default --reporter=json --outputFile="$CONTROL_DIR/corrected.json"
          test -s "$ATLAS_NOBLE_CONTROL_RECEIPT"
          git diff --exit-code HEAD -- "$KERNEL_MANIFEST"
      - name: Qualify the complete packages through the original CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 "$QUALIFICATION_PATH/qualification.py" \
            --repository "$GITHUB_WORKSPACE" \
            --runtime-root "$QUALIFICATION_ROOT/runtime" \
            --state-dir "$QUALIFICATION_ROOT/data" \
            --output-dir "$QUALIFICATION_ROOT/evidence" \
            --lock "$QUALIFICATION_PATH/input-lock.json"
      - name: Preserve package and execution receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genesis-runtime-prepare-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ env.QUALIFICATION_ROOT }}/evidence
            ${{ env.QUALIFICATION_ROOT }}/noble-control
          retention-days: 30

  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Check the current branch against dev
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/genesis-runtime-guards"
          GUARD_BASE_SHA="$(git rev-parse origin/dev)"
          export GUARD_BASE_SHA
          set +e
          bun run check:guards --base origin/dev > "$RUNNER_TEMP/genesis-runtime-guards/guards.log" 2>&1
          GUARD_EXIT="$?"
          set -e
          export GUARD_EXIT
          cat "$RUNNER_TEMP/genesis-runtime-guards/guards.log"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "genesis-runtime-guards"
          raw = (root / "guards.log").read_bytes()
          receipt = {
              "schema": "genesis-s4-guards/v1",
              "candidate_revision": os.environ["GITHUB_SHA"],
              "base_ref": "origin/dev",
              "base_sha": os.environ["GUARD_BASE_SHA"],
              "argv": ["bun", "run", "check:guards", "--base", "origin/dev"],
              "exit_code": int(os.environ["GUARD_EXIT"]),
              "log_sha256": hashlib.sha256(raw).hexdigest(),
              "log_bytes": len(raw),
          }
          (root / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print("GENESIS_RUNTIME_GUARDS_JSON=" + json.dumps(receipt, sort_keys=True))
          PY
          exit "$GUARD_EXIT"
      - name: Preserve actual guard result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genesis-runtime-guards-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/genesis-runtime-guards
          retention-days: 30
