name: nix-toolchain

# Gate extension: native toolchain execution and mutation probes, not app closure.
on:
  push:
    branches: [nix-closure]
    paths: ["nix/**", ".github/workflows/nix-toolchain.yml"]
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-toolchain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  native-toolchain:
    if: github.event_name != 'pull_request' || github.event.label.name == 'epic'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Labels/architectures verified against GitHub's hosted-runner reference.
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-15-intel
            system: x86_64-darwin
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
      - name: Native toolchain checks and negative controls
        shell: bash
        env:
          TOOLCHAIN_LOG_DIR: ${{ runner.temp }}/nix-toolchain-${{ matrix.system }}
        run: bash nix/check-toolchain.sh '${{ matrix.system }}'
      - name: Preserve toolchain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nix-toolchain-${{ matrix.system }}
          path: ${{ runner.temp }}/nix-toolchain-${{ matrix.system }}
          if-no-files-found: error
          retention-days: 14
