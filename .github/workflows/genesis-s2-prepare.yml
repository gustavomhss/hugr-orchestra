name: genesis-s2-prepare

on:
  workflow_dispatch:
    inputs:
      admit_exact_candidate:
        description: Admit the independently reviewed exact candidate in isolated state
        required: true
        type: boolean
        default: false
      run_consumer_routes:
        description: Run the frozen initial consumer route after exact admission
        required: true
        type: boolean
        default: false
      await_consumer_followup:
        description: Wait up to seven minutes for run-bound follow-up routes
        required: true
        type: boolean
        default: false
      recheck_i2u:
        description: Recheck only S2-I2U with two scoped reads on the original exact candidate
        type: boolean
        default: false
      prepare_s2_u1:
        description: Prepare the distinct isolated S2-U1 maintenance baseline
        type: boolean
        default: false
      admit_exact_m0:
        description: Admit the separately reviewed exact S2-U1 baseline
        type: boolean
        default: false
      run_reuse_and_drift:
        description: Run real reuse and isolated drift planning after M0 admission
        type: boolean
        default: false
      admit_exact_m1:
        description: Finalize, resume and admit only a separately reviewed exact U1 M1 target
        type: boolean
        default: false
      admit_exact_m2:
        description: Finalize, resume and admit only a separately reviewed exact U1 M2 target
        type: boolean
        default: false
      amendment_stage:
        description: Prepare the isolated S2 correction or admit it and run four retries
        type: choice
        options: [off, prepare, admit]
        default: off
  push:
    branches: ["genesis-interfaces-resume"]
    paths:
      - ".github/workflows/genesis-s2-prepare.yml"
      - "script/genesis-s2/**"

permissions:
  contents: read

concurrency:
  group: genesis-s2-prepare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'workflow_dispatch' || inputs.prepare_s2_u1 != true || inputs.recheck_i2u == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Create the exact runtime worktree
        shell: bash
        run: |
          set -euo pipefail
          # Candidate identity includes the corpus root; replay the verified prepare at its bound path.
          ROOT="$RUNNER_TEMP/genesis-s2-46158062855-1"
          echo "S2_ROOT=$ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ROOT/evidence"
          git cat-file -e '9b0188b2be5ea69638dff8a44e3e931b4d6d8b10^{commit}'
          git worktree add --detach "$ROOT/runtime" 9b0188b2be5ea69638dff8a44e3e931b4d6d8b10
          test "$(git -C "$ROOT/runtime" rev-parse HEAD)" = 9b0188b2be5ea69638dff8a44e3e931b4d6d8b10
      - name: Install Atlas dependencies
        working-directory: ${{ env.S2_ROOT }}/runtime/modules/atlas
        run: npm ci
      - name: Build and typecheck runtime
        working-directory: ${{ env.S2_ROOT }}/runtime/modules/atlas
        run: bun typecheck
      - name: Materialize and guard the original prepare CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 script/genesis-s2/prepare.py \
            --repository "$GITHUB_WORKSPACE" \
            --runtime "$S2_ROOT/runtime" \
            --output "$S2_ROOT/evidence/run"
          jq -e --arg candidate ade18f60d8b143fc90fae24bc5c6cd1c14d1e56756800f14b65d19f7eacdf542 \
            '.candidate_id == $candidate and .state == "PREPARED_NOT_ADMITTED"' "$S2_ROOT/evidence/run/verification.json"
      - name: Admit the exact reviewed candidate in isolated state
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.admit_exact_candidate == true || inputs.run_consumer_routes == true || inputs.recheck_i2u == true || inputs.amendment_stage == 'prepare' || inputs.amendment_stage == 'admit') }}
        env:
          ADMIT_EXACT_CANDIDATE: ${{ inputs.admit_exact_candidate || inputs.run_consumer_routes || inputs.recheck_i2u || inputs.amendment_stage == 'prepare' || inputs.amendment_stage == 'admit' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 script/genesis-s2/admit.py \
            --runtime "$S2_ROOT/runtime" \
            --source "$S2_ROOT/evidence/run/corpus" \
            --prepared "$S2_ROOT/evidence/run/prepared.json" \
            --binding-directory "$GITHUB_WORKSPACE/modules/atlas/docs/design/genesis-chatgpt-results/20261111-v3-fresh/s2/resume-20261128/runtime-followup/admission-ade18f60" \
            --output "$S2_ROOT/evidence/admission"
      - name: Prepare or admit the exact S2 correction
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.amendment_stage == 'prepare' || inputs.amendment_stage == 'admit') }}
        env:
          AMENDMENT_STAGE: ${{ inputs.amendment_stage }}
        run: python3 script/genesis-s2/amend.py --stage "$AMENDMENT_STAGE"
      - name: Run the initial routed reader calls
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_consumer_routes == true && inputs.recheck_i2u != true }}
        env:
          RUN_CONSUMER_ROUTES: 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 script/genesis-s2/consume.py \
            --runtime "$S2_ROOT/runtime" --source "$S2_ROOT/evidence/run/corpus" \
            --prepared "$S2_ROOT/evidence/run/prepared.json" --admission "$S2_ROOT/evidence/admission" \
            --routing "$GITHUB_WORKSPACE/script/genesis-s2/consumer-routing.json" \
            --output "$S2_ROOT/evidence/consumer-routes" --phase initial
      - name: Upload initial traces for follow-up selection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_consumer_routes == true && inputs.recheck_i2u != true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genesis-s2-initial-routes-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ env.S2_ROOT }}/evidence/consumer-routes/initial
          retention-days: 30
      - name: Await a run-bound follow-up on the same runner
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_consumer_routes == true && inputs.await_consumer_followup == true && inputs.recheck_i2u != true }}
        env:
          RUN_CONSUMER_ROUTES: 'true'
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 script/genesis-s2/consume.py \
            --runtime "$S2_ROOT/runtime" --source "$S2_ROOT/evidence/run/corpus" \
            --prepared "$S2_ROOT/evidence/run/prepared.json" --admission "$S2_ROOT/evidence/admission" \
            --routing "$GITHUB_WORKSPACE/script/genesis-s2/consumer-routing.json" \
            --output "$S2_ROOT/evidence/consumer-routes" --phase followup --wait-followup
      - name: Run accepted follow-up without resetting budgets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_consumer_routes == true && inputs.await_consumer_followup == true && inputs.recheck_i2u != true }}
        env:
          RUN_CONSUMER_ROUTES: 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 script/genesis-s2/consume.py \
            --runtime "$S2_ROOT/runtime" --source "$S2_ROOT/evidence/run/corpus" \
            --prepared "$S2_ROOT/evidence/run/prepared.json" --admission "$S2_ROOT/evidence/admission" \
            --routing "$GITHUB_WORKSPACE/script/genesis-s2/consumer-routing.json" \
            --output "$S2_ROOT/evidence/consumer-routes" --phase followup
      - name: Recheck S2-I2U against two sections of the exact admitted knowledge
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.recheck_i2u == true }}
        env:
          RUN_CONSUMER_ROUTES: 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 script/genesis-s2/consume.py \
            --runtime "$S2_ROOT/runtime" --source "$S2_ROOT/evidence/run/corpus" \
            --prepared "$S2_ROOT/evidence/run/prepared.json" --admission "$S2_ROOT/evidence/admission" \
            --routing "$GITHUB_WORKSPACE/script/genesis-s2/consumer-recheck.json" \
            --output "$S2_ROOT/evidence/consumer-routes" --phase recheck
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genesis-s2-prepare-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ env.S2_ROOT }}/evidence
          retention-days: 30

  u1-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_s2_u1 == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Validate selected phases
        if: ${{ (inputs.run_reuse_and_drift == true && inputs.admit_exact_m0 != true) || (inputs.admit_exact_m1 == true && inputs.run_reuse_and_drift != true) || (inputs.admit_exact_m2 == true && inputs.admit_exact_m1 != true) }}
        run: |
          echo 'Each S2-U1 admission phase requires its reviewed predecessor in the same run.' >&2
          exit 1
      - name: Create fixed runtime
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/genesis-s2-u1-v1"
          echo "U1_ROOT=$ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ROOT/evidence"
          git worktree add --detach "$ROOT/runtime" 9b0188b2be5ea69638dff8a44e3e931b4d6d8b10
      - name: Install Atlas dependencies
        working-directory: ${{ env.U1_ROOT }}/runtime/modules/atlas
        run: npm ci
      - name: Typecheck runtime
        working-directory: ${{ env.U1_ROOT }}/runtime/modules/atlas
        run: bun typecheck
      - name: Prepare M0 after the recorded consumer run
        run: python3 script/genesis-s2/u1-baseline.py
      - name: Admit independently reviewed exact M0
        if: ${{ inputs.admit_exact_m0 == true }}
        env:
          ADMIT_U1_M0: 'true'
        run: |
          python3 script/genesis-s2/u1-admit.py \
            --runtime "$U1_ROOT/runtime" --source "$U1_ROOT/evidence/run/corpus" \
            --prepared "$U1_ROOT/evidence/run/u1-prepared.json" \
            --binding-directory "$GITHUB_WORKSPACE/script/genesis-s2/u1-admission" \
            --output "$U1_ROOT/evidence/admission"
      - name: Run actual reuse and isolated drift planning
        if: ${{ inputs.admit_exact_m0 == true && inputs.run_reuse_and_drift == true }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--summary "$U1_ROOT/evidence/admission/summary.json")
          if [[ -f script/genesis-s2/u1-producers/manifest.json ]]; then
            args+=(--producer-manifest script/genesis-s2/u1-producers/manifest.json)
          fi
          python3 script/genesis-s2/u1-operate.py "${args[@]}"
      - name: Finalize the exact M1 private target
        if: ${{ inputs.admit_exact_m1 == true }}
        shell: bash
        run: |
          set -euo pipefail
          root="$U1_ROOT/evidence/u1-operation"
          python3 script/genesis-s2/u1-admit-target.py --phase finalize --target M1 \
            --request "$root/changed-prepare.request.json" --target-file "$root/target-checkpoint/result.json" \
            --callback-root "$root/target-checkpoint" --binding-directory script/genesis-s2/u1-target-binding/m1 \
            --output "$U1_ROOT/evidence/u1-m1-admission"
      - name: Resume, admit and read the exact M1 target
        if: ${{ inputs.admit_exact_m1 == true }}
        shell: bash
        run: |
          set -euo pipefail
          root="$U1_ROOT/evidence/u1-operation"
          python3 script/genesis-s2/u1-admit-target.py --phase resume --target M1 \
            --request "$root/changed-prepare.request.json" --target-file "$root/target-checkpoint/result.json" \
            --callback-root "$root/target-checkpoint" --binding-directory script/genesis-s2/u1-target-binding/m1 \
            --output "$U1_ROOT/evidence/u1-m1-admission"
      - name: Capture the original bytes again in the fresh M2 sibling
        if: ${{ inputs.admit_exact_m1 == true }}
        shell: bash
        run: |
          set -euo pipefail
          root="$U1_ROOT/evidence/u1-operation"
          python3 script/genesis-s2/u1-admit-target.py --phase restore-capture --target M1 \
            --request "$root/changed-prepare.request.json" --target-file "$root/target-checkpoint/result.json" \
            --callback-root "$root/target-checkpoint" --binding-directory script/genesis-s2/u1-target-binding/m1 \
            --output "$U1_ROOT/evidence/u1-m1-admission"
      - name: Finalize the exact M2 private target
        if: ${{ inputs.admit_exact_m2 == true }}
        shell: bash
        run: |
          set -euo pipefail
          root="$U1_ROOT/evidence/u1-m1-admission"
          python3 script/genesis-s2/u1-admit-target.py --phase finalize --target M2 \
            --request "$root/restoration-prepare-request.json" --target-file "$root/restoration-prepared-checkpoint/result.json" \
            --callback-root "$root/restoration-prepared-checkpoint" --binding-directory script/genesis-s2/u1-target-binding/m2 \
            --output "$U1_ROOT/evidence/u1-m2-admission"
      - name: Resume and read M2, then verify identical reuse
        if: ${{ inputs.admit_exact_m2 == true }}
        shell: bash
        run: |
          set -euo pipefail
          root="$U1_ROOT/evidence/u1-m1-admission"
          python3 script/genesis-s2/u1-admit-target.py --phase resume --target M2 \
            --request "$root/restoration-prepare-request.json" --target-file "$root/restoration-prepared-checkpoint/result.json" \
            --callback-root "$root/restoration-prepared-checkpoint" --binding-directory script/genesis-s2/u1-target-binding/m2 \
            --output "$U1_ROOT/evidence/u1-m2-admission"
      - name: Preserve baseline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genesis-s2-u1-baseline-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: ${{ env.U1_ROOT }}/evidence
          include-hidden-files: true
          retention-days: 30
