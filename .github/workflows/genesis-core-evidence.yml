name: genesis-core-evidence

on:
  workflow_dispatch:
  push:
    branches: ["genesis-core-resume"]
    paths:
      - ".github/workflows/genesis-core-evidence.yml"
      - "modules/atlas/docs/design/genesis-chatgpt-results/20261111-v3-fresh/s1/resume-20261128/operations/guards.py"

permissions:
  contents: read

concurrency:
  group: genesis-core-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        selection: [current-s1, accepted-api]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Run unchanged guard and recover exact historical binary
        shell: bash
        env:
          SELECTION: ${{ matrix.selection }}
        run: |
          set -euo pipefail
          EVIDENCE_ROOT="$RUNNER_TEMP/genesis-core-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$SELECTION"
          echo "EVIDENCE_ROOT=$EVIDENCE_ROOT" >> "$GITHUB_ENV"
          test ! -e "$EVIDENCE_ROOT"
          mkdir -p "$EVIDENCE_ROOT"
          CANDIDATE_SHA="$GITHUB_SHA"
          CANDIDATE_ROOT="$GITHUB_WORKSPACE"
          if [ "$SELECTION" = accepted-api ]; then
            CANDIDATE_SHA=d81a973d98ebe9b1f6db779bfc78af5152f14041
            CANDIDATE_ROOT="$EVIDENCE_ROOT/candidate"
            git worktree add --detach "$CANDIDATE_ROOT" "$CANDIDATE_SHA"
          fi
          python3 modules/atlas/docs/design/genesis-chatgpt-results/20261111-v3-fresh/s1/resume-20261128/operations/guards.py \
            --repository "$CANDIDATE_ROOT" \
            --candidate "$CANDIDATE_SHA" \
            --output "$EVIDENCE_ROOT/receipts"
      - name: Preserve original guard output and recovered bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genesis-core-guards-${{ matrix.selection }}-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ env.EVIDENCE_ROOT }}/receipts
          retention-days: 30
