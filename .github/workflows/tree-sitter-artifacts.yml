name: tree-sitter-artifacts

# The tree-sitter bundle a compiled CLI ships in bin/tree-sitter, per target, exported on that target's own OS and CPU:
# only that host can build the core binding (and repair a mislabeled grammar prebuild), so a cross build cannot make it.
# Each job runs packages/script/src/tree-sitter-prebuilds.ts <os> <arch> --out, which checks every file and every
# binding's CPU, and uploads `tree-sitter-<os>-<arch>`. A cross build downloads it to <dir>/<os>-<arch>/ and passes
# TREE_SITTER_ARTIFACTS=<dir> to the CLI build, as it passes OMNI_ARTIFACTS for omni-artifacts.yml's builds.
on:
  workflow_call:
    inputs:
      targets:
        description: 'JSON array of <os>-<arch> targets, e.g. ["linux-arm64","win32-arm64"]'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      targets:
        description: "JSON array of <os>-<arch> targets"
        type: string
        default: '["linux-x64","linux-arm64","darwin-x64","darwin-arm64","win32-x64","win32-arm64"]'

permissions:
  contents: read

jobs:
  export:
    name: tree-sitter ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    # An unknown target has no runner and fails here.
    runs-on: ${{ fromJSON('{"linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","darwin-x64":"macos-15-intel","darwin-arm64":"macos-15","win32-x64":"windows-2022","win32-arm64":"windows-11-arm"}')[matrix.target] }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # node-gyp builds the core binding for the CPU of the Node that runs it.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
          bun-download-url: ${{ matrix.target == 'win32-arm64' && 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-windows-aarch64.zip' || '' }}

      - name: Require the target's own host
        run: |
          host=$(node -p 'process.platform + "-" + process.arch')
          [ "$host" = "$TARGET" ] || { echo "::error::tree-sitter $TARGET must be exported on a $TARGET host, not $host"; exit 1; }

      # As the release lanes and Nix install: the core package's install script does not run.
      - name: Install without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Export the bundle
        run: bun packages/script/src/tree-sitter-prebuilds.ts "${TARGET%-*}" "${TARGET#*-}" --out "$RUNNER_TEMP/tree-sitter"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tree-sitter-${{ matrix.target }}
          path: ${{ runner.temp }}/tree-sitter/${{ matrix.target }}/
          if-no-files-found: error
