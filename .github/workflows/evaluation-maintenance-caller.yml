name: evaluation-maintenance-caller-synthetic
on:
  push:
    branches:
      - genesis-evaluation-maintenance-caller-ci
      - genesis-support-06-caller-toolchain
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: modules/atlas
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: modules/atlas/package-lock.json
      - name: Record toolchain versions
        run: |
          node --version
          npm --version
      - run: npm ci
      - run: npm run build
      - name: Caller boundary and synthetic real-host integration
        run: |
          set -o pipefail
          npx vitest run packages/adapter-io/test/evaluation-maintenance-caller.test.ts packages/adapter-io/test/evaluation-maintenance-caller.integration.test.ts 2>&1 | tee maintenance-caller.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: maintenance-caller-log-${{ github.sha }}
          path: modules/atlas/maintenance-caller.log
      - name: Verify each output and record overlay base
        shell: bash
        run: |
          set -euo pipefail
          files=(packages/adapter-io/dist/src/evaluation-maintenance-host.js packages/adapter-io/dist/src/evaluation-maintenance-host.d.ts packages/adapter-io/dist/src/evaluation-maintenance-caller.js packages/adapter-io/dist/src/evaluation-maintenance-caller.d.ts)
          for file in "${files[@]}"; do
            if [[ ! -f "$file" || ! -s "$file" || -L "$file" ]]; then
              printf 'Missing, empty or symlink output: %s\\n' "$file" >&2
              exit 1
            fi
          done
          {
            printf 'schema=maintenance-caller-overlay/v1\\nkind=overlay-not-standalone\\n'
            printf 'base_commit=%s\\nrepository=%s\\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY"
            printf 'requires=complete-built-modules-atlas-tree-at-base_commit\\n'
            printf 'source_family=host-v3-plus-evaluation-implementation-v6\\n'
            printf 'host_source_commit=3aa3bd492f852cbf3711b7b6fb4647316560d0ec\\n'
            printf '\\n[sha256-relative-to-modules-atlas]\\n'
            sha256sum "${files[@]}" packages/adapter-io/src/evaluation-maintenance-host.ts packages/adapter-io/src/evaluation-maintenance-caller.ts packages/adapter-io/src/evaluation-rebuild.ts packages/adapter-io/src/ownership-rebuild.ts package.json package-lock.json
          } > maintenance-caller-overlay-manifest.txt
      - name: Export external host and caller overlay, not standalone package
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maintenance-caller-dist-${{ github.sha }}
          if-no-files-found: error
          path: |
            modules/atlas/maintenance-caller-overlay-manifest.txt
            modules/atlas/packages/adapter-io/dist/src/evaluation-maintenance-host.js
            modules/atlas/packages/adapter-io/dist/src/evaluation-maintenance-host.d.ts
            modules/atlas/packages/adapter-io/dist/src/evaluation-maintenance-caller.js
            modules/atlas/packages/adapter-io/dist/src/evaluation-maintenance-caller.d.ts
