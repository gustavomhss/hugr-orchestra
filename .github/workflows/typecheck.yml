name: maestro-claude-authenticated-smoke
on: workflow_dispatch
permissions:
  contents: read
jobs:
  authenticated-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      - name: Authenticate the pinned Claude binary and verify the hosted Read
        working-directory: modules/engine-adapters/claude-code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bun .ci-authenticated-smoke.ts
