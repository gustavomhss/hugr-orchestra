name: typecheck

# CI runs once per epic, not per unit of work: add the `epic` label to the epic PR
# (remove and re-add it to rerun) or dispatch the workflow manually.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

jobs:
  typecheck:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'epic'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Saved by cache-warm on dev; see the Turbo cache note in test.yml.
      - name: Restore Turbo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Run typecheck
        # Standard private runners have 2 vCPUs and ~8 GB RAM. tsgo already uses every core, and the
        # opencode package alone peaks near 5 GB, so Turbo's default 10 parallel tasks exhaust memory
        # and the runner is shut down. Serial checks peak below 6 GB and finish faster than pairs.
        run: bun turbo typecheck --concurrency=1
