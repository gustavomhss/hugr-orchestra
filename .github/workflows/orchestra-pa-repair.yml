name: Orchestra PA repair final metadata
on:
  push:
    branches: [visual-migration-plan]
    paths: [.github/workflows/orchestra-pa-repair.yml]
permissions:
  contents: write
concurrency:
  group: orchestra-visual-pa-repairs
  cancel-in-progress: false
jobs:
  finalize:
    if: github.repository == 'gmhelmold/HuGR-Orchestra'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: visual-migration-plan
          fetch-depth: 1
      - name: Align current registry provenance with verified publication
        run: |
          cd specs/orchestra-visual
          python3 - <<'PY'
          import json,pathlib,hashlib
          def load(p):return json.loads(pathlib.Path(p).read_text())
          def save(p,x):pathlib.Path(p).write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n')
          pub=load('PUBLICATION.json');qa=load('reviews/parallelism-performance/repairs/QA-GITHUB.json')
          assert pub['contract_revision']=='4.2' and pub['ticket_bodies_status']=='VERIFIED' and pub['native_relationships']=='VERIFIED'
          assert qa['status']=='PASS' and qa['tooling_tests_passed']==202 and qa['product_execution']=='NOT_RUN'
          g=load('GITHUB.json');g['entry_commit']=pub['plan_and_projection_commit'];g['entry_url']='https://github.com/gmhelmold/HuGR-Orchestra/blob/visual-migration-plan/specs/orchestra-visual/EXECUTE.md'
          g['native_relationships_note']='Verified PA repair readback: '+pub['verification_run'];g['native_relationships_applied_by_this_session']=True
          save('GITHUB.json',g)
          p='reviews/parallelism-performance/repairs/RESOLUTION.json';r=load(p)
          r['github_verification']={'status':'PASS','tests':202,'run_url':qa['run_url'],'report':'QA-GITHUB.json','native_report':'PUBLICATION.json','product_execution':'NOT_RUN'};save(p,r)
          p=pathlib.Path('reviews/parallelism-performance/repairs/REVIEW.md');text=p.read_text()
          marker='<!-- pa42-github-verified -->'
          if marker not in text:
              text+='\n'+marker+'\n## Verificação publicada\n\nOs 202 testes únicos passaram no checkout do GitHub (151 anteriores adaptados, 13 de navegação e 38 regressões PA). Os 39 corpos subordinados, 39 vínculos de hierarquia e 59 dependências nativas foram conferidos por leitura posterior. Consulte [QA-GITHUB.json](QA-GITHUB.json) e [PUBLICATION.json](PUBLICATION.json). Os 189 testes locais relatados anteriormente são uma passagem anterior, não outro conjunto a somar. Produto continua NOT_RUN.\n'
          p.write_text(text)
          assert hashlib.sha256(pathlib.Path('PLAN.json').read_bytes()).hexdigest()==pub['plan_sha256']
          PY
      - name: Recheck all tools and navigation after metadata alignment
        run: |
          cd specs/orchestra-visual
          python3 tools/render_navigation.py --check --repo "$GITHUB_WORKSPACE"
          python3 tools/render_issues.py --check
          python3 tools/render_maps.py --check
          python3 tools/verify_brand.py
          python3 tools/validate_plan.py
          python3 -m unittest discover -s tools -p 'test_*.py' -v > reviews/parallelism-performance/repairs/final-tools.log 2>&1 || { cat reviews/parallelism-performance/repairs/final-tools.log; exit 1; }
          tail -5 reviews/parallelism-performance/repairs/final-tools.log
          python3 reviews/parallelism-performance/repairs/publish.py manifest
      - name: Commit verified metadata and validate exact Git objects
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- specs/orchestra-visual
          git commit -m 'docs(app): finalize verified parallelism repair provenance'
          git push origin HEAD:visual-migration-plan
          python3 - <<'PY'
          import hashlib,pathlib,subprocess,json
          root=pathlib.Path('specs/orchestra-visual');count=0
          for row in (root/'MANIFEST.sha256').read_text().splitlines():
              sha,name=row.split('  ',1);data=subprocess.check_output(['git','show','HEAD:'+str(root/name)])
              assert hashlib.sha256(data).hexdigest()==sha,name
              count+=1
          assert not subprocess.check_output(['git','status','--porcelain']).strip()
          print(json.dumps({'status':'PASS','manifest_files':count,'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'product_execution':'NOT_RUN'}))
          PY
