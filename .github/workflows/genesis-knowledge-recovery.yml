name: genesis-knowledge-recovery

on:
  workflow_dispatch:
    inputs:
      publish_full15:
        description: 'Publish the approved exact candidate in the disposable Actions corpus'
        type: boolean
        default: false
  push:
    branches: ["genesis-knowledge-resume"]
    paths:
      - ".github/workflows/genesis-knowledge-recovery.yml"
      - "modules/atlas/docs/design/genesis-chatgpt-results/20261111-v3-fresh/s4/native-package.json"
      - "modules/atlas/docs/design/genesis-chatgpt-results/20261111-v3-fresh/s4/l4-acceptance.json"
      - "modules/atlas/docs/design/genesis-chatgpt-results/20261111-v3-fresh/s4/verify-knowledge.py"
      - "modules/atlas/docs/design/genesis-chatgpt-results/20261111-v3-fresh/s4/judgments/l4-root/responses/j1-canonical-r2.json"
      - "modules/atlas/docs/design/genesis-chatgpt-results/20261111-v3-fresh/s4/runtime/own-20261128/prepare-full15.py"

permissions:
  contents: read

concurrency:
  group: genesis-knowledge-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Verify recovered bytes and complete package
        shell: bash
        run: |
          set -euo pipefail
          S4_PATH=modules/atlas/docs/design/genesis-chatgpt-results/20261111-v3-fresh/s4
          EVIDENCE_DIR="$RUNNER_TEMP/genesis-knowledge-$GITHUB_RUN_ID"
          mkdir "$EVIDENCE_DIR"
          git show "81d7a103b444d82abb3ad594805d80b346bc5799:$S4_PATH/native-package.json" > "$EVIDENCE_DIR/base-package.json"
          git show "c4a2992369f2309cbb5ffb8f166abbd7c3b81a4c:$S4_PATH/runtime/maintenance-operation.mjs" > "$EVIDENCE_DIR/historical-driver.mjs"
          python3 "$S4_PATH/verify-knowledge.py" --repository "$GITHUB_WORKSPACE" \
            --base-package "$EVIDENCE_DIR/base-package.json" \
            --historical-driver "$EVIDENCE_DIR/historical-driver.mjs" \
            --output "$EVIDENCE_DIR/integrity-receipt.json"
      - name: Check repository guards
        run: bun run check:guards --base origin/dev
      - name: Preserve integrity receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genesis-knowledge-integrity-${{ github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/genesis-knowledge-${{ github.run_id }}/integrity-receipt.json
          retention-days: 30

  prepare-full15:
    env:
      RUNTIME_SHA: 9b0188b2be5ea69638dff8a44e3e931b4d6d8b10
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Pin runtime and install Atlas dependencies
        run: |
          set -euo pipefail
          [[ "$RUNTIME_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$RUNTIME_SHA^{commit}"
          git worktree add --detach "$RUNNER_TEMP/s4-runtime" "$RUNTIME_SHA"
          test "$(git -C "$RUNNER_TEMP/s4-runtime" rev-parse HEAD)" = "$RUNTIME_SHA"
          cd "$RUNNER_TEMP/s4-runtime/modules/atlas"
          npm ci
          bun typecheck
      - name: Materialize exact S4 and prepare
        run: |
          set -euo pipefail
          python3 modules/atlas/docs/design/genesis-chatgpt-results/20261111-v3-fresh/s4/runtime/own-20261128/prepare-full15.py \
            --repository "$GITHUB_WORKSPACE" --runtime-root "$RUNNER_TEMP/s4-runtime" --runtime-sha "$RUNTIME_SHA" \
            --source-root "$RUNNER_TEMP/s4-source" --output-dir "$RUNNER_TEMP/s4-evidence"
      - name: Publish and verify the approved S4 candidate
        if: github.event_name == 'workflow_dispatch' && inputs.publish_full15
        run: |
          set -euo pipefail
          S4_RUNTIME_DIR=modules/atlas/docs/design/genesis-chatgpt-results/20261111-v3-fresh/s4/runtime/own-20261128
          python3 "$S4_RUNTIME_DIR/publish-full15.py" \
            --runtime "$RUNNER_TEMP/s4-runtime" --source "$RUNNER_TEMP/s4-source" \
            --prepared "$RUNNER_TEMP/s4-evidence/prepared.json" \
            --binding-directory "$S4_RUNTIME_DIR/binding-full15" --output "$RUNNER_TEMP/s4-publication"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s4-knowledge-prepare-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/s4-evidence
            ${{ runner.temp }}/s4-source/.atlas/cas
          if-no-files-found: error
          retention-days: 30
      - name: Preserve publication and reader receipts
        if: always() && github.event_name == 'workflow_dispatch' && inputs.publish_full15
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s4-isolated-publication-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/s4-publication
            ${{ runner.temp }}/s4-source/.atlas
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
