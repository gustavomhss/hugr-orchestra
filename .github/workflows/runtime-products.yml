name: runtime-products

# Native CLI/resource/service proof only; Desktop channels, packaging and WSL remain unproved.
# The dedicated branch bootstraps this workflow before default-branch registration.
on:
  push:
    branches: [runtime-validation]
    paths: [.github/workflows/runtime-products.yml]
  workflow_dispatch:
    inputs:
      windows_x64_only:
        description: Requalify only the Windows x64 baseline lane; other lanes require separate evidence
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  models:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Acquire one real models.dev snapshot for all product builds
        run: |
          bun -e '
          const response = await fetch("https://models.dev/api.json", { signal: AbortSignal.timeout(60000) });
          if (!response.ok) throw Error(`MODELS_SNAPSHOT_HTTP_FAILURE:${response.status}`);
          const bytes = await response.arrayBuffer();
          const data = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(bytes));
          if (!data || typeof data !== "object" || Array.isArray(data) || Object.keys(data).length === 0) throw Error("MODELS_SNAPSHOT_EMPTY_OR_INVALID");
          await Bun.write("models-api.json", bytes);'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: models-dev-snapshot
          path: models-api.json
          if-no-files-found: error

  # Every native lane but Windows ARM64 (omni off) ships an omni pair; the Linux x64 Windows ARM64 producer takes its
  # tree-sitter bundle from a Windows ARM64 host.
  omni:
    uses: ./.github/workflows/omni-artifacts.yml

  tree-sitter:
    if: ${{ !inputs.windows_x64_only }}
    uses: ./.github/workflows/tree-sitter-artifacts.yml
    with:
      targets: '["win32-arm64"]'

  native:
    needs: [models, omni]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows_x64_only && '[{"host":"windows-2022","target":"windows-x64-baseline","omni":"win32-x64-msvc"}]' || '[{"host":"macos-15-intel","target":"darwin-x64-baseline","omni":"darwin-x64"},{"host":"macos-15","target":"darwin-arm64","omni":"darwin-arm64"},{"host":"ubuntu-24.04","target":"linux-x64-baseline","omni":"linux-x64-gnu"},{"host":"ubuntu-24.04-arm","target":"linux-arm64","omni":"linux-arm64-gnu"},{"host":"windows-2022","target":"windows-x64-baseline","omni":"win32-x64-msvc"}]') }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Acquire and verify the real Windows x64 baseline compiler
        if: matrix.target == 'windows-x64-baseline'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'bun-windows-x64-baseline-v1.3.14.zip'
          Invoke-WebRequest -Uri 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-windows-x64-baseline.zip' -OutFile $archive -TimeoutSec 90
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '538f9c846355d9e847b2671bc00c47da4229a0befb24df3282b739770f3b475f') { throw 'BASELINE_ARCHIVE_SHA256_MISMATCH' }
          $root = Join-Path $env:RUNNER_TEMP 'bun-baseline-verified'
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          $binary = Join-Path $root 'bun-windows-x64-baseline/bun.exe'
          if (!(Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'BASELINE_BINARY_MISSING' }
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne '1.3.14') { throw 'BASELINE_BINARY_VERSION_MISMATCH' }
          (Split-Path -Parent $binary) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Output "BASELINE_COMPILER_VERIFIED version=$version archive_sha256=538f9c846355d9e847b2671bc00c47da4229a0befb24df3282b739770f3b475f"
      - name: Install once without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts --os='*' --cpu='*'
      # runtime-proof.ts loads Desktop code that imports workspace packages, so it runs after the install.
      - name: Require matching native host and exact Bun
        run: bun apps/cli/script/runtime-proof.ts --target "$TARGET" --host
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: models-dev-snapshot
          path: ${{ runner.temp }}/models-dev
      # OMNI_ARTIFACTS=<dir>/<omni id>/, as build.ts reads it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: omni-${{ matrix.omni }}
          path: ${{ runner.temp }}/omni-artifacts/${{ matrix.omni }}
      - name: Build the owned CLI with its package version
        env:
          MODELS_DEV_API_JSON: ${{ runner.temp }}/models-dev/models-api.json
          OMNI_ARTIFACTS: ${{ runner.temp }}/omni-artifacts
        run: |
          set -euo pipefail
          # download-artifact transfers file bytes, not Unix execute bits; the CLI build refuses a non-executable supervisor.
          for supervisor in "$OMNI_ARTIFACTS"/*/hugr-omni-supervisor; do
            chmod +x "$supervisor"
            [ -x "$supervisor" ] || { echo "::error::omni supervisor is not executable: $supervisor"; exit 1; }
          done
          ORCHESTRA_VERSION="$(bun -p 'require("./apps/cli/package.json").version')"
          export ORCHESTRA_VERSION
          bun apps/cli/script/build.ts --skip-install --target "$TARGET"
      - name: Execute isolated native product proof
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then
            ORCHESTRA_ARTIFACT_DARWIN_SDK="$(xcrun --sdk macosx --show-sdk-path)"
            export ORCHESTRA_ARTIFACT_DARWIN_SDK
          fi
          bun apps/cli/script/runtime-proof.ts --target "$TARGET" --report runtime-proof.json
      - name: Require the actual proof report
        run: bun apps/cli/script/runtime-proof.ts --target "$TARGET" --report runtime-proof.json --check-report
      # bin/ripgrep holds the pinned rg; the CLI searches with it, with no rg on PATH, and never downloads one, also
      # once bin/ripgrep is moved away (mutant), after which it is restored and the search passes again.
      - name: Bundled ripgrep is pinned and used, and the packaged CLI never downloads one
        run: |
          set -euo pipefail
          bin="apps/cli/dist/cli-$TARGET/bin"
          exe=orchestra
          [[ "$TARGET" != windows-* ]] || exe=orchestra.exe
          bun apps/cli/script/ripgrep-proof.ts --target "$TARGET" --binary "$bin/$exe" --ripgrep "$bin/ripgrep" --mutate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runtime-proof-${{ matrix.target }}
          path: runtime-proof.json
          if-no-files-found: error

  windows-arm64-producer:
    if: ${{ !inputs.windows_x64_only }}
    needs: [models, tree-sitter]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Install once without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts --os='*' --cpu='*'
      - name: Require native Linux producer
        run: bun apps/cli/script/runtime-proof.ts --target linux-x64-baseline --host
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: models-dev-snapshot
          path: ${{ runner.temp }}/models-dev
      # TREE_SITTER_ARTIFACTS=<dir>/<os>-<arch>/, as build.ts reads it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tree-sitter-win32-arm64
          path: ${{ runner.temp }}/tree-sitter-artifacts/win32-arm64
      - name: Build and export the actual Windows ARM64 CLI
        env:
          MODELS_DEV_API_JSON: ${{ runner.temp }}/models-dev/models-api.json
          TREE_SITTER_ARTIFACTS: ${{ runner.temp }}/tree-sitter-artifacts
        run: |
          set -euo pipefail
          ORCHESTRA_VERSION="$(bun -p 'require("./apps/cli/package.json").version')"
          export ORCHESTRA_VERSION
          bun apps/cli/script/build.ts --skip-install --target windows-arm64
          bun apps/cli/script/export-artifacts.ts --dist apps/cli/dist --out windows-arm64-resources --version "$ORCHESTRA_VERSION" --target windows-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-arm64-resources
          path: windows-arm64-resources/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-arm64-ripgrep
          path: apps/cli/dist/cli-windows-arm64/bin/ripgrep/
          if-no-files-found: error

  windows-arm64:
    needs: windows-arm64-producer
    runs-on: windows-11-arm
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-windows-aarch64.zip
      - name: Install once without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      # runtime-proof.ts loads Desktop code that imports workspace packages, so it runs after the install.
      - name: Require native Windows ARM64 Bun
        run: bun apps/cli/script/runtime-proof.ts --target windows-arm64 --host
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-arm64-resources
          path: windows-arm64-resources
      - name: Execute isolated handed-off native product proof
        run: bun apps/cli/script/runtime-proof.ts --target windows-arm64 --resources windows-arm64-resources --report runtime-proof.json
      - name: Require the actual proof report and producer digest
        run: bun apps/cli/script/runtime-proof.ts --target windows-arm64 --resources windows-arm64-resources --report runtime-proof.json --check-report
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-arm64-ripgrep
          path: windows-arm64-cli/ripgrep
      # The handed-off CLI next to the producer's bin/ripgrep, as a CLI build lays them out.
      - name: Bundled ripgrep is pinned and used, and the packaged CLI never downloads one
        run: |
          Copy-Item windows-arm64-resources/orchestra-windows-arm64.exe windows-arm64-cli/orchestra.exe
          bun apps/cli/script/ripgrep-proof.ts --target windows-arm64 --binary windows-arm64-cli/orchestra.exe --ripgrep windows-arm64-cli/ripgrep --mutate
          if ($LASTEXITCODE -ne 0) { throw "ripgrep proof failed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runtime-proof-windows-arm64
          path: runtime-proof.json
          if-no-files-found: error
