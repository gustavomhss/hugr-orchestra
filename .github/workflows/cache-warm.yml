name: cache-warm

# Epic runs are pull_request events: they can restore caches saved on dev but never save
# there, so before this workflow every epic run installed dependencies and browsers cold.
# Refreshing the shared caches after each push to dev lets every later epic run hit them.
on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    name: warm (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-24.04
          - name: windows
            host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Saves the Bun package cache (Linux) or the installed node_modules tree (Windows).
      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The only writer of the ripgrep cache that test.yml and test-ci.yml restore.
      - name: ripgrep
        uses: ./.github/actions/ripgrep
        with:
          save: "true"

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Same path and key as the e2e job in test.yml.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app-shell
        run: bunx playwright install chromium

      # The only writer of the Turbo cache that test.yml (unit-rest) and typecheck.yml restore.
      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Same Python version and dependency file as the Relay steps in test.yml, so epic runs restore this pip cache.
      - name: Setup Python for Relay
        if: runner.os == 'Linux'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modules/relay/requirements-dev.txt

      - name: Warm Relay pip cache
        if: runner.os == 'Linux'
        run: python -m pip install -r modules/relay/requirements-dev.txt

      - name: Warm typecheck
        if: runner.os == 'Linux'
        # Same memory limit as typecheck.yml.
        run: bun turbo typecheck --concurrency=1

  # The omni binary cache (addon + supervisor) that test-ci restores when a run turns omni on.
  omni:
    name: omni binaries (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: omni binaries
        uses: ./.github/actions/omni-binaries
        with:
          save: "true"
