name: cache-warm

# Epic runs are pull_request events: they can restore caches saved on dev but never save
# there, so before this workflow every epic run installed dependencies and browsers cold.
# Refreshing the shared caches after each push to dev lets every later epic run hit them.
on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    needs: omni
    name: warm (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
          - name: windows
            host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Saves the Bun package cache (Linux) or the installed node_modules tree (Windows).
      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Native binaries for default-on tests
        uses: ./.github/actions/omni-binaries
        with:
          artifact: omni-warm-${{ runner.os }}-${{ runner.arch }}

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Same path and key as the e2e job in test.yml.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      # The only writer of the Turbo cache that test.yml (unit-rest) and typecheck.yml restore.
      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Same Python version and dependency file as the Relay steps in test.yml, so epic runs restore this pip cache.
      - name: Setup Python for Relay
        if: runner.os == 'Linux'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/relay/requirements-dev.txt

      - name: Warm Relay pip cache
        if: runner.os == 'Linux'
        run: python -m pip install -r packages/relay/requirements-dev.txt

      - name: Warm typecheck
        if: runner.os == 'Linux'
        # Same memory limit as typecheck.yml.
        run: bun turbo typecheck --concurrency=1

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "orchestra"

      - name: Warm unit tests
        # httpapi-codegen is a build-time generator whose tests pin POSIX paths, so it runs on Linux only.
        run: |
          filters=(--filter='!orchestra')
          if [ "$RUNNER_OS" = Windows ]; then filters+=(--filter='!@orchestra/httpapi-codegen'); fi
          # 16 suites share a 4-vCPU runner; Turbo's default of 10 at once pushed tests that take 1-3 s alone
          # past their 5-10 s timeouts.
          GITHUB_ACTIONS=false bun turbo test --concurrency=2 "${filters[@]}"
        env:
          ORCHESTRA_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

  # The omni binary cache (addon + supervisor) that test-ci restores when a run turns omni on.
  omni:
    name: omni binaries (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: omni binaries
        uses: ./.github/actions/omni-binaries
        with:
          save: "true"

      - name: Share binaries with warm tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omni-warm-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ env.HUGR_OMNI_ADDON }}
            ${{ env.HUGR_OMNI_SUPERVISOR }}
          if-no-files-found: error
          retention-days: 1
