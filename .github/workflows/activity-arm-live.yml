name: Activity arm live proof
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to qualify
        type: string
        required: true
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/omni-binaries
      - name: Install Electron and X11 tools
        working-directory: apps/desktop
        run: |
          bun run install-electron
          sudo apt-get update -qq
          sudo apt-get install -y -qq xdotool xvfb
      - name: Exercise real Desktop approval
        working-directory: apps/desktop
        run: |
          sudo --preserve-env=PATH,CI,HUGR_OMNI_ADDON,HUGR_OMNI_SUPERVISOR xvfb-run -a "$(command -v bun)" run ./test/activity-arm-electron.hosted.ts
