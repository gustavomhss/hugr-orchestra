name: omni-desktop-smoke

# Extension: original allTrees3 plus actual Electron main/utility kill and app.quit cells.
# Only this closeout child PR triggers hosted unsigned --dir packaging. No publishing/signing claims.
on:
  workflow_dispatch:
  pull_request:
    branches: [omni-closeout]
    paths:
      - "packages/desktop/test/omni-smoke/**"
      - "packages/desktop/src/main/omni-smoke.ts"
      - "packages/desktop/src/main/server.ts"
      - ".github/workflows/omni-desktop-smoke.yml"

concurrency:
  group: omni-desktop-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A Windows desktop bundles the Linux CLIs its WSL guests run (scripts/cli-staging.ts). Each is an omni build with
  # its own Linux omni pair and tree-sitter bundle, which only Linux hosts can produce, so they come from these builds.
  guest-omni:
    uses: ./.github/workflows/omni-artifacts.yml

  guest-tree-sitter:
    uses: ./.github/workflows/tree-sitter-artifacts.yml
    with:
      targets: '["linux-x64","linux-arm64"]'

  smoke:
    name: actual packaged desktop (${{ matrix.os }})
    needs: [guest-omni, guest-tree-sitter]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DESKTOP_PR_BASE: ${{ github.event.pull_request.base.sha }}
      DESKTOP_PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact child head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Initialize exact source evidence
        run: |
          mkdir -p packages/desktop/.omni-desktop-evidence
          git rev-parse HEAD > packages/desktop/.omni-desktop-evidence/source-sha.txt

      # Windows also builds its WSL guests' Linux CLIs, whose platform packages (fff, opentui) only an all-platform install
      # provides.
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ runner.os == 'Windows' && '--frozen-lockfile --os="*" --cpu="*"' || '--frozen-lockfile' }}

      - name: Exact-source release omni binaries
        uses: ./.github/actions/omni-binaries

      # GUEST_OMNI_ARTIFACTS=<dir>/<omni id>/ and TREE_SITTER_ARTIFACTS=<dir>/<os>-<arch>/, as the CLI build reads them.
      - name: WSL guest omni pair (linux-x64-gnu)
        if: runner.os == 'Windows'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: omni-linux-x64-gnu
          path: ${{ runner.temp }}/guest-omni/linux-x64-gnu
      - name: WSL guest omni pair (linux-arm64-gnu)
        if: runner.os == 'Windows'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: omni-linux-arm64-gnu
          path: ${{ runner.temp }}/guest-omni/linux-arm64-gnu
      - name: WSL guest tree-sitter (linux-x64)
        if: runner.os == 'Windows'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tree-sitter-linux-x64
          path: ${{ runner.temp }}/guest-tree-sitter/linux-x64
      - name: WSL guest tree-sitter (linux-arm64)
        if: runner.os == 'Windows'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tree-sitter-linux-arm64
          path: ${{ runner.temp }}/guest-tree-sitter/linux-arm64
      - name: Point the build at the WSL guest artifacts
        if: runner.os == 'Windows'
        run: |
          echo "GUEST_OMNI_ARTIFACTS=$RUNNER_TEMP/guest-omni" >> "$GITHUB_ENV"
          echo "TREE_SITTER_ARTIFACTS=$RUNNER_TEMP/guest-tree-sitter" >> "$GITHUB_ENV"

      - name: Linux GUI display capability
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: Typecheck scoped smoke hook and driver
        working-directory: packages/desktop/test/omni-smoke
        run: bun typecheck

      - name: Build actual unsigned app and verify packaged Node/native bytes
        id: build
        working-directory: packages/desktop
        run: bun test/omni-smoke/build.ts

      - name: Actual packaged Desktop V2/V10, mutants then restored
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: packages/desktop
        run: |
          # App must discover its own Resources/omni. Environment cannot rescue packaging.
          unset HUGR_OMNI_ADDON HUGR_OMNI_SUPERVISOR
          bun test/omni-smoke/packaged.ts --require main,shell,terminal --diagnose-main

      # Resources/cli/ripgrep-<target>: pinned (or validly signed) rg, refused when moved away, and the packaged CLI
      # (pointed at it as main points the server, and its installed copy) searches with it and never downloads one,
      # each with its mutant (test/omni-smoke/ripgrep.ts).
      - name: Packaged ripgrep, used by the packaged CLI and never downloaded, mutants then restored
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: packages/desktop
        run: bun test/omni-smoke/ripgrep.ts

      - name: Distributables keep the executable bits of the CLI, its rg and omni
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os != 'Windows' }}
        working-directory: packages/desktop
        run: bun test/omni-smoke/distributables.ts

      - name: Preserve actual proof, red cells and source/artifact pins
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omni-desktop-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: packages/desktop/.omni-desktop-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
