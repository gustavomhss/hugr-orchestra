name: omni-desktop-smoke

# Extension: original allTrees3 plus actual Electron main/utility kill and app.quit cells.
# Hosted unsigned --dir packaging, by hand only (the omni-closeout pull_request trigger was removed: that base branch no
# longer exists). No publishing/signing claims.
on:
  workflow_dispatch:

concurrency:
  group: omni-desktop-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A Windows desktop bundles its own CLI and the Linux CLIs its WSL guests run (scripts/cli-staging.ts). Bun 1.3.14 on
  # Windows cannot cross-compile the Linux CLIs ("Failed to extract executable for 'bun-linux-aarch64-v1.3.14'"), so a
  # Linux producer builds all three, as runtime-products.yml does, with the omni pairs and tree-sitter
  # bundles built on their own hosts, and hands them to the Windows build as ORCHESTRA_CLI_PREBUILT_DIR.
  guest-omni:
    uses: ./.github/workflows/omni-artifacts.yml

  guest-tree-sitter:
    uses: ./.github/workflows/tree-sitter-artifacts.yml
    with:
      targets: '["linux-arm64","win32-x64"]'

  windows-cli:
    needs: [guest-omni, guest-tree-sitter]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact child head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile --os="*" --cpu="*"
      # OMNI_ARTIFACTS=<dir>/<omni id>/ and TREE_SITTER_ARTIFACTS=<dir>/<os>-<arch>/, as build.ts reads them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: omni-win32-x64-msvc
          path: ${{ runner.temp }}/omni-artifacts/win32-x64-msvc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: omni-linux-x64-gnu
          path: ${{ runner.temp }}/omni-artifacts/linux-x64-gnu
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: omni-linux-arm64-gnu
          path: ${{ runner.temp }}/omni-artifacts/linux-arm64-gnu
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tree-sitter-linux-arm64
          path: ${{ runner.temp }}/tree-sitter-artifacts/linux-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tree-sitter-win32-x64
          path: ${{ runner.temp }}/tree-sitter-artifacts/win32-x64
      # The smoke packages the beta channel at the package version (test/omni-smoke/build.ts); the CLIs must match.
      - name: Build and export the Windows bundle's three CLIs
        env:
          OMNI_ARTIFACTS: ${{ runner.temp }}/omni-artifacts
          TREE_SITTER_ARTIFACTS: ${{ runner.temp }}/tree-sitter-artifacts
          ORCHESTRA_CHANNEL: beta
        run: |
          set -euo pipefail
          # download-artifact transfers file bytes, not Unix execute bits; the CLI build refuses a non-executable supervisor.
          for supervisor in "$OMNI_ARTIFACTS"/*/hugr-omni-supervisor; do
            chmod +x "$supervisor"
            [ -x "$supervisor" ] || { echo "::error::omni supervisor is not executable: $supervisor"; exit 1; }
          done
          ORCHESTRA_VERSION="$(bun -p 'require("./apps/cli/package.json").version')"
          export ORCHESTRA_VERSION
          targets="windows-x64-baseline linux-arm64 linux-x64-baseline"
          for target in $targets; do
            bun apps/cli/script/build.ts --skip-install --target "$target"
          done
          bun apps/cli/script/export-artifacts.ts --dist apps/cli/dist --out windows-cli --version "$ORCHESTRA_VERSION" \
            --target windows-x64-baseline --target linux-arm64 --target linux-x64-baseline
          # A producer directory holds each target's tree-sitter-<target>/ and ripgrep-<target>/, and each CLI's
          # omni pair in omni-<target>/ (scripts/cli-staging.ts reads them there).
          for target in $targets; do
            bin="apps/cli/dist/cli-$target/bin"
            cp -R "$bin/tree-sitter" "windows-cli/tree-sitter-$target"
            cp -R "$bin/ripgrep" "windows-cli/ripgrep-$target"
            mkdir -p "windows-cli/omni-$target"
            if [[ "$target" == windows-* ]]; then
              cp "$bin/hugr_omni.node" "$bin/hugr-omni-supervisor.exe" "windows-cli/omni-$target/"
            else
              cp "$bin/hugr_omni.node" "$bin/hugr-omni-supervisor" "windows-cli/omni-$target/"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-cli
          path: windows-cli/
          if-no-files-found: error

  smoke:
    name: actual packaged desktop (${{ matrix.os }})
    needs: [windows-cli]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DESKTOP_PR_BASE: ${{ github.event.pull_request.base.sha }}
      DESKTOP_PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact child head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Initialize exact source evidence
        run: |
          mkdir -p apps/desktop/.omni-desktop-evidence
          git rev-parse HEAD > apps/desktop/.omni-desktop-evidence/source-sha.txt

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Exact-source release omni binaries
        uses: ./.github/actions/omni-binaries

      - name: The Windows bundle's CLIs from the Linux producer
        if: runner.os == 'Windows'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-cli
          path: ${{ runner.temp }}/windows-cli
      - name: Point the build at the produced CLIs
        if: runner.os == 'Windows'
        run: echo "ORCHESTRA_CLI_PREBUILT_DIR=$RUNNER_TEMP/windows-cli" >> "$GITHUB_ENV"

      - name: Linux GUI display capability
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: Typecheck scoped smoke hook and driver
        working-directory: apps/desktop/test/omni-smoke
        run: bun typecheck

      - name: Build actual unsigned app and verify packaged Node/native bytes
        id: build
        working-directory: apps/desktop
        run: bun test/omni-smoke/build.ts

      - name: Actual packaged Desktop V2/V10, mutants then restored
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: apps/desktop
        run: |
          # App must discover its own Resources/omni. Environment cannot rescue packaging.
          unset HUGR_OMNI_ADDON HUGR_OMNI_SUPERVISOR
          bun test/omni-smoke/packaged.ts --require main,shell,terminal --diagnose-main

      # Resources/cli/ripgrep-<target>: pinned (or validly signed) rg, refused when moved away, and the packaged CLI
      # (pointed at it as main points the server, and its installed copy) searches with it and never downloads one,
      # each with its mutant (test/omni-smoke/ripgrep.ts).
      - name: Packaged ripgrep, used by the packaged CLI and never downloaded, mutants then restored
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: apps/desktop
        run: bun test/omni-smoke/ripgrep.ts

      - name: Distributables keep the executable bits of the CLI, its rg and omni
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os != 'Windows' }}
        working-directory: apps/desktop
        run: bun test/omni-smoke/distributables.ts

      - name: Preserve actual proof, red cells and source/artifact pins
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: omni-desktop-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/desktop/.omni-desktop-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
