name: omni-desktop-smoke

# Extension: original allTrees3 plus actual Electron main/utility kill and app.quit cells.
# Only this closeout child PR triggers hosted unsigned --dir packaging. No publishing/signing claims.
on:
  workflow_dispatch:
  pull_request:
    branches: [omni-closeout]
    paths:
      - "packages/desktop/test/omni-smoke/**"
      - "packages/desktop/src/main/omni-smoke.ts"
      - "packages/desktop/src/main/server.ts"
      - ".github/workflows/omni-desktop-smoke.yml"

concurrency:
  group: omni-desktop-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: actual packaged desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DESKTOP_PR_BASE: ${{ github.event.pull_request.base.sha }}
      DESKTOP_PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact child head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Initialize exact source evidence
        run: |
          mkdir -p packages/desktop/.omni-desktop-evidence
          git rev-parse HEAD > packages/desktop/.omni-desktop-evidence/source-sha.txt

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Exact-source release omni binaries
        uses: ./.github/actions/omni-binaries

      - name: Linux GUI display capability
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: Typecheck scoped smoke hook and driver
        working-directory: packages/desktop/test/omni-smoke
        run: bun typecheck

      - name: Build actual unsigned app and verify packaged Node/native bytes
        id: build
        working-directory: packages/desktop
        run: bun test/omni-smoke/build.ts

      - name: Actual packaged Desktop V2/V10, mutants then restored
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: packages/desktop
        run: |
          # App must discover its own Resources/omni. Environment cannot rescue packaging.
          unset HUGR_OMNI_ADDON HUGR_OMNI_SUPERVISOR
          bun test/omni-smoke/packaged.ts --require main,shell,terminal --diagnose-main

      - name: Preserve actual proof, red cells and source/artifact pins
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omni-desktop-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: packages/desktop/.omni-desktop-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
