name: omni-desktop-smoke

# Packaged-app crash smoke for the desktop (integration plan WP4). Builds the omni binaries and an unpacked Linux app
# (electron-builder --dir), launches it under Xvfb with OPENCODE_EXPERIMENTAL_OMNI_SPAWNER=1, starts nonce trees through
# the main process and through the server API (a session shell and a terminal), kill -9s the Electron main process
# and requires 0 nonce processes 8 s later (packages/desktop/test/omni-smoke/packaged.ts). It runs by hand and on pull
# requests that touch the desktop.
on:
  workflow_dispatch:
    inputs:
      require:
        description: "Trees that must run under omni and be gone after the kill: main, shell, terminal"
        type: string
        default: "main,shell,terminal"
  pull_request:
    paths:
      - "packages/desktop/**"
      - ".github/workflows/omni-desktop-smoke.yml"

concurrency:
  group: omni-desktop-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: packaged desktop crash smoke (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: omni binaries
        uses: ./.github/actions/omni-binaries

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      # The beta channel downloads no CLI; OMNI_ARTIFACTS is where prebuild stages Resources/omni from.
      - name: Build the unpacked app
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: beta
          OPENCODE_FAST_BUILD: "1"
        run: |
          export OMNI_ARTIFACTS="$(dirname "$HUGR_OMNI_ADDON")"
          bun ./scripts/prebuild.ts
          bunx electron-vite build
          bunx electron-builder --dir --linux --config electron-builder.config.ts
          app=dist/linux-unpacked
          test -x "$app/ai.opencode.desktop.beta"
          test -f "$app/resources/omni/hugr_omni.node"
          test -x "$app/resources/omni/hugr-omni-supervisor"

      # HUGR_OMNI_* (exported by the omni-binaries action) are unset, so the app must find Resources/omni by itself.
      - name: Crash smoke
        working-directory: packages/desktop
        env:
          REQUIRE: ${{ inputs.require || 'main,shell,terminal' }}
        run: |
          unset HUGR_OMNI_ADDON HUGR_OMNI_SUPERVISOR
          bun test/omni-smoke/packaged.ts dist/linux-unpacked/ai.opencode.desktop.beta --require "$REQUIRE"

      - name: App logs
        if: failure()
        run: find "${RUNNER_TEMP:-/tmp}" /tmp -path '*opencode-onboarding-*/desktop/logs/*' -name '*.log' -exec sh -c 'echo "== $1"; tail -n 80 "$1"' _ {} \; 2>/dev/null || true
