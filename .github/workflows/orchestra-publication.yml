name: Orchestra publication

on:
  push:
    branches: [visual-migration-plan]
    paths: [.github/workflows/orchestra-publication.yml]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: orchestra-publication
  cancel-in-progress: false

jobs:
  relationships:
    if: github.repository == 'gmhelmold/HuGR-Orchestra' && github.ref == 'refs/heads/visual-migration-plan'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Reconcile only the existing visual migration tickets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: python
        run: |
          import json, os, time, urllib.request, urllib.error
          REPO = 'gmhelmold/HuGR-Orchestra'
          assert os.environ['REPO'] == REPO
          base = 'https://api.github.com/repos/' + REPO + '/issues/'
          parents = [(215,130),(215,131),(215,132),(215,133),(130,134),(130,135),(131,136),(131,137),(131,138),(132,139),(132,140),(132,141),(133,142),(133,143),(134,144),(134,145),(135,146),(135,147),(135,148),(136,149),(136,150),(136,151),(137,152),(137,153),(137,154),(138,155),(138,156),(138,157),(139,158),(139,159),(140,160),(140,161),(141,162),(141,163),(141,164),(142,165),(142,166),(142,167),(143,168)]
          deps = [(145,144),(146,145),(147,146),(148,145),(149,148),(149,165),(150,165),(151,148),(151,165),(152,165),(153,165),(154,152),(155,165),(156,165),(157,159),(157,165),(158,159),(158,165),(159,145),(160,145),(161,160),(161,165),(162,108),(162,109),(162,112),(162,114),(162,165),(163,106),(163,113),(163,114),(163,165),(164,165),(165,147),(166,149),(166,150),(166,151),(166,153),(166,154),(166,155),(166,156),(166,157),(166,158),(166,161),(166,164),(167,149),(167,150),(167,151),(167,153),(167,154),(167,155),(167,156),(167,157),(167,158),(167,161),(167,164),(168,166),(168,167)]
          allowed = set(range(130,169)) | {215}
          markers = {**{n:f'<!-- orchestra-visual:E{n-129} -->' for n in range(130,134)}, **{n:f'<!-- orchestra-visual:I{n-133:02d} -->' for n in range(134,144)}, **{n:f'<!-- orchestra-visual:S{n-143:02d} -->' for n in range(144,169)},215:'<!-- orchestra-visual:ROOT -->'}
          headers = {'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10','User-Agent':'Orchestra-publication'}
          def api(method, suffix, payload=None, missing=False):
              assert method in ('GET','POST')
              number = int(suffix.split('/')[0].split('?')[0])
              if method == 'POST':
                  assert number in allowed
                  assert suffix.endswith('/sub_issues') or suffix.endswith('/dependencies/blocked_by') or suffix == '215/comments'
              request = urllib.request.Request(base+suffix, data=json.dumps(payload).encode() if payload is not None else None, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if missing and error.code == 404:
                      return None
                  raise RuntimeError(f'{method} issue endpoint failed: HTTP {error.code}; stopped without retrying writes') from None
          def listing(suffix):
              items=[]
              for page in range(1,101):
                  rows=api('GET',suffix+f'?per_page=100&page={page}')
                  if not isinstance(rows,list): raise RuntimeError('Invalid paginated response')
                  items.extend(rows)
                  if len(rows)<100:return items
              raise RuntimeError('Incomplete pagination; stopped')
          ids={}
          for number in sorted(allowed | {b for a,b in deps}):
              row=api('GET',str(number))
              assert row['number']==number and 'pull_request' not in row
              assert row['html_url']==f'https://github.com/{REPO}/issues/{number}'
              if number in markers: assert markers[number] in (row.get('body') or ''), f'Marker mismatch #{number}'
              ids[number]=row['id']
          for parent,child in parents:
              current=api('GET',f'{child}/parent',missing=True)
              if current and current['id']!=ids[parent]:raise RuntimeError(f'Another parent owns #{child}; no reparenting')
          existing={n:{r['id'] for r in listing(f'{n}/dependencies/blocked_by')} for n in sorted({n for n,b in deps})}
          print(json.dumps({'preflight':'PASS','parent_edges':len(parents),'dependency_edges':len(deps),'root':215}))
          written=0
          for parent,child in parents:
              current=api('GET',f'{child}/parent',missing=True)
              if current and current['id']!=ids[parent]:raise RuntimeError(f'Parent changed concurrently for #{child}')
              if not current:
                  api('POST',f'{parent}/sub_issues',{'sub_issue_id':ids[child],'replace_parent':False})
                  written+=1
                  time.sleep(1.2)
              assert api('GET',f'{child}/parent')['id']==ids[parent]
          for number,blocker in deps:
              current={r['id'] for r in listing(f'{number}/dependencies/blocked_by')}
              if ids[blocker] not in current:
                  api('POST',f'{number}/dependencies/blocked_by',{'issue_id':ids[blocker]})
                  written+=1
                  time.sleep(1.2)
              assert ids[blocker] in {r['id'] for r in listing(f'{number}/dependencies/blocked_by')}
          for parent,child in parents:
              assert api('GET',f'{child}/parent')['id']==ids[parent]
          final={n:{r['id'] for r in listing(f'{n}/dependencies/blocked_by')} for n in sorted({n for n,b in deps})}
          assert all(ids[b] in final[n] for n,b in deps)
          result={'status':'PASS','root':215,'verified_parent_edges':len(parents),'verified_dependency_edges':len(deps),'writes':written,'artifact_publication':'NOT_VERIFIED_BY_THIS_JOB','product_execution':'NOT_RUN'}
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('## Hierarquia nativa verificada\n\n```json\n'+json.dumps(result,indent=2)+'\n```\n')
          api('POST','215/comments',{'body':'<!-- orchestra-publication:relationships -->\nHierarquia nativa verificada por leitura posterior: **39 vínculos pai/subissue** e **57 dependências blocked-by**. Tickets existentes preservados, sem reparenting, remoção ou fechamento. Arestas finas de WP/task continuam no PLAN.json; relações de fechamento de issue não impedem trabalhar em sua fatia inicial.\n\nRun: https://github.com/'+REPO+'/actions/runs/'+os.environ['RUN_ID']+'\n\nEste run verifica somente a organização nativa. **Não certifica publicação dos artefatos, implementação ou performance do produto.**'})
