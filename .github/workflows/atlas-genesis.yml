name: atlas-genesis

# Run Atlas genesis over this repository on a runner (genesis-hardening S6, S10-S12), with no human in the loop:
#   mine    — index the repository (TypeScript, Python modules/relay, Rust native/omni) into .atlas/index.d/,
#             then `atlas mine` once, capped at `budget` sites per arm. Stages candidates only. The
#             frontier gate and (when a model is configured) the judge decide whether the run is publishable.
#             Without the GROK_AUTH_JSON secret no model is wired: every visited site abstains and the
#             run spends nothing, which still measures the frontier and the cost of the history probe.
#   publish — same run, only with `publish: true` and a mine job that passed the gate and the binding judge:
#             hold what the judge rejected, promote the rest, build the Own snapshot and upload it as a patch.
#             Maestro opens the PR from the patch (a GITHUB_TOKEN PR would not trigger other workflows).
# workflow_dispatch only: a dispatch-only workflow can be run once it exists on the default branch (dev).
on:
  workflow_dispatch:
    inputs:
      budget:
        description: "sites per arm (ATLAS_MINE_BUDGET)"
        type: string
        default: "10"
      arms:
        description: "comma-separated arms, run one after another"
        type: string
        default: "advisory,dependency,count"
      publish:
        description: "a publishing run: the judge is binding, and a passing run promotes and builds the Own snapshot patch"
        type: boolean
        default: false
      adapter_probe_run:
        description: "probe only: reuse this run's indexes/staging to test the compiled Grok adapter; no mining or publication"
        type: string
        default: ""
      adapter_trace:
        description: "probe only: trace one previously timed-out advisory request for at most 90 seconds"
        type: boolean
        default: false
      verify_only:
        description: "run the scoped genesis recovery tests only; no credentials, indexes, model calls or publication"
        type: boolean
        default: false
      refresh_own:
        description: "verification only: materialize the reviewed, unchanged Own fact pack with current source receipts"
        type: boolean
        default: false

concurrency:
  group: ${{ (inputs.verify_only || inputs.refresh_own) && 'atlas-genesis-verify' || inputs.adapter_probe_run != '' && 'atlas-genesis-probe' || 'atlas-genesis' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  adapter-probe:
    name: atlas adapter probe (no reindex)
    if: inputs.verify_only || inputs.refresh_own || inputs.adapter_probe_run != '' || inputs.adapter_trace == true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_RUN: ${{ inputs.adapter_probe_run }}
      HAS_MODEL: ${{ secrets.GROK_AUTH_JSON != '' }}
      GROK_VERSION: "1.0.13"
      VERIFY_ONLY: ${{ inputs.verify_only }}
      REFRESH_OWN: ${{ inputs.refresh_own }}
    steps:
      - name: Validate probe inputs
        run: |
          if [ "$REFRESH_OWN" = true ] && [ "$VERIFY_ONLY" != true ]; then
            echo "::error::refresh_own requires verify_only"; exit 1
          fi
          if [ "$VERIFY_ONLY" != true ]; then
            [[ "$SOURCE_RUN" =~ ^[1-9][0-9]*$ ]] || { echo "::error::adapter_probe_run must be a run ID"; exit 1; }
            [ "$HAS_MODEL" = true ] || { echo "::error::adapter probe requires GROK_AUTH_JSON"; exit 1; }
          fi
          echo "OUT=$RUNNER_TEMP/atlas-adapter-probe" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Bun and install the workspace
        uses: ./.github/actions/setup-bun

      - name: Build the Atlas CLI
        working-directory: modules/atlas
        run: |
          npm ci
          bun typecheck
          test -f packages/cli/dist/src/mine-worker.js

      - name: Test genesis script bundle
        run: node --test script/atlas-genesis/*.test.mjs

      - name: Test the scoped genesis recovery bundle
        if: inputs.verify_only
        working-directory: modules/atlas
        run: |
          files=(
            packages/genesis/test/deferred-signals.test.ts
            packages/genesis/test/provable-frontier.test.ts
            packages/genesis/test/wp-fix-concurrency.test.ts
            packages/genesis/test/coverage-ledger.test.ts
            packages/genesis/test/run-failure.test.ts
            packages/cli/test/mine-deferred-signals.test.ts
            packages/cli/test/mine-budget-cap.test.ts
            packages/cli/test/mine-pool-slot.test.ts
            packages/genesis/test/open-questions.test.ts
            packages/adapter-io/test/open-questions-source.test.ts
            packages/adapter-io/test/git-history.test.ts
            packages/adapter-io/test/git-history-bridge.test.ts
            packages/adapter-io/test/git-history-memo.test.ts
            packages/adapter-io/test/git-history-frontier-szz.test.ts
            packages/adapter-io/test/git-history-szz.test.ts
            packages/adapter-io/test/git-history-selected-szz.test.ts
          )
          for file in "${files[@]}"; do test -f "$file" || { echo "::error::missing recovery test $file"; exit 1; }; done
          npm test -- "${files[@]}"

      - name: Falsify the recovery regression assertions
        if: inputs.verify_only
        working-directory: modules/atlas
        run: |
          for control in signals age authors szz-cap; do
            case "$control" in
              signals) file=packages/genesis/test/deferred-signals.test.ts ;;
              age) file=packages/adapter-io/test/git-history.test.ts ;;
              authors) file=packages/adapter-io/test/open-questions-source.test.ts ;;
              szz-cap) file=packages/adapter-io/test/git-history-selected-szz.test.ts ;;
            esac
            backup="$RUNNER_TEMP/$control.source"
            report="$RUNNER_TEMP/$control.mutation.json"
            node ../../script/atlas-genesis/recovery-mutation.mjs apply "$control" "$backup"
            trap 'node ../../script/atlas-genesis/recovery-mutation.mjs restore "$control" "$backup"' EXIT
            set +e
            npm test -- "$file" --reporter=json --outputFile="$report"
            code=$?
            set -e
            node ../../script/atlas-genesis/recovery-mutation.mjs restore "$control" "$backup"
            trap - EXIT
            node ../../script/atlas-genesis/recovery-mutation.mjs verify "$control" "$report" "$code"
          done
          git diff --exit-code -- packages/genesis/src/rank.ts packages/adapter-io/src/git-history.ts packages/adapter-io/src/open-questions-source.ts

      - name: Materialize the reviewed Own receipts
        id: own-receipts
        if: inputs.verify_only && inputs.refresh_own
        working-directory: modules/atlas
        run: |
          mkdir -p "$OUT"
          OWN_REVIEW_REV=$(git rev-parse HEAD)
          export OWN_REVIEW_REV
          for path in packages/genesis/src/extract.ts packages/genesis/src/index.ts packages/genesis/src/types.ts; do
            printf '%s\t%s\n' "$path" "$(git rev-parse "HEAD:modules/atlas/$path")"
          done > "$RUNNER_TEMP/own-blobs.tsv"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync, writeFileSync } from 'node:fs'
          const snapshot = JSON.parse(readFileSync('OWN-SNAPSHOT.json', 'utf8'))
          assert.equal(snapshot.units.length, 1)
          assert.equal(snapshot.units[0].unit.id, 'packages/genesis')
          const blobs = Object.fromEntries(readFileSync(`${process.env.RUNNER_TEMP}/own-blobs.tsv`, 'utf8')
            .trim().split('\n').map((line) => line.split('\t')))
          assert.deepEqual(Object.keys(blobs).sort(), Object.keys(snapshot.units[0].sourceBlobs).sort())
          assert(/^[a-f0-9]{40}$/.test(process.env.OWN_REVIEW_REV))
          assert(Object.values(blobs).every((blob) => /^[a-f0-9]{40}$/.test(blob)))
          snapshot.sourceRevision = process.env.OWN_REVIEW_REV
          snapshot.units[0].sourceBlobs = blobs
          writeFileSync(`${process.env.RUNNER_TEMP}/reviewed-own.json`, JSON.stringify(snapshot))
          NODE
          node scripts/materialize-own-snapshot.mjs "$RUNNER_TEMP/reviewed-own.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const input = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/reviewed-own.json`, 'utf8'))
          const output = JSON.parse(readFileSync('OWN-SNAPSHOT.json', 'utf8'))
          assert.deepEqual(output.units.map((unit) => unit.pack), input.units.map((unit) => unit.pack))
          NODE
          npm run own-snapshot-guard
          git diff --binary -- OWN-SNAPSHOT.json .orchestra/skills/own > "$OUT/recovery-own.patch"
          test -s "$OUT/recovery-own.patch"
          node ../../script/atlas-genesis/secret-scan.mjs "$OUT/recovery-own.patch"

      - name: Upload the reviewed receipt patch
        if: inputs.verify_only && inputs.refresh_own && steps.own-receipts.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-recovery-own
          path: ${{ runner.temp }}/atlas-adapter-probe/recovery-own.patch
          if-no-files-found: error
          retention-days: 14

      - name: Restore the source run indexes
        if: inputs.verify_only != true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: atlas-genesis-index
          path: .atlas/index.d
          run-id: ${{ inputs.adapter_probe_run }}
          github-token: ${{ github.token }}

      - name: Restore the source run staging evidence
        if: inputs.verify_only != true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: atlas-genesis-mine
          path: ${{ runner.temp }}/probe-source
          run-id: ${{ inputs.adapter_probe_run }}
          github-token: ${{ github.token }}

      - name: Pin the replayed source files
        if: inputs.verify_only != true
        run: |
          cp "$RUNNER_TEMP/probe-source/atlas/roots.json" .atlas/index.d/roots.json
          node script/atlas-genesis/adapter-probe.mjs prepare "$RUNNER_TEMP/probe-source/atlas/staging.json" "$OUT"
          source=$(node -e 'console.log(require(process.argv[1]).revision)' "$OUT/manifest.json")
          mapfile -t files < "$OUT/paths.txt"
          git diff --exit-code "$source" HEAD -- "${files[@]}"

      - name: Prove compiled model calls overlap
        if: inputs.verify_only != true
        run: timeout 90 node script/atlas-genesis/adapter-probe.mjs control "$OUT"

      - name: Configure the subscription adapter
        if: inputs.verify_only != true
        env:
          GROK_AUTH_JSON: ${{ secrets.GROK_AUTH_JSON }}
        run: |
          npm install -g "@xai-official/grok@$GROK_VERSION"
          grok --no-auto-update version
          script/atlas-genesis/grok-text.sh --version > "$OUT/model-identity.txt"
          umask 077
          mkdir -p "$HOME/.grok"
          printf '%s' "$GROK_AUTH_JSON" > "$HOME/.grok/auth.json"
          node -e '
            const cfg = { roles: { propose: { cmd: process.env.GITHUB_WORKSPACE + "/script/atlas-genesis/grok-text.sh", args: [] } }, timeoutMs: 300000 }
            require("node:fs").writeFileSync(process.argv[1], JSON.stringify(cfg) + "\n")
          ' "$RUNNER_TEMP/probe-model.json"
          echo "ATLAS_MODEL_CONFIG=$RUNNER_TEMP/probe-model.json" >> "$GITHUB_ENV"

      - name: Verify prompt-only policy before source requests
        if: inputs.verify_only != true
        run: |
          umask 077
          set +e
          ATLAS_GROK_OUTPUT_FORMAT=streaming-messages-json timeout 30 sh script/atlas-genesis/grok-text.sh \
            <<<"Reply with exactly the word ok" >"$RUNNER_TEMP/policy-stream.jsonl" 2>"$RUNNER_TEMP/policy-stderr.txt"
          code=$?
          set -e
          node script/atlas-genesis/grok-trace.mjs "$RUNNER_TEMP/policy-stream.jsonl" "$OUT/policy.json" "$code"

      - name: Probe each real arm through compiled workers
        if: inputs.verify_only != true && inputs.adapter_trace != true
        run: |
          status=0
          for arm in advisory dependency count; do
            timeout 360 node script/atlas-genesis/adapter-probe.mjs run "$OUT" "$arm" || status=1
          done
          exit "$status"

      - name: Trace the previously timed-out request
        if: inputs.verify_only != true && inputs.adapter_trace == true
        run: |
          umask 077
          node script/atlas-genesis/adapter-probe.mjs prompt "$OUT" "$RUNNER_TEMP/probe.prompt"
          set +e
          ATLAS_GROK_OUTPUT_FORMAT=streaming-messages-json timeout 90 sh script/atlas-genesis/grok-text.sh \
            <"$RUNNER_TEMP/probe.prompt" >"$RUNNER_TEMP/probe-stream.jsonl" 2>"$RUNNER_TEMP/probe-stderr.txt"
          code=$?
          set -e
          node script/atlas-genesis/grok-trace.mjs "$RUNNER_TEMP/probe-stream.jsonl" "$OUT/trace.json" "$code"

      - name: Remove private trace buffers
        if: always()
        run: rm -f "$RUNNER_TEMP/probe.prompt" "$RUNNER_TEMP/probe-stream.jsonl" "$RUNNER_TEMP/probe-stderr.txt" "$RUNNER_TEMP/policy-stream.jsonl" "$RUNNER_TEMP/policy-stderr.txt"

      - name: Scan probe evidence
        id: probe-scan
        if: always() && inputs.verify_only != true
        env:
          ATLAS_SCAN_SECRETS: ${{ secrets.GROK_AUTH_JSON }}
        run: |
          mkdir -p "$OUT"
          if [ -f "$HOME/.grok/auth.json" ]; then export ATLAS_SCAN_AUTH_FILE="$HOME/.grok/auth.json"; fi
          node script/atlas-genesis/secret-scan.mjs "$OUT"

      - name: Upload sanitized probe evidence
        if: always() && steps.probe-scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-adapter-probe
          path: ${{ runner.temp }}/atlas-adapter-probe
          if-no-files-found: error
          retention-days: 14

  mine:
    name: atlas genesis mine
    if: inputs.verify_only != true && inputs.refresh_own != true && inputs.adapter_probe_run == '' && inputs.adapter_trace != true
    runs-on: ubuntu-24.04
    # Generous on purpose: the history probe runs `git blame` over every mined file, and this run is what
    # measures how long that takes on this repository.
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      # publish runs only on a run the binding judge passed (a skipped judge — no model — never publishes).
      judged: ${{ steps.judge.outcome }}
    env:
      BUDGET: ${{ inputs.budget }}
      ARMS: ${{ inputs.arms }}
      HAS_MODEL: ${{ secrets.GROK_AUTH_JSON != '' }}
      # Pinned Grok Build CLI. Subscription login, not an API key. Bump deliberately.
      GROK_VERSION: "1.0.13"
    steps:
      - name: Validate inputs
        run: |
          [[ "$BUDGET" =~ ^[1-9][0-9]*$ ]] || { echo "::error::budget must be a positive integer, got '$BUDGET'"; exit 1; }
          IFS=',' read -ra arms <<< "$ARMS"
          for arm in "${arms[@]}"; do
            arm="${arm// /}"
            case "$arm" in
              advisory | dependency | count | definition) ;;
              *) echo "::error::unknown arm '$arm' (advisory, dependency, count, definition)"; exit 1 ;;
            esac
          done
          echo "OUT=$RUNNER_TEMP/atlas-genesis" >> "$GITHUB_ENV"
          echo "ATLAS_BIN=$GITHUB_WORKSPACE/modules/atlas/packages/cli/dist/src/bin.js" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The history probe reads a shallow clone as thin history and mines structurally.
          fetch-depth: 0

      # Node 24 plus the root workspace install, so scip-typescript resolves workspace imports.
      - name: Setup Bun and install the workspace
        uses: ./.github/actions/setup-bun

      - name: Build the Atlas CLI
        working-directory: modules/atlas
        run: |
          npm ci
          npx tsc -b
          test -f packages/cli/dist/src/bin.js

      - name: Index TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          mkdir -p .atlas/index.d "$OUT"
          list=$(bash script/atlas-genesis/ts-projects.sh)
          mapfile -t projects <<< "$list"
          echo "scip-typescript: ${#projects[@]} project(s): ${projects[*]}"
          npx --yes @sourcegraph/scip-typescript@0.4.0 index --cwd . --output .atlas/index.d/ts.scip "${projects[@]}" ||
            { echo "::error::indexer failed: scip-typescript (TypeScript)"; exit 1; }

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # Run inside modules/relay/lib so the dump's paths start at orchestra_relay/; roots.json rebases them.
      - name: Index Python (modules/relay)
        run: |
          python -m venv "$RUNNER_TEMP/relay-venv"
          source "$RUNNER_TEMP/relay-venv/bin/activate"
          pip install ./modules/relay/lib/orchestra_relay
          cd modules/relay/lib
          npx --yes @sourcegraph/scip-python@0.6.6 index --project-name orchestra_relay \
            --output "$GITHUB_WORKSPACE/.atlas/index.d/py.scip" ||
            { echo "::error::indexer failed: scip-python (modules/relay)"; exit 1; }

      # rust-analyzer comes from rustup for the toolchain native/omni pins (rust-toolchain.toml), so its
      # version moves only with that pin. Its dump's paths are relative to the Cargo workspace.
      - name: Index Rust (native/omni)
        working-directory: native/omni
        run: |
          rustup show active-toolchain
          rustup component add rust-analyzer
          rust-analyzer --version
          rust-analyzer scip . --output "$GITHUB_WORKSPACE/.atlas/index.d/rust.scip" ||
            { echo "::error::indexer failed: rust-analyzer (native/omni)"; exit 1; }

      - name: Write index roots
        run: |
          printf '{ "py.scip": "modules/relay/lib", "rust.scip": "native/omni" }\n' > .atlas/index.d/roots.json
          ls -l .atlas/index.d

      - name: Atlas doctor index
        run: node "$ATLAS_BIN" doctor index | tee "$OUT/doctor-index.txt"

      - name: Configure the proposer model
        if: env.HAS_MODEL == 'true'
        env:
          GROK_AUTH_JSON: ${{ secrets.GROK_AUTH_JSON }}
        run: |
          npm install -g "@xai-official/grok@$GROK_VERSION"
          grok version
          umask 077
          mkdir -p "$HOME/.grok" "$RUNNER_TEMP/atlas"
          # Subscription session. Never print it. The secret scan below refuses an artifact that contains it.
          printf '%s' "$GROK_AUTH_JSON" > "$HOME/.grok/auth.json"
          node -e '
            const cfg = { roles: { propose: { cmd: process.env.GITHUB_WORKSPACE + "/script/atlas-genesis/grok-text.sh", args: [] } }, timeoutMs: 300000 }
            require("node:fs").writeFileSync(process.argv[1], JSON.stringify(cfg, null, 2) + "\n")
          ' "$RUNNER_TEMP/atlas/model.json"
          echo "ATLAS_MODEL_CONFIG=$RUNNER_TEMP/atlas/model.json" >> "$GITHUB_ENV"

      # Fail in seconds when the subscription session is rejected. Otherwise mine pays the history probe
      # and only then discovers it.
      - name: Check the Grok session
        id: denylist
        if: env.HAS_MODEL == 'true'
        run: |
          set +e
          timeout 60 sh script/atlas-genesis/grok-text.sh <<<"Reply with the single word ok" >"$OUT/denylist.txt" 2>"$OUT/denylist.err"
          code=$?
          set -e
          if [ "$code" != 0 ]; then
            echo "::warning::Grok subscription session was rejected. This run continues with no model. Refresh GROK_AUTH_JSON."
            rm -f "$HOME/.grok/auth.json" "$RUNNER_TEMP/atlas/model.json"
            echo "wired=false" >> "$GITHUB_OUTPUT"
            echo "HAS_MODEL=false" >> "$GITHUB_ENV"
            echo "ATLAS_MODEL_CONFIG=" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "wired=true" >> "$GITHUB_OUTPUT"

      - name: Mine each arm
        id: mine
        env:
          ATLAS_MINE_PROGRESS: "1"
        run: |
          [ "$HAS_MODEL" = true ] || echo "::notice::no GROK_AUTH_JSON secret: no model is wired, every site abstains (zero spend)"
          IFS=',' read -ra raw <<< "$ARMS"
          arms=()
          for arm in "${raw[@]}"; do arms+=("${arm// /}"); done
          sorted=$(printf '%s\n' "${arms[@]}" | sort | paste -sd, -)
          # One process for the sound-default set, so createHistorySource's blame memo is paid once.
          # A per-arm process re-blames every tracked file and blew the 3h job (runs 41322455277, 41325011158).
          # A single named arm stays one process too. A custom pair is not a CLI mode, so it still loops.
          if [ "$sorted" = "advisory,count,dependency" ] || [ "${#arms[@]}" -eq 1 ]; then
            unset ATLAS_MINE_SLOT
            [ "${#arms[@]}" -eq 1 ] && export ATLAS_MINE_SLOT="${arms[0]}"
            set +e
            ATLAS_MINE_BUDGET="$BUDGET" node "$ATLAS_BIN" mine . >"$OUT/mine.txt" 2> >(tee "$OUT/mine.err" >&2)
            code=$?
            set -e
            node script/atlas-genesis/split-arms.mjs "$OUT/mine.txt" "$OUT" --code "$code" --arms "$ARMS"
            cat "$OUT/mine.txt"
            cat "$OUT/mine.err" >&2
          else
            echo "::notice::custom arm set pays the history probe once per arm"
            code=0
            for arm in "${arms[@]}"; do
              echo "::group::arm $arm (budget $BUDGET)"
              set +e
              ATLAS_MINE_SLOT="$arm" ATLAS_MINE_BUDGET="$BUDGET" node "$ATLAS_BIN" mine . >"$OUT/arm-$arm.txt" 2> >(tee "$OUT/arm-$arm.err" >&2)
              one=$?
              set -e
              echo "$one" >"$OUT/arm-$arm.code"
              cat "$OUT/arm-$arm.txt"
              cat "$OUT/arm-$arm.err" >&2
              echo "::endgroup::"
              [ "$one" -gt "$code" ] && code=$one
            done
          fi
          failed=0
          for arm in "${arms[@]}"; do
            if [ ! -f "$OUT/arm-$arm.code" ]; then
              echo "::error::arm $arm produced no result"
              failed=1
              continue
            fi
            one=$(tr -d '[:space:]' <"$OUT/arm-$arm.code")
            # 0 complete. 1 is allowed ONLY as a partial pass, which the render marks with `partial: resume at
            # rank`: a bare 1 is a usage error. 2 is a refusal or failed run, 3 an internal error.
            if [ "$one" = 1 ] && ! grep -q '^partial: resume at rank' "$OUT/arm-$arm.txt"; then
              echo "::error::arm $arm exited 1 without a partial marker"
              failed=1
            elif [ "$one" != 0 ] && [ "$one" != 1 ]; then
              echo "::error::arm $arm exited $one"
              failed=1
            fi
          done
          if [ "$code" = 1 ] && ! grep -q '^partial: resume at rank' "$OUT"/arm-*.txt; then
            echo "::error::mine exited 1 without a partial marker"
            failed=1
          elif [ "$code" != 0 ] && [ "$code" != 1 ]; then
            echo "::error::mine exited $code"
            failed=1
          fi
          exit "$failed"

      - name: Job summary
        if: always()
        run: |
          mkdir -p "$OUT"
          node script/atlas-genesis/summary.mjs "$OUT" >>"$GITHUB_STEP_SUMMARY"

      # The automated frontier gate (no human reviews the frontier): each arm's top sites must be at least 85%
      # hand-written source, by a classifier independent of the CLI's site filter. It reads the frontier TSVs the
      # summary step just wrote. A failure fails the job; the steps below still collect and upload artifacts.
      - name: Frontier gate
        id: gate
        if: always() && steps.mine.outcome != 'skipped'
        run: node script/atlas-genesis/frontier-gate.mjs "$OUT" --summary "$GITHUB_STEP_SUMMARY"

      # The automated judge (no human reviews facts): a seeded, arm-stratified sample of the staged, non-quarantined
      # candidates, each judged once by an independent model from the claim and its cited source only. judge.mjs
      # never spawns (the spawn gate covers script/); this loop runs the model and judge.mjs prepares and scores.
      # One retry on a malformed answer, then the fact counts as unverifiable and as a failed call. The bar is
      # binding on a publishing run (`publish`), advisory otherwise.
      - name: Judge sample
        id: judge
        if: steps.denylist.outputs.wired == 'true' && steps.mine.outcome == 'success' && steps.gate.outcome == 'success'
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          node script/atlas-genesis/judge.mjs prepare "$OUT/judge" --repo . --seed "$GITHUB_RUN_ID"
          for prompt in "$OUT"/judge/*.prompt; do
            [ -e "$prompt" ] || break
            out="${prompt%.prompt}.out"
            for attempt in 1 2; do
              timeout 180 sh script/atlas-genesis/grok-text.sh <"$prompt" >"$out" 2>"${prompt%.prompt}.err" || true
              node script/atlas-genesis/judge.mjs check "$out" && break
              echo "judge: $(basename "$prompt") attempt $attempt gave no valid verdict"
            done
          done
          binding=()
          [ "$PUBLISH" = true ] && binding=(--binding)
          node script/atlas-genesis/judge.mjs score "$OUT/judge" --summary "$GITHUB_STEP_SUMMARY" "${binding[@]}"

      - name: Collect artifacts
        if: always()
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          mkdir -p "$OUT/upload/atlas" "$OUT/index"
          cp "$OUT"/*.txt "$OUT"/*.code "$OUT"/*.err "$OUT"/*.tsv "$OUT/upload/" 2>/dev/null || true
          # A publishing run must carry the judge's evidence: without judge.jsonl nothing would be held.
          if [ "$PUBLISH" = true ]; then
            cp "$OUT"/judge/judge.jsonl "$OUT"/judge/judge-verdict.json "$OUT"/judge/sample.json "$OUT/upload/"
          else
            cp "$OUT"/judge/judge.jsonl "$OUT"/judge/judge-verdict.json "$OUT"/judge/sample.json "$OUT/upload/" 2>/dev/null || true
          fi
          cp .atlas/staging*.json "$OUT/upload/atlas/" 2>/dev/null || true
          [ -d .atlas/cas ] && cp -R .atlas/cas "$OUT/upload/atlas/cas"
          [ -f .atlas/index.d/roots.json ] && cp .atlas/index.d/roots.json "$OUT/upload/atlas/"
          cp .atlas/index.d/*.scip "$OUT/index/" 2>/dev/null || true
          du -sh "$OUT/upload" "$OUT/index"

      - name: Secret scan
        id: scan
        if: always()
        env:
          ATLAS_SCAN_SECRETS: ${{ secrets.GROK_AUTH_JSON }}
        run: |
          if [ -f "$HOME/.grok/auth.json" ]; then export ATLAS_SCAN_AUTH_FILE="$HOME/.grok/auth.json"; fi
          node script/atlas-genesis/secret-scan.mjs "$OUT/upload" "$OUT/index"

      - name: Upload run artifact
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-genesis-mine
          path: ${{ runner.temp }}/atlas-genesis/upload
          if-no-files-found: error
          retention-days: 30

      # The dumps promote mode restores to re-derive grounding at the same commit. Large, so kept shorter.
      - name: Upload index dumps
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-genesis-index
          path: ${{ runner.temp }}/atlas-genesis/index
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: atlas genesis publish
    needs: mine
    # Only a publishing run whose mine job passed everything, including the BINDING judge: `judged` is the judge
    # step's outcome, so a run with no model (judge skipped) never publishes.
    if: inputs.publish && needs.mine.result == 'success' && needs.mine.outputs.judged == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      ATLAS_ACTOR: atlas-genesis
      # Self-asserted ratifier name for this automated publish, NOT a secret: KNOW-8 needs a ratifier named, and
      # the judge's binding verdict is what stands behind it. Granted `atlas:mined` in the policy written below.
      ATLAS_RATIFY_TOKEN: atlas-genesis
    steps:
      - name: Set paths
        run: |
          {
            echo "OUT=$RUNNER_TEMP/atlas-publish"
            echo "ATLAS_BIN=$GITHUB_WORKSPACE/modules/atlas/packages/cli/dist/src/bin.js"
          } >> "$GITHUB_ENV"

      # The same commit the mine job ran on (this run's SHA): the emit door re-derives grounding from the tree.
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: modules/atlas/package-lock.json

      - name: Build the Atlas CLI
        working-directory: modules/atlas
        run: |
          npm ci
          npx tsc -b

      - name: Download the mine artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: atlas-genesis-mine
          path: ${{ runner.temp }}/mine

      - name: Download the index dumps
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: atlas-genesis-index
          path: .atlas/index.d

      - name: Restore staging and write the policy
        run: |
          mkdir -p .atlas/index.d "$OUT"
          cp "$RUNNER_TEMP"/mine/atlas/staging*.json .atlas/
          cp -R "$RUNNER_TEMP/mine/atlas/cas" .atlas/cas
          cp "$RUNNER_TEMP/mine/atlas/roots.json" .atlas/index.d/roots.json
          printf '%s\n' '{"t0Heuristic":{"keywords":[]},"authz":{"scopes":{"atlas:mined":["atlas-genesis"]}}}' > .atlas/policy.json

      # Refuses unless the mine artifact carries a passing judge-verdict.json and one judge.jsonl record per sampled
      # fact: without the verdicts nothing would be held.
      - name: Plan the publish
        run: node script/atlas-genesis/publish-plan.mjs plan "$OUT/plan" --repo . --judge-dir "$RUNNER_TEMP/mine"

      # Every sampled fact the judge marked false or unverifiable is held, so no pass ever promotes it.
      - name: Hold what the judge rejected
        run: |
          while read -r key; do
            [ -n "$key" ] && node "$ATLAS_BIN" hold "$key" --by atlas-genesis
          done < "$OUT/plan/held.txt"

      - name: Promote
        run: |
          mapfile -t keys < "$OUT/plan/promote.txt"
          [ "${#keys[@]}" -gt 0 ] || { echo "::error::nothing to promote: every staged candidate is quarantined or held"; exit 1; }
          set +e
          node "$ATLAS_BIN" promote "${keys[@]}" > "$OUT/promote.txt"
          code=$?
          set -e
          cat "$OUT/promote.txt"
          # The plan leaves out quarantined and held keys, so every planned key must settle: a refusal, a staging
          # read that refused ("promote read nothing"), a key that is not staged, or a count off the plan all fail,
          # whatever the exit code says.
          case "$code" in
            0 | 2) node script/atlas-genesis/publish-plan.mjs check-promote "$OUT/promote.txt" --planned "${#keys[@]}" ;;
            *) echo "::error::promote exited $code"; exit 1 ;;
          esac

      # Created through `atlas territory` (its version is a content hash; never hand-edited). The project id is the
      # one Orchestra derives (packages/core/src/project.ts): sha1 of `git-remote:<host>/<path>` of origin.
      - name: Territory catalog
        run: |
          if [ ! -f TERRITORY-CATALOG.json ]; then
            project=$(node -e 'console.log(require("node:crypto").createHash("sha1").update("git-remote:github.com/" + process.env.GITHUB_REPOSITORY).digest("hex"))')
            echo "project id: $project"
            node "$ATLAS_BIN" territory orchestra '**' --owner backend --tier T2 --project "$project"
          fi

      # Each unit is exported alone first: a unit own-export refuses (a non-FRESH fact, no tracked file) must not
      # refuse the whole snapshot. A briefing is bounded inside OWN_CAP by the composer, so size never refuses.
      - name: Own export
        run: |
          mkdir -p "$OUT/dry"
          : > "$OUT/units-kept.txt"
          : > "$OUT/units-skipped.txt"
          i=0
          while read -r unit; do
            [ -n "$unit" ] || continue
            i=$((i + 1))
            if node "$ATLAS_BIN" own-export "$unit" --out "$OUT/dry/$i.json" > "$OUT/dry/$i.txt" 2>&1; then
              echo "$unit" >> "$OUT/units-kept.txt"
            else
              echo "$unit: $(head -n 3 "$OUT/dry/$i.txt" | tr '\n' ' ')" >> "$OUT/units-skipped.txt"
            fi
          done < "$OUT/plan/units.txt"
          mapfile -t units < "$OUT/units-kept.txt"
          [ "${#units[@]}" -gt 0 ] || { echo "::error::no unit could be exported"; exit 1; }
          node "$ATLAS_BIN" own-export "${units[@]}" --out "$OUT/own-export.json"

      # Materialized at the REPOSITORY ROOT: the compiled contract is Atlas's, and ATLAS_SOURCE_ROOT=. reads the
      # snapshot's revision blobs root-relative (not under modules/atlas).
      - name: Materialize the Own snapshot
        env:
          ATLAS_SOURCE_ROOT: "."
          OWN_SNAPSHOT_MATERIALIZE_IMPL: modules/atlas/packages/retrieval/dist/src/own-snapshot.js
        run: node modules/atlas/scripts/materialize-own-snapshot.mjs "$OUT/own-export.json"

      # A10: no excluded fact (quarantined, held, judged false) may reach what is published.
      - name: Negative check
        run: node script/atlas-genesis/publish-plan.mjs leaks "$OUT/plan/plan.json" OWN-SNAPSHOT.json .orchestra/skills/own TERRITORY-CATALOG.json

      - name: Write the patch
        run: |
          git add -A -- OWN-SNAPSHOT.json TERRITORY-CATALOG.json .orchestra/skills/own
          git diff --cached --binary -- OWN-SNAPSHOT.json TERRITORY-CATALOG.json .orchestra/skills/own > "$OUT/atlas-own-snapshot.patch"
          ls -l "$OUT/atlas-own-snapshot.patch"

      - name: Job summary
        if: always()
        run: |
          count() { if [ -f "$1" ]; then grep -c . "$1"; else echo 0; fi; }
          promoted=$(grep -c '^  promoted ' "$OUT/promote.txt" 2>/dev/null || true)
          quarantined=$(node -e 'try { console.log(require(process.argv[1]).quarantined.length) } catch { console.log(0) }' "$OUT/plan/plan.json")
          patch=$(wc -c < "$OUT/atlas-own-snapshot.patch" 2>/dev/null || echo 0)
          {
            echo "## Atlas genesis publish"
            echo ""
            echo "| promoted | held | quarantined | units | units skipped | patch |"
            echo "| -------- | ---- | ----------- | ----- | ------------- | ----- |"
            echo "| ${promoted:-0} | $(count "$OUT/plan/held.txt") | $quarantined | $(count "$OUT/units-kept.txt") | $(count "$OUT/units-skipped.txt") | $patch bytes |"
            if [ -s "$OUT/units-skipped.txt" ]; then
              echo ""
              echo "Units own-export refused (left out of the snapshot):"
              sed 's/^/- /' "$OUT/units-skipped.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Secret scan
        id: scan
        if: always()
        env:
          ATLAS_SCAN_SECRETS: ${{ secrets.GROK_AUTH_JSON }}
        run: |
          mkdir -p "$OUT"
          node script/atlas-genesis/secret-scan.mjs "$OUT"

      - name: Upload the publish patch
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-genesis-publish
          path: ${{ runner.temp }}/atlas-publish
          if-no-files-found: warn
          retention-days: 30
