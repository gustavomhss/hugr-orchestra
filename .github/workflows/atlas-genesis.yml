name: atlas-genesis

# Run Atlas genesis over this repository on a runner (genesis-hardening S6, S10-S12), with no human in the loop:
#   mine    — index the repository (TypeScript, Python modules/relay, Rust native/omni) into .atlas/index.d/,
#             then `atlas mine` one arm at a time, capped at `budget` sites per arm. Stages candidates only. The
#             frontier gate and (when a model is configured) the judge decide whether the run is publishable.
#             Without the CLAUDE_CODE_OAUTH_TOKEN secret no model is wired: every visited site abstains and the
#             run spends nothing, which still measures the frontier and the cost of the history probe.
#   publish — same run, only with `publish: true` and a mine job that passed the gate and the binding judge:
#             hold what the judge rejected, promote the rest, build the Own snapshot and upload it as a patch.
#             Maestro opens the PR from the patch (a GITHUB_TOKEN PR would not trigger other workflows).
# workflow_dispatch only: a dispatch-only workflow can be run once it exists on the default branch (dev).
on:
  workflow_dispatch:
    inputs:
      budget:
        description: "sites per arm (ATLAS_MINE_BUDGET)"
        type: string
        default: "10"
      arms:
        description: "comma-separated arms, run one after another"
        type: string
        default: "advisory,dependency,count"
      publish:
        description: "a publishing run: the judge is binding, and a passing run promotes and builds the Own snapshot patch"
        type: boolean
        default: false

concurrency:
  group: atlas-genesis
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mine:
    name: atlas genesis mine
    runs-on: ubuntu-24.04
    # Generous on purpose: the history probe runs `git blame` over every mined file, and this run is what
    # measures how long that takes on this repository.
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      # publish runs only on a run the binding judge passed (a skipped judge — no model — never publishes).
      judged: ${{ steps.judge.outcome }}
    env:
      BUDGET: ${{ inputs.budget }}
      ARMS: ${{ inputs.arms }}
      HAS_MODEL: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      # Pinned Claude Code release for the proposer and the judge; bump deliberately.
      CLAUDE_CODE_VERSION: "2.1.316"
      # Every built-in tool, disallowed for both the proposer and the judge: they answer from the text they are
      # given, and cannot read files, run commands or browse.
      DISALLOWED_TOOLS: "Bash,Edit,MultiEdit,Write,Read,Glob,Grep,LS,WebFetch,WebSearch,NotebookEdit,NotebookRead,Task,TodoWrite"
    steps:
      - name: Validate inputs
        run: |
          [[ "$BUDGET" =~ ^[1-9][0-9]*$ ]] || { echo "::error::budget must be a positive integer, got '$BUDGET'"; exit 1; }
          IFS=',' read -ra arms <<< "$ARMS"
          for arm in "${arms[@]}"; do
            arm="${arm// /}"
            case "$arm" in
              advisory | dependency | count | definition) ;;
              *) echo "::error::unknown arm '$arm' (advisory, dependency, count, definition)"; exit 1 ;;
            esac
          done
          echo "OUT=$RUNNER_TEMP/atlas-genesis" >> "$GITHUB_ENV"
          echo "ATLAS_BIN=$GITHUB_WORKSPACE/modules/atlas/packages/cli/dist/src/bin.js" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The history probe reads a shallow clone as thin history and mines structurally.
          fetch-depth: 0

      # Node 24 plus the root workspace install, so scip-typescript resolves workspace imports.
      - name: Setup Bun and install the workspace
        uses: ./.github/actions/setup-bun

      - name: Build the Atlas CLI
        working-directory: modules/atlas
        run: |
          npm ci
          npx tsc -b
          test -f packages/cli/dist/src/bin.js

      - name: Index TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          mkdir -p .atlas/index.d "$OUT"
          list=$(bash script/atlas-genesis/ts-projects.sh)
          mapfile -t projects <<< "$list"
          echo "scip-typescript: ${#projects[@]} project(s): ${projects[*]}"
          npx --yes @sourcegraph/scip-typescript@0.4.0 index --cwd . --output .atlas/index.d/ts.scip "${projects[@]}" ||
            { echo "::error::indexer failed: scip-typescript (TypeScript)"; exit 1; }

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # Run inside modules/relay/lib so the dump's paths start at orchestra_relay/; roots.json rebases them.
      - name: Index Python (modules/relay)
        run: |
          python -m venv "$RUNNER_TEMP/relay-venv"
          source "$RUNNER_TEMP/relay-venv/bin/activate"
          pip install ./modules/relay/lib/orchestra_relay
          cd modules/relay/lib
          npx --yes @sourcegraph/scip-python@0.6.6 index --project-name orchestra_relay \
            --output "$GITHUB_WORKSPACE/.atlas/index.d/py.scip" ||
            { echo "::error::indexer failed: scip-python (modules/relay)"; exit 1; }

      # rust-analyzer comes from rustup for the toolchain native/omni pins (rust-toolchain.toml), so its
      # version moves only with that pin. Its dump's paths are relative to the Cargo workspace.
      - name: Index Rust (native/omni)
        working-directory: native/omni
        run: |
          rustup show active-toolchain
          rustup component add rust-analyzer
          rust-analyzer --version
          rust-analyzer scip . --output "$GITHUB_WORKSPACE/.atlas/index.d/rust.scip" ||
            { echo "::error::indexer failed: rust-analyzer (native/omni)"; exit 1; }

      - name: Write index roots
        run: |
          printf '{ "py.scip": "modules/relay/lib", "rust.scip": "native/omni" }\n' > .atlas/index.d/roots.json
          ls -l .atlas/index.d

      - name: Atlas doctor index
        run: node "$ATLAS_BIN" doctor index | tee "$OUT/doctor-index.txt"

      - name: Configure the proposer model
        if: env.HAS_MODEL == 'true'
        run: |
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          claude --version
          mkdir -p "$RUNNER_TEMP/atlas"
          # Text only: every built-in tool disallowed and no MCP server, so a proposal cannot read or run anything.
          node -e '
            const cfg = { roles: { propose: { cmd: "claude", args: ["-p", "--model", "sonnet", "--strict-mcp-config", "--disallowedTools", process.env.DISALLOWED_TOOLS] } }, timeoutMs: 120000 }
            require("node:fs").writeFileSync(process.argv[1], JSON.stringify(cfg, null, 2) + "\n")
          ' "$RUNNER_TEMP/atlas/model.json"
          echo "ATLAS_MODEL_CONFIG=$RUNNER_TEMP/atlas/model.json" >> "$GITHUB_ENV"

      - name: Mine each arm
        id: mine
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [ "$HAS_MODEL" = true ] || echo "::notice::no CLAUDE_CODE_OAUTH_TOKEN secret: no model is wired, every site abstains (zero spend)"
          IFS=',' read -ra arms <<< "$ARMS"
          failed=0
          for arm in "${arms[@]}"; do
            arm="${arm// /}"
            echo "::group::arm $arm (budget $BUDGET)"
            set +e
            ATLAS_MINE_SLOT="$arm" ATLAS_MINE_BUDGET="$BUDGET" node "$ATLAS_BIN" mine . >"$OUT/arm-$arm.txt" 2>"$OUT/arm-$arm.err"
            code=$?
            set -e
            echo "$code" >"$OUT/arm-$arm.code"
            cat "$OUT/arm-$arm.txt"
            cat "$OUT/arm-$arm.err" >&2
            echo "::endgroup::"
            # 0 complete. 1 is allowed ONLY as a partial pass, which the render marks with `partial: resume at
            # rank`: a bare 1 is a usage error. 2 is a refusal or failed run, 3 an internal error.
            if [ "$code" = 1 ] && ! grep -q '^partial: resume at rank' "$OUT/arm-$arm.txt"; then
              echo "::error::arm $arm exited 1 without a partial marker: $(head -n 1 "$OUT/arm-$arm.err")"
              failed=1
            elif [ "$code" != 0 ] && [ "$code" != 1 ]; then
              echo "::error::arm $arm exited $code: $(head -n 1 "$OUT/arm-$arm.err")"
              failed=1
            fi
          done
          exit "$failed"

      - name: Job summary
        if: always()
        run: |
          mkdir -p "$OUT"
          node script/atlas-genesis/summary.mjs "$OUT" >>"$GITHUB_STEP_SUMMARY"

      # The automated frontier gate (no human reviews the frontier): each arm's top sites must be at least 85%
      # hand-written source, by a classifier independent of the CLI's site filter. It reads the frontier TSVs the
      # summary step just wrote. A failure fails the job; the steps below still collect and upload artifacts.
      - name: Frontier gate
        id: gate
        if: always() && steps.mine.outcome != 'skipped'
        run: node script/atlas-genesis/frontier-gate.mjs "$OUT" --summary "$GITHUB_STEP_SUMMARY"

      # The automated judge (no human reviews facts): a seeded, arm-stratified sample of the staged, non-quarantined
      # candidates, each judged once by an independent model from the claim and its cited source only. judge.mjs
      # never spawns (the spawn gate covers script/); this loop runs the model and judge.mjs prepares and scores.
      # One retry on a malformed answer, then the fact counts as unverifiable and as a failed call. The bar is
      # binding on a publishing run (`publish`), advisory otherwise.
      - name: Judge sample
        id: judge
        if: env.HAS_MODEL == 'true' && steps.mine.outcome == 'success' && steps.gate.outcome == 'success'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          node script/atlas-genesis/judge.mjs prepare "$OUT/judge" --repo . --seed "$GITHUB_RUN_ID"
          for prompt in "$OUT"/judge/*.prompt; do
            [ -e "$prompt" ] || break
            out="${prompt%.prompt}.out"
            for attempt in 1 2; do
              timeout 180 claude -p --model opus --strict-mcp-config --disallowedTools "$DISALLOWED_TOOLS" \
                <"$prompt" >"$out" 2>"${prompt%.prompt}.err" || true
              node script/atlas-genesis/judge.mjs check "$out" && break
              echo "judge: $(basename "$prompt") attempt $attempt gave no valid verdict"
            done
          done
          binding=()
          [ "$PUBLISH" = true ] && binding=(--binding)
          node script/atlas-genesis/judge.mjs score "$OUT/judge" --summary "$GITHUB_STEP_SUMMARY" "${binding[@]}"

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p "$OUT/upload/atlas" "$OUT/index"
          cp "$OUT"/*.txt "$OUT"/*.code "$OUT"/*.err "$OUT"/*.tsv "$OUT/upload/" 2>/dev/null || true
          cp "$OUT"/judge/judge.jsonl "$OUT"/judge/judge-verdict.json "$OUT"/judge/sample.json "$OUT/upload/" 2>/dev/null || true
          cp .atlas/staging*.json "$OUT/upload/atlas/" 2>/dev/null || true
          [ -d .atlas/cas ] && cp -R .atlas/cas "$OUT/upload/atlas/cas"
          [ -f .atlas/index.d/roots.json ] && cp .atlas/index.d/roots.json "$OUT/upload/atlas/"
          cp .atlas/index.d/*.scip "$OUT/index/" 2>/dev/null || true
          du -sh "$OUT/upload" "$OUT/index"

      - name: Secret scan
        id: scan
        if: always()
        env:
          ATLAS_SCAN_SECRETS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node script/atlas-genesis/secret-scan.mjs "$OUT/upload" "$OUT/index"

      - name: Upload run artifact
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-genesis-mine
          path: ${{ runner.temp }}/atlas-genesis/upload
          if-no-files-found: error
          retention-days: 30

      # The dumps promote mode restores to re-derive grounding at the same commit. Large, so kept shorter.
      - name: Upload index dumps
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-genesis-index
          path: ${{ runner.temp }}/atlas-genesis/index
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: atlas genesis publish
    needs: mine
    # Only a publishing run whose mine job passed everything, including the BINDING judge: `judged` is the judge
    # step's outcome, so a run with no model (judge skipped) never publishes.
    if: inputs.publish && needs.mine.result == 'success' && needs.mine.outputs.judged == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      ATLAS_ACTOR: atlas-genesis
      # Self-asserted ratifier name for this automated publish, NOT a secret: KNOW-8 needs a ratifier named, and
      # the judge's binding verdict is what stands behind it. Granted `atlas:mined` in the policy written below.
      ATLAS_RATIFY_TOKEN: atlas-genesis
    steps:
      - name: Set paths
        run: |
          {
            echo "OUT=$RUNNER_TEMP/atlas-publish"
            echo "ATLAS_BIN=$GITHUB_WORKSPACE/modules/atlas/packages/cli/dist/src/bin.js"
          } >> "$GITHUB_ENV"

      # The same commit the mine job ran on (this run's SHA): the emit door re-derives grounding from the tree.
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: modules/atlas/package-lock.json

      - name: Build the Atlas CLI
        working-directory: modules/atlas
        run: |
          npm ci
          npx tsc -b

      - name: Download the mine artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: atlas-genesis-mine
          path: ${{ runner.temp }}/mine

      - name: Download the index dumps
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: atlas-genesis-index
          path: .atlas/index.d

      - name: Restore staging and write the policy
        run: |
          mkdir -p .atlas/index.d "$OUT"
          cp "$RUNNER_TEMP"/mine/atlas/staging*.json .atlas/
          cp -R "$RUNNER_TEMP/mine/atlas/cas" .atlas/cas
          cp "$RUNNER_TEMP/mine/atlas/roots.json" .atlas/index.d/roots.json
          printf '%s\n' '{"t0Heuristic":{"keywords":[]},"authz":{"scopes":{"atlas:mined":["atlas-genesis"]}}}' > .atlas/policy.json

      - name: Plan the publish
        run: node script/atlas-genesis/publish-plan.mjs plan "$OUT/plan" --repo . --judge "$RUNNER_TEMP/mine/judge.jsonl"

      # Every sampled fact the judge marked false or unverifiable is held, so no pass ever promotes it.
      - name: Hold what the judge rejected
        run: |
          while read -r key; do
            [ -n "$key" ] && node "$ATLAS_BIN" hold "$key" --by atlas-genesis
          done < "$OUT/plan/held.txt"

      - name: Promote
        run: |
          [ -s "$OUT/plan/promote.txt" ] || { echo "::error::nothing to promote: every staged candidate is quarantined or held"; exit 1; }
          set +e
          # shellcheck disable=SC2046 # one nodeKey argument each
          node "$ATLAS_BIN" promote $(cat "$OUT/plan/promote.txt") > "$OUT/promote.txt"
          code=$?
          set -e
          cat "$OUT/promote.txt"
          # 2 means at least one row was refused: allowed only when every refusal is a quarantine.
          case "$code" in
            0) ;;
            2) node script/atlas-genesis/publish-plan.mjs refusals "$OUT/promote.txt" ;;
            *) echo "::error::promote exited $code"; exit 1 ;;
          esac

      # Created through `atlas territory` (its version is a content hash; never hand-edited). The project id is the
      # one Orchestra derives (packages/core/src/project.ts): sha1 of `git-remote:<host>/<path>` of origin.
      - name: Territory catalog
        run: |
          if [ ! -f TERRITORY-CATALOG.json ]; then
            project=$(node -e 'console.log(require("node:crypto").createHash("sha1").update("git-remote:github.com/" + process.env.GITHUB_REPOSITORY).digest("hex"))')
            echo "project id: $project"
            node "$ATLAS_BIN" territory orchestra '**' --owner backend --tier T2 --project "$project"
          fi

      # Each unit is exported alone first: a unit own-export refuses (a non-FRESH fact, no tracked file) must not
      # refuse the whole snapshot. A briefing is bounded inside OWN_CAP by the composer, so size never refuses.
      - name: Own export
        run: |
          mkdir -p "$OUT/dry"
          : > "$OUT/units-kept.txt"
          : > "$OUT/units-skipped.txt"
          i=0
          while read -r unit; do
            [ -n "$unit" ] || continue
            i=$((i + 1))
            if node "$ATLAS_BIN" own-export "$unit" --out "$OUT/dry/$i.json" > "$OUT/dry/$i.txt" 2>&1; then
              echo "$unit" >> "$OUT/units-kept.txt"
            else
              echo "$unit: $(head -n 3 "$OUT/dry/$i.txt" | tr '\n' ' ')" >> "$OUT/units-skipped.txt"
            fi
          done < "$OUT/plan/units.txt"
          [ -s "$OUT/units-kept.txt" ] || { echo "::error::no unit could be exported"; exit 1; }
          # shellcheck disable=SC2046 # one unit argument each
          node "$ATLAS_BIN" own-export $(cat "$OUT/units-kept.txt") --out "$OUT/own-export.json"

      # Materialized at the REPOSITORY ROOT: the compiled contract is Atlas's, and ATLAS_SOURCE_ROOT=. reads the
      # snapshot's revision blobs root-relative (not under modules/atlas).
      - name: Materialize the Own snapshot
        env:
          ATLAS_SOURCE_ROOT: "."
          OWN_SNAPSHOT_MATERIALIZE_IMPL: modules/atlas/packages/retrieval/dist/src/own-snapshot.js
        run: node modules/atlas/scripts/materialize-own-snapshot.mjs "$OUT/own-export.json"

      # A10: no excluded fact (quarantined, held, judged false) may reach what is published.
      - name: Negative check
        run: node script/atlas-genesis/publish-plan.mjs leaks "$OUT/plan/plan.json" OWN-SNAPSHOT.json .orchestra/skills/own TERRITORY-CATALOG.json

      - name: Write the patch
        run: |
          git add -A -- OWN-SNAPSHOT.json TERRITORY-CATALOG.json .orchestra/skills/own
          git diff --cached --binary -- OWN-SNAPSHOT.json TERRITORY-CATALOG.json .orchestra/skills/own > "$OUT/atlas-own-snapshot.patch"
          ls -l "$OUT/atlas-own-snapshot.patch"

      - name: Job summary
        if: always()
        run: |
          count() { if [ -f "$1" ]; then grep -c . "$1"; else echo 0; fi; }
          promoted=$(grep -c '^  promoted ' "$OUT/promote.txt" 2>/dev/null || true)
          quarantined=$(node -e 'try { console.log(require(process.argv[1]).quarantined.length) } catch { console.log(0) }' "$OUT/plan/plan.json")
          patch=$(wc -c < "$OUT/atlas-own-snapshot.patch" 2>/dev/null || echo 0)
          {
            echo "## Atlas genesis publish"
            echo ""
            echo "| promoted | held | quarantined | units | units skipped | patch |"
            echo "| -------- | ---- | ----------- | ----- | ------------- | ----- |"
            echo "| ${promoted:-0} | $(count "$OUT/plan/held.txt") | $quarantined | $(count "$OUT/units-kept.txt") | $(count "$OUT/units-skipped.txt") | $patch bytes |"
            if [ -s "$OUT/units-skipped.txt" ]; then
              echo ""
              echo "Units own-export refused (left out of the snapshot):"
              sed 's/^/- /' "$OUT/units-skipped.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Secret scan
        id: scan
        if: always()
        env:
          ATLAS_SCAN_SECRETS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mkdir -p "$OUT"
          node script/atlas-genesis/secret-scan.mjs "$OUT"

      - name: Upload the publish patch
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-genesis-publish
          path: ${{ runner.temp }}/atlas-publish
          if-no-files-found: warn
          retention-days: 30

