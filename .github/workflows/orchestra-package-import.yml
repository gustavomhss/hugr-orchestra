name: Orchestra publication final verification
on:
  push:
    branches: [visual-migration-plan]
    paths: [.github/workflows/orchestra-package-import.yml]
permissions:
  contents: write
  issues: write
concurrency:
  group: orchestra-visual-package-publication
  cancel-in-progress: false
jobs:
  verify-publication:
    if: github.repository == 'gmhelmold/HuGR-Orchestra'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: visual-migration-plan
          fetch-depth: 20
      - name: Reconcile and verify the complete GitHub program
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,time
          repo='gmhelmold/HuGR-Orchestra'
          original_commit='9b65a109eba3cf182d11ef5a13302915b6c7636f'
          base=pathlib.Path('specs/orchestra-visual')
          sys.path.insert(0,str(base/'tools'))
          from github_sync import GhClient, desired_relations, reconcile
          plan=json.loads((base/'PLAN.json').read_text())
          meta=json.loads((base/'GITHUB.json').read_text())
          publication=json.loads((base/'PUBLICATION.json').read_text())
          provenance=json.loads((base/'publication/SOURCE-PACKAGE.json').read_text())
          assert provenance['file_count']==430
          assert hashlib.sha256((base/'PLAN.json').read_bytes()).hexdigest()=='b7775a4fee972168b01b42ab209f4aa8d4e02c0a0337e6359cc6c3436b7e94d2'
          for item in provenance['files']:
              data=subprocess.check_output(['git','show',original_commit+':'+str(base/item['path'])])
              assert hashlib.sha256(data).hexdigest()==item['sha256'],item['path']
              assert hashlib.sha256((base/item['path']).read_bytes()).hexdigest()==item['sha256'],item['path']
          assert len([x for x in provenance['files'] if x['path'].startswith('vendor/HuGR-Brand-Kit-v1.0/')])==304
          client=GhClient()
          wanted=desired_relations(plan,meta)
          preflight=reconcile(client,plan,meta,apply=False)
          applied=reconcile(client,plan,meta,apply=True) if preflight['planned_operations'] else preflight
          assert not applied['errors'],applied['errors']
          final=reconcile(client,plan,meta,apply=False)
          assert not final['planned_operations'],final['planned_operations']
          root=client.request('GET','repos/'+repo+'/issues/215')
          assert '<!-- orchestra-visual:ROOT -->' in root['body']
          roots=[]
          for number in (130,131,132,133):
              parent=client.request('GET','repos/'+repo+'/issues/'+str(number)+'/parent',allow_404=True)
              assert parent and parent['number']==215,'Root relationship missing or changed'
              roots.append({'parent':215,'child':number})
          body_hashes={}
          for ident,ticket in meta['issues'].items():
              n=ticket['number']
              row=client.request('GET','repos/'+repo+'/issues/'+str(n))
              projection=(base/'issues'/f'{ident}.md').read_text()
              assert row['body'].endswith(projection),'Issue body differs from canonical projection: '+str(n)
              for heading in ('dod','invariants','quality_standards','completeness_criteria','success_criteria'):
                  assert '### '+heading in projection
              body_hashes[str(n)]=hashlib.sha256(row['body'].encode()).hexdigest()
          run_url='https://github.com/'+repo+'/actions/runs/'+os.environ['GITHUB_RUN_ID']
          report={'schema_version':1,'status':'VERIFIED','run_url':run_url,'root_epic':215,'root_relationships':roots,'program_parent_relationships':wanted['parents'],'dependencies':wanted['dependencies'],'fine_grained_only':wanted['fine_grained_only'],'missing_native_relationships':[],'ticket_bodies_sha256':body_hashes,'original_package_commit':original_commit,'original_package_files_verified':430,'brand_files_verified':304,'product_execution':'NOT_RUN'}
          (base/'publication/NATIVE-AND-TICKETS.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          historical={k:meta[k] for k in ('publication','native_relationships_note','desired_projection_v3','review_publication','v4_published_files','v4_epic_comment_id','brand_revision_publication') if k in meta}
          meta['historical_publication_reports']=historical
          meta.update({'root_epic':{'number':215,'url':'https://github.com/'+repo+'/issues/215'},'entry_commit':original_commit,'entry_url':'https://github.com/'+repo+'/blob/visual-migration-plan/specs/orchestra-visual/EXECUTE.md','publication':'COMPLETE: all 430 original package files published, all 39 child ticket bodies verified, native hierarchy and dependencies verified. Publication does not complete product tasks.','native_relationships_applied_by_this_session':True,'native_relationships_note':'Verified by '+run_url,'v4_complete_package_published_to_repo':True,'v4_ticket_bodies_synchronized':True,'current_publication_report':'PUBLICATION.json'})
          for key in ('desired_projection_v3','review_publication','v4_published_files','v4_epic_comment_id','brand_revision_publication'):
              meta.pop(key,None)
          (base/'GITHUB.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n')
          entry=base/'EXECUTE.md'
          text=entry.read_text()
          text=text.replace('Coloque o pacote em `specs/orchestra-visual/` apenas depois de comparar o destino e mesclar sem sobrescrever trabalho diferente.','O pacote completo já está versionado nesta pasta da branch `visual-migration-plan`. Não é necessário obter ZIP ou anexos do chat. Se transportar o plano para outro worktree, compare o destino e mescle sem sobrescrever trabalho diferente.')
          text=text.replace('Nenhuma task do produto vem aprovada neste ZIP.','Nenhuma task do produto vem aprovada pela publicação do plano.')
          text=text.replace('GITHUB.json distingue o que foi publicado do que permanece no pacote; não recrie os 39 tickets.','O épico principal é #215. GITHUB.json e PUBLICATION.json registram os 39 tickets subordinados reconciliados e as relações nativas verificadas; não recrie tickets. Os documentos de QA anteriores registram o estado histórico de cada revisão, não a situação atual de publicação.')
          text=text.replace('## Autoridade e insumos','## Entrada no GitHub\n\nÉpico principal: [#215](https://github.com/'+repo+'/issues/215). Todas as especificações, ferramentas, projeções de tickets, imagem aprovada e o kit HuGR estão nesta pasta. Consulte [PUBLICATION.json](PUBLICATION.json) para proveniência e verificação. A branch publica o planejamento, não uma implementação concluída nem um merge em dev.\n\n## Autoridade e insumos',1)
          entry.write_text(text)
          (base/'README.md').write_text('# Orchestra — migração visual integral\n\n**Épico principal: [#215](https://github.com/'+repo+'/issues/215). Entrada executável: [EXECUTE.md](EXECUTE.md).**\n\nEste checkout contém todas as especificações, o grafo completo, os cinco axiomas em cada unidade, as ferramentas, a referência aprovada e o kit HuGR. Não depende de anexos do chat. O pacote original de 430 arquivos foi importado e conferido no commit '+original_commit+'. Os arquivos operacionais de publicação foram posteriormente reconciliados; a proveniência por arquivo está em publication/SOURCE-PACKAGE.json e o estado atual em PUBLICATION.json.\n\n## Organização\n\nÉpico principal #215 → quatro frentes #130–133 → dez issues #134–143 → 25 subissues #144–168. Os 38 work packages e 66 tasks permanecem dentro dos contratos completos de seus tickets; não são 104 tickets extras. Todos preservam DoD, Invariants, Quality standards, Completeness criteria e Success criteria. Relação pai/filho e bloqueio de fechamento de issue não substituem o DAG fino de tasks.\n\n## Arquivos\n\n- PLAN.json, SURFACES.json, CENSUS.json e COVERAGE.json: grafo, escopo, owners e cobertura.\n- SPEC.md, CONTRACTS.md, PERFORMANCE.md e BUDGETS.json: apresentação, integração, performance e aceite.\n- issues/: cópias canônicas completas dos 39 tickets subordinados, incluindo WPs/tasks.\n- reference/approved.png: mock aprovado, intacto.\n- vendor/HuGR-Brand-Kit-v1.0/: 304 arquivos oficiais de marca e handoff, intactos; não copiar tudo ao runtime.\n- BRAND-INTEGRATION.md e BRAND-ASSETS.json: variantes e integração da marca sem redesenho.\n- tools/: validação, seleção de trabalho e comprovação; nenhum script simula produto concluído.\n- publication/: provas da publicação e verificação nativa do GitHub.\n\n## Início\n\nLeia EXECUTE.md, abra o master e comece por S01-W1-T1. Preserve o checkout atual. Depois do censo/fundação, faça o piloto conectado S25-W0; continue pelas frentes disjuntas e pelos gates reais. Performance e microacabamento são obrigatórios no mesmo build.\n\n**Publicação completa não é implementação pronta.** CENSUS local e tasks de produto continuam pendentes; não houve build, benchmark ou teste Electron do Orchestra nesta publicação. Relatórios anteriores de revisão são históricos; o estado atual está em PUBLICATION.json.\n')
          old_note=base/'BRAND-INPUT.md'
          if old_note.exists():
              old_note.write_text('> Nota histórica de incorporação da marca. A publicação integral foi concluída posteriormente; consulte README.md, BRAND-INTEGRATION.md e PUBLICATION.json.\n\n'+old_note.read_text())
          publication.update({'artifact_package_status':'COMPLETE','ticket_bodies_status':'VERIFIED','native_relationships':'VERIFIED','native_relationships_report':'publication/NATIVE-AND-TICKETS.json','root_epic':215,'original_package_files_verified':430,'brand_files_verified':304,'original_package_commit':original_commit,'verification_run':run_url,'ticket_body_sha256':body_hashes,'native_root_links':4,'native_program_parent_links':len(wanted['parents']),'native_dependency_links':len(wanted['dependencies']),'fine_grained_constraints':len(wanted['fine_grained_only']),'missing_inputs_note':None,'remaining_publication_blockers':[],'product_execution':'NOT_RUN','metadata_adjustments_after_exact_import':['EXECUTE.md','GITHUB.json','README.md','MANIFEST.sha256'],'source_archive_sha256':provenance['archive_sha256']})
          (base/'PUBLICATION.json').write_text(json.dumps(publication,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'package_files_verified':430,'native_root_links':4,'native_parent_links':len(wanted['parents']),'native_dependencies':len(wanted['dependencies']),'ticket_bodies':len(body_hashes),'product_execution':'NOT_RUN'}))
          PY
      - name: Run the package checks and record exact logs
        run: |
          python3 - <<'PY'
          import json,pathlib,re,subprocess
          root=pathlib.Path('specs/orchestra-visual')
          checks=[('brand',['python3','tools/verify_brand.py']),('original-brand',['python3','vendor/HuGR-Brand-Kit-v1.0/11-handoff/verify_handoff.py','--json']),('plan',['python3','tools/validate_plan.py']),('maps',['python3','tools/render_maps.py','--check']),('issue-projections',['python3','tools/render_issues.py','--check']),('tools-tests',['python3','-m','unittest','discover','-s','tools','-p','test_*.py','-v'])]
          results=[]
          for name,cmd in checks:
              proc=subprocess.run(cmd,cwd=root,capture_output=True,text=True,timeout=600)
              log=proc.stdout+proc.stderr
              path=root/'publication'/f'{name}.log'
              path.write_text(log)
              results.append({'name':name,'command':cmd,'cwd':str(root),'exit_code':proc.returncode,'log':str(path.relative_to(root))})
              print(name,proc.returncode)
              assert proc.returncode==0,log[-6000:]
              if name=='tools-tests':
                  match=re.search(r'Ran (\d+) tests',log)
                  assert match and int(match.group(1))==151,log[-2000:]
          pub=json.loads((root/'PUBLICATION.json').read_text())
          pub['tooling_tests_passed']=151
          pub['checks']=results
          (root/'PUBLICATION.json').write_text(json.dumps(pub,ensure_ascii=False,indent=2)+'\n')
          import hashlib
          files=sorted(p for p in root.rglob('*') if p.is_file() and p.name!='MANIFEST.sha256')
          assert not any('__pycache__' in p.parts or p.suffix=='.pyc' for p in files)
          (root/'MANIFEST.sha256').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.relative_to(root).as_posix()+'\n' for p in files))
          print('Manifest entries',len(files))
          PY
      - name: Publish reconciled metadata to the planning branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- specs/orchestra-visual
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          assert all(not p or p.startswith('specs/orchestra-visual/') for p in paths)
          PY
          git commit -m 'docs(app): finalize self-contained visual migration program and publication proof'
          git push origin HEAD:refs/heads/visual-migration-plan
      - name: Verify committed manifest and clean publication checkout
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('specs/orchestra-visual')
          count=0
          for line in (root/'MANIFEST.sha256').read_text().splitlines():
              digest,name=line.split('  ',1)
              data=subprocess.check_output(['git','show','HEAD:'+str(root/name)])
              assert hashlib.sha256(data).hexdigest()==digest,name
              count+=1
          assert not subprocess.check_output(['git','status','--porcelain','--',str(root)]).strip()
          print(json.dumps({'status':'VERIFIED','manifest_entries':count,'head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'product_execution':'NOT_RUN'}))
          PY
