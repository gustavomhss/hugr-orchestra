name: runtime-desktop

# Linux x64 A03 slice: actual dev/beta/prod packages and prepared dev default-v1 bootstrap.
# Not full native Desktop, packaged startup, WSL, UI, model execution or consent proof.
# Frozen gates must land unchanged after independent review; missing prerequisites fail.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Require frozen reviewed gates, matching native host and prerequisites
        run: |
          set -euo pipefail
          for tool in node tar; do command -v "$tool" >/dev/null || { echo "DESKTOP_DEPENDENCY_MISSING:$tool" >&2; exit 1; }; done
          test -s .github/scripts/runtime-desktop-package-proof.ts || { echo DESKTOP_PACKAGE_GATE_MISSING >&2; exit 1; }
          test -s .github/scripts/runtime-desktop-bootstrap-proof.ts || { echo DESKTOP_BOOTSTRAP_GATE_MISSING >&2; exit 1; }
          test "$(git hash-object .github/scripts/runtime-desktop-package-proof.ts)" = 841c228a1c23dd9edb6e5d3f2a18583ad2e247ae || { echo DESKTOP_PACKAGE_GATE_CHANGED >&2; exit 1; }
          test "$(git hash-object .github/scripts/runtime-desktop-bootstrap-proof.ts)" = 72d5dfc4249592a6c361ca184c7e55f892101fd7 || { echo DESKTOP_BOOTSTRAP_GATE_CHANGED >&2; exit 1; }
          bun packages/cli/script/runtime-proof.ts --target linux-x64-baseline --host
          bun -e 'const versions = await Promise.all(["cli", "desktop", "orchestra"].map(async p => (await Bun.file(`packages/${p}/package.json`).json()).version)); if (!versions[0] || versions.some(v => v !== versions[0])) throw Error("DESKTOP_SOURCE_VERSION_MISMATCH");'
      - name: Install once without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts --os='*' --cpu='*'
      - name: Install actual package-pinned Electron through supported Node installer
        working-directory: packages/desktop
        run: bun run install-electron
      - name: Acquire one real models.dev snapshot for all builds
        run: |
          bun -e '
          const response = await fetch("https://models.dev/api.json", { signal: AbortSignal.timeout(60000) });
          if (!response.ok) throw Error(`MODELS_SNAPSHOT_HTTP_FAILURE:${response.status}`);
          const bytes = await response.arrayBuffer();
          const data = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(bytes));
          if (!data || typeof data !== "object" || Array.isArray(data) || !Object.keys(data).length) throw Error("MODELS_SNAPSHOT_EMPTY_OR_INVALID");
          await Bun.write(`${process.env.RUNNER_TEMP}/models-api.json`, bytes);'
      - name: Build native owned CLI once and export shared product
        env:
          MODELS_DEV_API_JSON: ${{ runner.temp }}/models-api.json
          ORCHESTRA_CHANNEL: dev
        run: |
          set -euo pipefail
          export ORCHESTRA_VERSION="$(bun -p 'require("./packages/cli/package.json").version')"
          bun packages/cli/script/build.ts --skip-install --target linux-x64-baseline
          bun packages/cli/script/export-artifacts.ts --dist packages/cli/dist --out .runtime-cli --version "$ORCHESTRA_VERSION" --target linux-x64-baseline
      - name: Preserve prepared source, dependency symlinks, modes and Electron for channel lanes
        run: tar --exclude=./.git --exclude=./packages/cli/dist -czf "$RUNNER_TEMP/desktop-candidate.tar.gz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-linux-x64-prepared
          path: |
            ${{ runner.temp }}/desktop-candidate.tar.gz
            ${{ runner.temp }}/models-api.json
          if-no-files-found: error

  channels:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        channel: [dev, beta, prod]
    defaults:
      run:
        shell: bash
    env:
      ORCHESTRA_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-linux-x64-prepared
          path: ${{ runner.temp }}/prepared
      - name: Restore prepared candidate and require native host
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          test -s prepared/desktop-candidate.tar.gz && test -s prepared/models-api.json || { echo DESKTOP_PREPARED_PRODUCT_MISSING >&2; exit 1; }
          mkdir candidate
          tar -xzf prepared/desktop-candidate.tar.gz -C candidate
          bun candidate/packages/cli/script/runtime-proof.ts --target linux-x64-baseline --host
      - name: Build actual Node sidecar and Electron Vite through package build lifecycle
        working-directory: ${{ runner.temp }}/candidate/packages/desktop
        env:
          MODELS_DEV_API_JSON: ${{ runner.temp }}/prepared/models-api.json
        run: |
          set -euo pipefail
          export ORCHESTRA_VERSION="$(bun -p 'require("./package.json").version')"
          export ORCHESTRA_CLI_PREBUILT_DIR="$RUNNER_TEMP/candidate/.runtime-cli"
          bun run build
      - name: Package actual channel with production beforePack and afterPack checks
        working-directory: ${{ runner.temp }}/candidate/packages/desktop
        run: |
          set -euo pipefail
          export ORCHESTRA_VERSION="$(bun -p 'require("./package.json").version')"
          bun run package:linux --dir --x64 --publish never --config.directories.output="$RUNNER_TEMP/package-$ORCHESTRA_CHANNEL"
          test -s "$RUNNER_TEMP/package-$ORCHESTRA_CHANNEL/linux-unpacked/resources/app.asar" || { echo DESKTOP_PACKAGED_RESOURCES_MISSING >&2; exit 1; }
          bun ../../.github/scripts/runtime-desktop-package-proof.ts --resources "$RUNNER_TEMP/package-$ORCHESTRA_CHANNEL/linux-unpacked/resources" --channel "$ORCHESTRA_CHANNEL" --report "$RUNNER_TEMP/package-$ORCHESTRA_CHANNEL.json"
      - name: Prove prepared dev default bootstrap under isolated nonroot Xvfb
        if: matrix.channel == 'dev'
        working-directory: ${{ runner.temp }}/candidate/packages/desktop
        run: |
          set -euo pipefail
          test "$(id -u)" != 0 || { echo ELECTRON_SANDBOX_NONROOT_REQUIRED >&2; exit 1; }
          for tool in Xvfb xvfb-run xauth xdpyinfo ldd sudo; do command -v "$tool" >/dev/null || { echo "DESKTOP_DEPENDENCY_MISSING:$tool" >&2; exit 1; }; done
          electron="$(bun -p 'require.resolve("electron/package.json").replace(/package.json$/, "dist/electron")')"
          test -x "$electron" && test -f "$(dirname "$electron")/chrome-sandbox" || { echo DESKTOP_ELECTRON_INSTALL_MISSING >&2; exit 1; }
          ldd "$electron" > "$RUNNER_TEMP/electron-libraries.txt" || { echo DESKTOP_ELECTRON_DEPENDENCIES_UNAVAILABLE >&2; exit 1; }
          if grep -q 'not found' "$RUNNER_TEMP/electron-libraries.txt"; then echo DESKTOP_ELECTRON_DEPENDENCIES_MISSING >&2; exit 1; fi
          sudo chown root:root "$(dirname "$electron")/chrome-sandbox"
          sudo chmod 4755 "$(dirname "$electron")/chrome-sandbox"
          # Frozen bootstrap env carries DISPLAY, not XAUTHORITY; local-only Xvfb needs -ac.
          xvfb-run --auto-servernum --server-args='-ac -screen 0 1280x800x24 -nolisten tcp' bash -c 'xdpyinfo >/dev/null || { echo DESKTOP_DISPLAY_UNAVAILABLE >&2; exit 1; }; bun ../../.github/scripts/runtime-desktop-bootstrap-proof.ts --desktop "$PWD" --report "$RUNNER_TEMP/bootstrap-dev.json"' || { echo DESKTOP_BOOTSTRAP_OR_DISPLAY_FAILED >&2; exit 1; }
      - name: Read back required nonempty matching native reports
        working-directory: ${{ runner.temp }}/candidate/packages/desktop
        run: |
          bun -e '
          const fail = name => { throw Error(name); };
          const read = async name => { const file = Bun.file(`${process.env.RUNNER_TEMP}/${name}.json`); if (!(await file.exists()) || !file.size) fail(`DESKTOP_REPORT_MISSING_OR_EMPTY:${name}`); return file.json(); };
          const version = (await Bun.file("package.json").json()).version;
          const channel = process.env.ORCHESTRA_CHANNEL;
          const config = (await import("./electron-builder.config.ts")).default;
          const p = await read(`package-${channel}`);
          if (p.schema !== 1 || p.channel !== channel || p.version !== version || p.platform !== "linux" || p.arch !== "x64" || p.target !== "linux-x64-baseline" || p.appId !== config.appId || p.desktopName !== config.extraMetadata.desktopName || p.resources !== `${process.env.RUNNER_TEMP}/package-${channel}/linux-unpacked/resources` || !Array.isArray(p.artifacts) || !p.artifacts.length || !p.artifacts.some(a => a.target === p.target) || ![p.hostCPUVerified, p.packagedMetadataVerified, p.outsideAsar, p.artifactDigestsVerified, p.nativeCompiledVersionVerified].every(v => v === true)) fail("DESKTOP_PACKAGE_REPORT_MISMATCH");
          if (channel === "dev") { const b = await read("bootstrap-dev"); if (b.schema !== 1 || b.desktopVersion !== version || b.electronVersion !== (await Bun.file("package.json").json()).devDependencies.electron || b.platform !== "linux" || b.arch !== "x64" || b.startup !== "default-v1-utilityProcess" || b.readyEvidence !== "production-preload-awaitInitialization-via-owned-CDP" || ![b.healthy, b.wrongCredentialRejected, b.noCredentialRejected, b.desktopAlive, b.utilityAlive].every(v => v === true)) fail("DESKTOP_BOOTSTRAP_REPORT_MISMATCH"); }'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-linux-x64-package-${{ matrix.channel }}
          path: ${{ runner.temp }}/package-${{ matrix.channel }}.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.channel == 'dev'
        with:
          name: desktop-linux-x64-bootstrap-dev
          path: ${{ runner.temp }}/bootstrap-dev.json
          if-no-files-found: error
