                      require(stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and info.st_size == item.file_size)
                  print("PREPARED_ADMISSION_PHASE:ZIP_EXTRACTION_END", flush=True)
          except Exception:
              print("PREPARED_ZIP_INVENTORY_OR_EXTRACTION_FAILED", file=sys.stderr)
              sys.exit(1)
          `, zip, `${process.env.RUNNER_TEMP}/prepared`], { timeout: 90000, maxBuffer: 1048576, stdio: ["ignore", "inherit", "pipe"] });
          requireValue(!extracted.error && extracted.status === 0, "PREPARED_ZIP_INVENTORY_OR_EXTRACTION_FAILED");
          phase("ZIP_INVENTORY_EXTRACTION_END");
          const admission = { run: producer.id, prepareJob: job.id, artifact: artifact.id, archiveDigest: artifact.digest, producerHead: producer.head_sha, producerWorkflowBlob, producerTree, currentHead: process.env.GITHUB_SHA, currentTree, sourceByteFingerprint: before.sourceBytes, packageFingerprint: before.packages };
          await writeFile(`${process.env.RUNNER_TEMP}/prepared-admission.json`, JSON.stringify(admission) + "\n", { flag: "wx", mode: 0o600 }).catch(() => fail("PREPARED_ADMISSION_RECORD_WRITE_FAILED"));
          console.log("PREPARED_SOURCE_EQUIVALENT_PRODUCER_ADMITTED", JSON.stringify(admission));
          await appendFile(process.env.GITHUB_OUTPUT, `run_id=${id}\nartifact_id=${artifact.id}\n`).catch(() => fail("PREPARED_ADMISSION_OUTPUT_WRITE_FAILED"));
          phase("ADMISSION_COMPLETE");
          }'
          status=$?
          set -e
          case "$status" in 124|137) echo PREPARED_ADMISSION_TIMEOUT >&2; exit 1;; esac
          exit "$status"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: ${{ !inputs.prepared_run }}
        with:
          name: desktop-linux-x64-prepared
          path: ${{ runner.temp }}/prepared
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Restore dependencies into exact source checkout and require native host
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          test -s prepared/desktop-dependencies.tar.gz && test -s prepared/models-api.json || { echo DESKTOP_PREPARED_PRODUCT_MISSING >&2; exit 1; }
          test "$(git -C "$GITHUB_WORKSPACE/candidate" rev-parse HEAD)" = "$GITHUB_SHA" || { echo DESKTOP_SOURCE_HEAD_MISMATCH >&2; exit 1; }
          bun -e 'const { spawnSync } = await import("node:child_process"); const r = spawnSync("tar", ["-tzf", "prepared/desktop-dependencies.tar.gz"], { encoding: "utf8", timeout: 60000, maxBuffer: 33554432 }); if (r.error || r.status !== 0) throw Error("PREPARED_TAR_INVENTORY_UNAVAILABLE"); const paths = r.stdout.trim().split("\n").map(p => p.replace(/^\.\//, "")); if (!r.stdout.trim() || paths.some(p => p.split("/").includes("..") || !/^(node_modules(?:\/|$)|packages\/[^/]+\/node_modules(?:\/|$)|packages\/sdk\/js\/node_modules(?:\/|$)|\.runtime-cli(?:\/|$))/.test(p))) throw Error("PREPARED_TAR_SOURCE_OR_FOREIGN_NAMESPACE_REJECTED");'
          tar -xzf prepared/desktop-dependencies.tar.gz -C "$GITHUB_WORKSPACE/candidate" || { echo PREPARED_DEPENDENCY_EXTRACTION_FAILED >&2; exit 1; }
          git -C "$GITHUB_WORKSPACE/candidate" diff --quiet HEAD -- || { echo PREPARED_TRACKED_SOURCE_CHANGED >&2; exit 1; }
          bun -e 'const { spawnSync } = await import("node:child_process"); const root = `${process.env.GITHUB_WORKSPACE}/candidate`, files = [["package-proof", "ede583f270cacf8c70e53619bffc1e9e75843cd7"], ["bootstrap-proof", "2ec3aeefd6b1f486bf66784dc2ac2273bb74efe6"], ["controls", "e0d9eae45eec8bb00535c09531f0b78260f5fa65"]]; files.forEach(([name, blob]) => { const r = spawnSync("git", ["hash-object", `${root}/.github/scripts/runtime-desktop-${name}.ts`], { encoding: "utf8", timeout: 10000 }); if (r.error || r.status !== 0 || r.stdout.trim() !== blob) throw Error(`DESKTOP_CONSUMER_GATE_MISSING_OR_CHANGED:${name}`); });'
          bun "$GITHUB_WORKSPACE/candidate/packages/cli/script/runtime-proof.ts" --target linux-x64-baseline --host
      - name: Build actual Node sidecar and Electron Vite through package build lifecycle
        working-directory: ${{ github.workspace }}/candidate/packages/desktop
        env:
          MODELS_DEV_API_JSON: ${{ runner.temp }}/prepared/models-api.json
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo DESKTOP_SOURCE_HEAD_MISMATCH_BEFORE_BUILD >&2; exit 1; }
          export ORCHESTRA_VERSION="$(bun -p 'require("../orchestra/package.json").version')"
          export ORCHESTRA_CLI_PREBUILT_DIR="$GITHUB_WORKSPACE/candidate/.runtime-cli"
          bun run build
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo DESKTOP_SOURCE_HEAD_MISMATCH_AFTER_BUILD >&2; exit 1; }
          bun -e '
