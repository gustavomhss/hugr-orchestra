name: runtime-desktop

# Linux x64 A03 slice: actual dev/beta/prod packages and prepared dev default-v1 bootstrap.
# Not full native Desktop, packaged startup, WSL, UI, model execution or consent proof.
# Frozen gates must land unchanged after independent review; missing prerequisites fail.
# Default bootstrap initializes fresh isolated state through production startup.
# Dev controls cover two pre-launch digest falsifications, not every failure class.
# dev_only is a limited dev rerun, not full-matrix green; reuse admits source-equivalent producers only.
# Previous reuse cancellation did not locate its stall; safe phase markers establish next run's reach.
# Package pass preserves packaging evidence only; it cannot imply bootstrap pass.
on:
  push:
    branches: [runtime-desktop-validation]
    paths: [.github/workflows/runtime-desktop.yml]
  workflow_dispatch:
    inputs:
      dev_only:
        description: Run only dev packaging/bootstrap/controls; does not qualify beta or prod
        type: boolean
        default: false
      prepared_run:
        description: Reuse a verified successful prepare artifact from a source-equivalent validation run
        type: string
        default: ""

permissions: { contents: read }

jobs:
  prepare:
    if: ${{ !inputs.prepared_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Require frozen reviewed gates, matching native host and prerequisites
        run: |
          set -euo pipefail
          for tool in node tar; do command -v "$tool" >/dev/null || { echo "DESKTOP_DEPENDENCY_MISSING:$tool" >&2; exit 1; }; done
          test -s .github/scripts/runtime-desktop-package-proof.ts || { echo DESKTOP_PACKAGE_GATE_MISSING >&2; exit 1; }
          test -s .github/scripts/runtime-desktop-bootstrap-proof.ts || { echo DESKTOP_BOOTSTRAP_GATE_MISSING >&2; exit 1; }
          test -s .github/scripts/runtime-desktop-controls.ts || { echo DESKTOP_CONTROLS_GATE_MISSING >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo DESKTOP_SOURCE_HEAD_MISMATCH >&2; exit 1; }
          test "$(git hash-object .github/scripts/runtime-desktop-package-proof.ts)" = ede583f270cacf8c70e53619bffc1e9e75843cd7 || { echo DESKTOP_PACKAGE_GATE_CHANGED >&2; exit 1; }
          test "$(git hash-object .github/scripts/runtime-desktop-bootstrap-proof.ts)" = 2ec3aeefd6b1f486bf66784dc2ac2273bb74efe6 || { echo DESKTOP_BOOTSTRAP_GATE_CHANGED >&2; exit 1; }
          test "$(git hash-object .github/scripts/runtime-desktop-controls.ts)" = e0d9eae45eec8bb00535c09531f0b78260f5fa65 || { echo DESKTOP_CONTROLS_GATE_CHANGED >&2; exit 1; }
          bun packages/cli/script/runtime-proof.ts --target linux-x64-baseline --host
          bun -e 'const versions = await Promise.all(["cli", "desktop", "orchestra"].map(async p => (await Bun.file(`packages/${p}/package.json`).json()).version)); if (!versions[0] || versions.some(v => v !== versions[0])) throw Error("DESKTOP_SOURCE_VERSION_MISMATCH");'
      - name: Install once without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts --os='*' --cpu='*'
      - name: Install actual package-pinned Electron through supported Node installer
        working-directory: packages/desktop
        run: bun run install-electron
      - name: Acquire one real models.dev snapshot for all builds
        run: |
          bun -e '
          const response = await fetch("https://models.dev/api.json", { signal: AbortSignal.timeout(60000) });
          if (!response.ok) throw Error(`MODELS_SNAPSHOT_HTTP_FAILURE:${response.status}`);
          const bytes = await response.arrayBuffer();
          const data = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(bytes));
          if (!data || typeof data !== "object" || Array.isArray(data) || !Object.keys(data).length) throw Error("MODELS_SNAPSHOT_EMPTY_OR_INVALID");
          await Bun.write(`${process.env.RUNNER_TEMP}/models-api.json`, bytes);'
      - name: Build native owned CLI once and export shared product
        env:
          MODELS_DEV_API_JSON: ${{ runner.temp }}/models-api.json
          ORCHESTRA_CHANNEL: dev
        run: |
          set -euo pipefail
          export ORCHESTRA_VERSION="$(bun -p 'require("./packages/cli/package.json").version')"
          bun packages/cli/script/build.ts --skip-install --target linux-x64-baseline
          bun packages/cli/script/export-artifacts.ts --dist packages/cli/dist --out .runtime-cli --version "$ORCHESTRA_VERSION" --target linux-x64-baseline
      - name: Hand off only dependencies with Electron and compiled owned CLI export
        run: |
          set -euo pipefail
          find . -name .git -prune -o -type d -name node_modules -prune -print0 | tar --null -T - -czf "$RUNNER_TEMP/desktop-dependencies.tar.gz" .runtime-cli
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-linux-x64-prepared
          path: |
            ${{ runner.temp }}/desktop-dependencies.tar.gz
            ${{ runner.temp }}/models-api.json
          if-no-files-found: error

  channels:
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || (inputs.prepared_run && needs.prepare.result == 'skipped')) }}
    permissions: { contents: read, actions: read }
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(inputs.dev_only && '["dev"]' || '["dev","beta","prod"]') }}
    defaults: { run: { shell: bash } }
    env:
      ORCHESTRA_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: inputs.prepared_run != ''
        with:
          node-version: "24"
      - name: Admit explicit producer reuse through bounded observable Node admission
        id: reuse
        if: inputs.prepared_run != ''
        working-directory: ${{ github.workspace }}/candidate
        env:
          PREPARED_RUN: ${{ inputs.prepared_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tool in timeout node python3 git; do command -v "$tool" >/dev/null || { echo "PREPARED_ADMISSION_DEPENDENCY_MISSING:$tool" >&2; exit 1; }; done
          set +e
          timeout --signal=TERM --kill-after=5s 300s node --input-type=module -e '
          console.log("PREPARED_ADMISSION_PHASE:NODE_START");
          const { createHash } = await import("node:crypto"), { spawnSync } = await import("node:child_process");
          const { writeFile, appendFile } = await import("node:fs/promises"), { createWriteStream } = await import("node:fs");
          const { Readable, Transform } = await import("node:stream"), { pipeline } = await import("node:stream/promises");
          class AdmissionFailure extends Error {}
          await main().catch(error => { console.error(error instanceof AdmissionFailure ? error.message : "PREPARED_ADMISSION_FAILED"); process.exitCode = 1; });
          async function main() {
          const fail = name => { throw new AdmissionFailure(name); }, requireValue = (value, name) => { if (!value) fail(name); };
          const phase = name => console.log(`PREPARED_ADMISSION_PHASE:${name}`), sequence = { request: 0, git: 0 };
          requireValue(process.versions.node.split(".")[0] === "24", "PREPARED_NODE24_REQUIRED");
          const id = process.env.PREPARED_RUN, repo = process.env.GITHUB_REPOSITORY, base = `https://api.github.com/repos/${repo}`;
          requireValue(/^[1-9][0-9]{0,15}$/.test(id ?? "") && Number.isSafeInteger(Number(id)), "PREPARED_RUN_ID_INVALID");
          requireValue(process.env.GITHUB_REPOSITORY_ID === "1405035578" && /^[^/]+\/[^/]+$/.test(repo ?? "") && process.env.GH_TOKEN, "PREPARED_REPOSITORY_CONTEXT_INVALID");
          const request = async path => { const ordinal = ++sequence.request; phase(`API_REQUEST_${ordinal}_BEGIN`); const r = await fetch(`${base}${path}`, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" }, redirect: "manual", signal: AbortSignal.timeout(30000) }).catch(() => fail("PREPARED_API_REQUEST_FAILED")); phase(`API_REQUEST_${ordinal}_HEADERS_END`); return r; };
          const api = async path => { const r = await request(path); requireValue(r.ok, `PREPARED_API_HTTP_FAILURE:${r.status}`); phase("API_JSON_BODY_BEGIN"); const data = await r.json().catch(() => fail("PREPARED_API_BODY_OR_JSON_FAILED")); phase("API_JSON_BODY_END"); requireValue(data && typeof data === "object" && !Array.isArray(data), "PREPARED_API_JSON_OBJECT_REQUIRED"); return data; };
          phase("API_CONTEXT_BEGIN");
          const repository = await api(""), current = await api(`/actions/runs/${process.env.GITHUB_RUN_ID}`), producer = await api(`/actions/runs/${id}`);
          requireValue(repository.id === 1405035578 && repository.full_name === repo && current.repository?.id === repository.id && current.head_sha === process.env.GITHUB_SHA && current.path === ".github/workflows/runtime-desktop.yml" && Number.isSafeInteger(current.workflow_id) && current.workflow_id > 0, "PREPARED_CURRENT_WORKFLOW_BINDING_FAILED");
          requireValue(producer.id === Number(id) && producer.repository?.id === repository.id && producer.head_repository?.id === repository.id && producer.workflow_id === current.workflow_id && producer.path === current.path && producer.head_branch === "runtime-desktop-validation" && /^[a-f0-9]{40}$/.test(producer.head_sha ?? ""), "PREPARED_PRODUCER_BINDING_FAILED");
          phase("API_CONTEXT_END");
          const pages = async (path, key) => {
            const items = []; const counts = [];
            for (const page of Array.from({ length: 10 }, (_, i) => i + 1)) {
              const data = await api(`${path}${path.includes("?") ? "&" : "?"}per_page=100&page=${page}`);
              requireValue(Number.isSafeInteger(data.total_count) && data.total_count > 0 && Array.isArray(data[key]) && data[key].length > 0 && data[key].length <= 100 && data[key].every(item => item && typeof item === "object" && !Array.isArray(item)), "PREPARED_API_INVENTORY_INVALID_OR_EMPTY");
              counts.push(data.total_count); items.push(...data[key]);
              requireValue(counts.every(n => n === counts[0]) && items.length <= counts[0], "PREPARED_API_INVENTORY_CHANGED");
              if (items.length === counts[0]) return items;
            }
            fail("PREPARED_API_INVENTORY_BOUND_EXCEEDED");
          };
          phase("API_JOB_INVENTORY_BEGIN");
          const jobs = (await pages(`/actions/runs/${id}/jobs?filter=latest`, "jobs")).filter(j => j.name === "prepare");
          requireValue(jobs.length === 1 && Number.isSafeInteger(jobs[0].id) && jobs[0].id > 0 && jobs[0].run_id === Number(id) && jobs[0].run_attempt === producer.run_attempt && jobs[0].head_sha === producer.head_sha && jobs[0].status === "completed" && jobs[0].conclusion === "success", "PREPARED_SUCCESSFUL_JOB_REQUIRED");
          phase("API_JOB_INVENTORY_END"); phase("API_ARTIFACT_INVENTORY_BEGIN");
          const artifacts = (await pages(`/actions/runs/${id}/artifacts`, "artifacts")).filter(a => a.name === "desktop-linux-x64-prepared");
          requireValue(artifacts.length === 1, "PREPARED_ARTIFACT_MISSING_OR_AMBIGUOUS");
          const artifact = artifacts[0], job = jobs[0];
          requireValue(artifact.expired === false && Date.parse(artifact.expires_at) > Date.now() && Number.isSafeInteger(artifact.id) && artifact.id > 0 && Number.isSafeInteger(artifact.size_in_bytes) && artifact.size_in_bytes > 0 && artifact.size_in_bytes <= 4294967296 && /^sha256:[a-f0-9]{64}$/.test(artifact.digest ?? "") && artifact.workflow_run?.id === Number(id) && artifact.workflow_run.head_sha === producer.head_sha && artifact.workflow_run.repository_id === repository.id && artifact.workflow_run.head_repository_id === repository.id && Date.parse(artifact.created_at) >= Date.parse(job.started_at) && Date.parse(artifact.created_at) <= Date.parse(job.completed_at), "PREPARED_ARTIFACT_BINDING_FAILED");
          phase("API_ARTIFACT_INVENTORY_END"); phase("GIT_SOURCE_BEGIN");
          const git = (args, timeout = 30000) => { const ordinal = ++sequence.git; phase(`GIT_COMMAND_${ordinal}_BEGIN`); const r = spawnSync("git", ["--no-optional-locks", "-c", "core.fsmonitor=false", ...args], { encoding: "utf8", timeout, maxBuffer: 33554432, env: { ...process.env, GIT_CONFIG_NOSYSTEM: "1", GIT_CONFIG_GLOBAL: "/dev/null", GIT_TERMINAL_PROMPT: "0" } }); requireValue(!r.error && r.status === 0, "PREPARED_GIT_ORACLE_FAILED"); phase(`GIT_COMMAND_${ordinal}_END`); return r.stdout; };
          requireValue(git(["rev-parse", "HEAD"]).trim() === process.env.GITHUB_SHA, "PREPARED_CURRENT_HEAD_MISMATCH");
          phase("GIT_AVAILABILITY_BEGIN");
          const available = spawnSync("git", ["cat-file", "-e", `${producer.head_sha}^{commit}`], { timeout: 10000 });
          phase("GIT_AVAILABILITY_END");
          if (available.error || available.status !== 0) git(["fetch", "--no-tags", "--depth=1", `https://github.com/${repo}.git`, producer.head_sha], 90000);
          // Reuse admits only this independently reviewed old producer recipe; alternatives need reviewed repinning.
          phase("GIT_APPROVED_RECIPE_BEGIN");
          const recipe = spawnSync("git", ["rev-parse", `${producer.head_sha}:.github/workflows/runtime-desktop.yml`], { encoding: "utf8", timeout: 10000 });
          requireValue(!recipe.error && recipe.status === 0 && /^[a-f0-9]{40}$/.test(recipe.stdout.trim()), "PREPARED_PRODUCER_RECIPE_MISSING_OR_UNAVAILABLE");
          const producerWorkflowBlob = recipe.stdout.trim();
          requireValue(producerWorkflowBlob === "d77f1c7aea89ecbd4172a0fc35b218764ccdcfa8", "PREPARED_PRODUCER_RECIPE_UNSUPPORTED");
          phase("GIT_APPROVED_RECIPE_END");
          const producerTree = git(["rev-parse", `${producer.head_sha}^{tree}`]).trim(), currentTree = git(["rev-parse", "HEAD^{tree}"]).trim();
          requireValue([producerTree, currentTree].every(t => /^[a-f0-9]{40}$/.test(t)), "PREPARED_TREE_ID_INVALID");
          const changed = git(["diff", "--no-ext-diff", "--no-textconv", "--ignore-submodules=none", "--name-only", "-z", producer.head_sha, process.env.GITHUB_SHA, "--"]).split("\0").filter(Boolean);
          requireValue(changed.every(p => p === ".github/workflows/runtime-desktop.yml"), "PREPARED_SOURCE_BYTES_DIFFER");
          const inventory = head => git(["ls-tree", "-r", "-z", "--full-tree", head]).split("\0").filter(Boolean).map(row => { const tab = row.indexOf("\t"); requireValue(tab > 0 && /^[0-7]{6} (blob|commit) [a-f0-9]{40}$/.test(row.slice(0, tab)), "PREPARED_TREE_INVENTORY_INVALID"); return { row, path: row.slice(tab + 1) }; });
          const hash = rows => createHash("sha256").update(rows.map(r => r.row + "\0").join("")).digest("hex");
          const fingerprints = head => { const rows = inventory(head); requireValue(["package.json", "bun.lock", "packages/desktop/package.json", "packages/cli/package.json", ".github/scripts/runtime-desktop-package-proof.ts", ".github/scripts/runtime-desktop-bootstrap-proof.ts", ".github/scripts/runtime-desktop-controls.ts"].every(p => rows.some(r => r.path === p)), "PREPARED_SOURCE_INVENTORY_INCOMPLETE"); return { sourceBytes: hash(rows.filter(r => r.path !== ".github/workflows/runtime-desktop.yml")), packages: hash(rows.filter(r => r.path.startsWith("packages/") || ["package.json", "bun.lock"].includes(r.path))) }; };
          phase("SOURCE_FINGERPRINT_BEGIN");
          const before = fingerprints(producer.head_sha), after = fingerprints(process.env.GITHUB_SHA);
          requireValue(before.sourceBytes === after.sourceBytes && before.packages === after.packages, "PREPARED_SOURCE_FINGERPRINT_MISMATCH");
          phase("SOURCE_FINGERPRINT_END"); phase("GIT_SOURCE_END"); phase("ARCHIVE_REDIRECT_BEGIN");
          const redirect = await request(`/actions/artifacts/${artifact.id}/zip`);
          requireValue(redirect.status === 302 && redirect.headers.get("location"), "PREPARED_ARCHIVE_REDIRECT_UNAVAILABLE");
          const location = await Promise.resolve().then(() => new URL(redirect.headers.get("location"))).catch(() => fail("PREPARED_ARCHIVE_REDIRECT_INVALID")); requireValue(location.protocol === "https:" && !location.username && !location.password, "PREPARED_ARCHIVE_REDIRECT_INVALID");
          phase("ARCHIVE_REDIRECT_END"); phase("ARCHIVE_DOWNLOAD_HEADERS_BEGIN");
          const bodyDeadline = AbortSignal.timeout(180000);
          const archive = await fetch(location, { redirect: "error", signal: bodyDeadline }).catch(() => fail("PREPARED_ARCHIVE_REQUEST_FAILED"));
          requireValue(archive.ok && archive.body, `PREPARED_ARCHIVE_HTTP_FAILURE:${archive.status}`);
          phase("ARCHIVE_DOWNLOAD_HEADERS_END"); phase("ARCHIVE_DOWNLOAD_BODY_BEGIN");
          const digest = createHash("sha256"), size = { bytes: 0 }, zip = `${process.env.RUNNER_TEMP}/prepared-reuse.zip`;
          const meter = new Transform({ transform(chunk, encoding, callback) { size.bytes += chunk.byteLength; if (size.bytes > artifact.size_in_bytes) return callback(new AdmissionFailure("PREPARED_ARCHIVE_SIZE_EXCEEDED")); digest.update(chunk); callback(null, chunk); } });
          await pipeline(Readable.fromWeb(archive.body), meter, createWriteStream(zip, { flags: "wx", mode: 0o600 }), { signal: bodyDeadline }).catch(error => fail(error instanceof AdmissionFailure ? error.message : error.code === "EEXIST" ? "PREPARED_ARCHIVE_NOT_FRESH" : bodyDeadline.aborted ? "PREPARED_ARCHIVE_BODY_TIMEOUT" : "PREPARED_ARCHIVE_CAPTURE_FAILED"));
