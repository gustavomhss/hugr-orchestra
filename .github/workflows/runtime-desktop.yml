          requireValue(size.bytes === artifact.size_in_bytes && `sha256:${digest.digest("hex")}` === artifact.digest, "PREPARED_ARCHIVE_DIGEST_MISMATCH");
          phase("ARCHIVE_DIGEST_END");
          phase("ZIP_INVENTORY_EXTRACTION_BEGIN");
          const extracted = spawnSync("python3", ["-c", `
          import os, shutil, stat, sys, zipfile
          def require(value):
              if not value: raise ValueError("invalid prepared ZIP")
          try:
              print("PREPARED_ADMISSION_PHASE:ZIP_INVENTORY_BEGIN", flush=True)
              with zipfile.ZipFile(sys.argv[1]) as archive:
                  entries = archive.infolist()
                  require(len(entries) == 2 and {item.filename for item in entries} == {"desktop-dependencies.tar.gz", "models-api.json"})
                  require(all(item.filename == item.orig_filename and not item.is_dir() and not (item.flag_bits & 1) and stat.S_IFMT(item.external_attr >> 16) in (0, stat.S_IFREG) and not (item.external_attr & 0x10) and item.file_size > 0 for item in entries))
                  require(sum(item.file_size for item in entries) <= 4294967296)
                  print("PREPARED_ADMISSION_PHASE:ZIP_INVENTORY_END", flush=True)
                  os.mkdir(sys.argv[2], 0o700)
                  print("PREPARED_ADMISSION_PHASE:ZIP_EXTRACTION_BEGIN", flush=True)
