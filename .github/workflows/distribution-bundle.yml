name: distribution-bundle
on:
  push:
    branches: [distribution-bundle]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CI: "true"
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-bun
      - run: git fetch --depth=1 origin dev:refs/remotes/origin/dev
      - run: bun typecheck
        working-directory: packages/cli
      - run: bun typecheck
        working-directory: packages/core
      - run: bun typecheck
        working-directory: packages/script
      - run: bun typecheck
        working-directory: packages/schema
      - run: bun typecheck
        working-directory: modules/maestro/arsenal
      - run: bun run check:spawn-imports
      - run: bun run check:godfile
        env:
          GODFILE_BASE_REF: origin/dev
      - run: git diff --check origin/dev HEAD
  qualification:
    name: qualification (${{ matrix.lane }}, ${{ matrix.package }}, ${{ matrix.host }})
    runs-on: ${{ matrix.host }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        include:
          # Preserve regression coverage; expensive closures get independent native runners.
          - lane: regression
            package: cli
            host: ubuntu-latest
            cpu: X64
            platform: linux
            files: [./test/distribution-payload.test.ts, ./test/distribution-payload-integrity.test.ts, ./test/distribution-launcher.test.ts, ./test/distribution-install.test.ts, ./test/distribution-install-preservation.test.ts, ./test/distribution-npm.test.ts, ./test/distribution-recipes.test.ts, ./test/distribution-recipes-paths.test.ts, ./test/distribution-native.test.ts, ./test/build-runtime.test.ts, ./test/packaged-skills-build.test.ts, ./test/distribution-process.test.ts]
          - lane: regression
            package: cli
            host: windows-latest
            cpu: X64
            platform: win32
            # Includes actual Windows PE/npm/service/parser/embedded-skill lifecycle.
            files: [./test/distribution-payload.test.ts, ./test/distribution-payload-integrity.test.ts, ./test/distribution-launcher.test.ts, ./test/distribution-windows.test.ts, ./test/packaged-skills-build.test.ts, ./test/distribution-process.test.ts]
          - lane: regression
            package: cli
            host: ubuntu-24.04-arm
            cpu: ARM64
            platform: linux
            files: [./test/distribution-native.test.ts, ./test/distribution-payload-integrity.test.ts, ./test/distribution-install-preservation.test.ts, ./test/packaged-skills-build.test.ts, ./test/distribution-process.test.ts]
          - lane: regression
            package: cli
            host: windows-11-arm
            cpu: ARM64
            platform: win32
            files: [./test/distribution-payload.test.ts, ./test/distribution-payload-integrity.test.ts, ./test/distribution-launcher.test.ts, ./test/distribution-windows.test.ts, ./test/packaged-skills-build.test.ts, ./test/distribution-process.test.ts]
          - lane: regression
            package: core
            host: ubuntu-latest
            cpu: X64
            platform: linux
            files: [./test/packaged-skills.test.ts, ./test/packaged-skills-corruption.test.ts, ./test/setup-bun-cache.test.ts, ./test/test-ci-request.test.ts, ./test/distribution-bundle-workflow.test.ts, ./test/distribution-bundle-execution.test.ts, ./test/distribution-bundle-boundaries.test.ts, ./test/distribution-bundle-deno.test.ts, ./test/effect/cross-spawn-spawner.test.ts, ./test/session-runner-model.test.ts, ./test/ripgrep-binary.test.ts, ./test/ripgrep-bundle.test.ts]
          - lane: regression
            package: core
            host: windows-latest
            cpu: X64
            platform: win32
            files: [./test/packaged-skills.test.ts, ./test/packaged-skills-corruption.test.ts, ./test/setup-bun-cache.test.ts, ./test/test-ci-request.test.ts, ./test/distribution-bundle-workflow.test.ts, ./test/distribution-bundle-execution.test.ts, ./test/distribution-bundle-boundaries.test.ts, ./test/distribution-bundle-deno.test.ts, ./test/effect/cross-spawn-spawner.test.ts, ./test/session-runner-model.test.ts, ./test/ripgrep-binary.test.ts, ./test/ripgrep-bundle.test.ts]
          - lane: regression
            package: cli
            host: macos-14
            cpu: ARM64
            platform: darwin
            files: [./test/distribution-payload.test.ts, ./test/distribution-payload-integrity.test.ts, ./test/distribution-launcher.test.ts, ./test/distribution-native.test.ts, ./test/distribution-homebrew.test.ts, ./test/packaged-skills-build.test.ts, ./test/distribution-process.test.ts]
          - lane: regression
            package: cli
            host: macos-15-intel
            cpu: X64
            platform: darwin
            files: [./test/distribution-payload.test.ts, ./test/distribution-payload-integrity.test.ts, ./test/distribution-launcher.test.ts, ./test/distribution-native.test.ts, ./test/distribution-homebrew.test.ts, ./test/packaged-skills-build.test.ts, ./test/distribution-process.test.ts]
          - lane: aur
            package: cli
            host: ubuntu-latest
            cpu: X64
            platform: linux
            files: [./test/distribution-aur.test.ts]
          - lane: aur
            package: cli
            host: ubuntu-24.04-arm
            cpu: ARM64
            platform: linux
            files: [./test/distribution-aur.test.ts]
          - lane: musl
            package: cli
            host: ubuntu-latest
            cpu: X64
            platform: linux
            files: [./test/distribution-musl.test.ts]
          - lane: musl
            package: cli
            host: ubuntu-24.04-arm
            cpu: ARM64
            platform: linux
            files: [./test/distribution-musl.test.ts]
          - lane: provider
            package: cli
            host: ubuntu-latest
            cpu: X64
            platform: linux
            files: [./test/distribution-provider.test.ts]
    env:
      ROW: ${{ toJSON(matrix) }}
      PACKAGE: ${{ matrix.package }}
      ORCHESTRA_OMNI_CONTROL: suite
      ORCHESTRA_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ matrix.platform == 'win32' && 'true' || 'false' }}
      # Fail closed: the provider lane runs real hosted inference and must never
      # fall back to a local, credential-free or scripted provider.
      OPENROUTER_API_KEY: ${{ matrix.lane == 'provider' && secrets.OPENROUTER_API_KEY || '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-bun
      - name: Prepare native Windows Rust
        if: matrix.platform == 'win32'
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null; then
            host=$([ "$RUNNER_ARCH" = ARM64 ] && echo aarch64-pc-windows-msvc || echo x86_64-pc-windows-msvc)
            curl --fail --silent --show-error --location -o "$RUNNER_TEMP/rustup-init.exe" "https://static.rust-lang.org/rustup/dist/$host/rustup-init.exe"
            "$RUNNER_TEMP/rustup-init.exe" -y --default-toolchain none --profile minimal
            printf '%s\n' "$USERPROFILE\.cargo\bin" >> "$GITHUB_PATH"
          fi
      - name: Require hosted provider credential
        if: matrix.lane == 'provider'
        run: |
          set -euo pipefail
          # Fail closed and explicit: real hosted inference cannot degrade to a
          # local, credential-free or scripted provider.
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "BUNDLE_PROVIDER_CREDENTIAL_MISSING" >&2
            exit 1
          fi
      - name: Assert native CPU and exact files
        run: |
          set -euo pipefail
          bun --eval "$(cat <<'BUN'
          import { realpathSync, statSync, writeFileSync } from 'node:fs'
          import path from 'node:path'
          import { validateRequest } from './script/test-ci-request.ts'
          // bundle-program:begin
          const row = JSON.parse(process.env.ROW)
          if (!['regression', 'aur', 'musl', 'provider'].includes(row.lane)) throw new Error('BUNDLE_LANE_INVALID')
          const arch = { X64: 'x64', ARM64: 'arm64' }[row.cpu]
          const os = { linux: 'Linux', win32: 'Windows', darwin: 'macOS' }[row.platform]
          if (!arch || !os || process.arch !== arch || process.platform !== row.platform || process.env.RUNNER_ARCH !== row.cpu || process.env.RUNNER_OS !== os)
            throw new Error(`BUNDLE_NATIVE_HOST_MISMATCH: ${row.host} ${process.platform}/${process.arch}`)
          const root = realpathSync(process.env.GITHUB_WORKSPACE)
          const dir = realpathSync(path.resolve(root, 'packages', row.package)) + path.sep
          const isFile = (file) => (statSync(path.resolve(root, file), { throwIfNoEntry: false })?.isFile() ?? false) && realpathSync(path.resolve(root, file)).startsWith(dir)
          const request = validateRequest({ package: row.package, runner: 'bun', args: row.files }, isFile)
          if (!request.args.length) throw new Error('BUNDLE_FILES_EMPTY')
          if (new Set(request.args).size !== request.args.length) throw new Error('BUNDLE_FILES_REPEATED')
          request.args.forEach((file) => {
            if (!file.startsWith('./test/') || !file.endsWith('.test.ts') || file.slice(2).split('/').some((part) => !part || part === '.' || part === '..') || !isFile(`packages/${row.package}/${file}`))
              throw new Error(`BUNDLE_FILE_INVALID_OR_MISSING: ${file}`)
          })
          writeFileSync(path.resolve(root, '.distribution-files'), request.args.join('\n') + '\n')
          // bundle-program:end
          BUN
          )"
      - name: Install native Deno
        if: matrix.package == 'cli'
        run: |
          set -euo pipefail
          bun script/distribution-deno.ts --admit
          mkdir -p distribution-logs
          bun script/distribution-deno.ts 2>&1 | tee distribution-logs/deno-download.log
      - name: Extract native Deno
        if: matrix.package == 'cli'
        run: |
          set -euo pipefail
          unzip -q "$DISTRIBUTION_DENO_DIRECTORY/deno.zip" -d "$DISTRIBUTION_DENO_DIRECTORY" 2>&1 | tee distribution-logs/deno-extract.log
          if [ "$RUNNER_OS" != Windows ]; then chmod +x "$ORCHESTRA_DISTRIBUTION_DENO" 2>&1 | tee -a distribution-logs/deno-extract.log; fi
          "$ORCHESTRA_DISTRIBUTION_DENO" --version 2>&1 | tee distribution-logs/deno-version.log
          bun script/distribution-deno.ts --verify-version distribution-logs/deno-version.log
      - uses: ./.github/actions/ripgrep
      - uses: ./.github/actions/omni-binaries
      - name: Prove native Windows Job handle closure
        if: matrix.platform == 'win32'
        working-directory: native/omni
        run: |
          set -euo pipefail
          mkdir -p ../../distribution-logs
          cargo test --release -p omni-supervisor windows::tests -- --nocapture --test-threads=1 2>&1 | tee ../../distribution-logs/windows-native-job.log
          bun ../../packages/core/test/distribution-bundle-gates.ts ../../distribution-logs/windows-native-job.log
      - name: Prove native POSIX ABI
        if: matrix.lane == 'regression' && matrix.package == 'cli' && matrix.platform != 'win32'
        working-directory: packages/cli
        run: |
          set -euo pipefail
          mkdir -p ../../distribution-logs
          if [ "$RUNNER_OS" = macOS ]; then
            sdk=$(xcrun --sdk macosx --show-sdk-path)
            export ORCHESTRA_ARTIFACT_DARWIN_SDK="$sdk"
          fi
          GITHUB_ACTIONS=false ORCHESTRA_OMNI_CONTROL=declared bun test --timeout 120000 ./test/artifact-abi.test.ts -t POSIX 2>&1 | tee ../../distribution-logs/native-posix-abi.log
      - name: Prove source ABI producers
        if: matrix.lane == 'regression' && matrix.package == 'cli' && matrix.host == 'ubuntu-latest'
        working-directory: packages/script
        run: |
          set -euo pipefail
          mkdir -p ../../distribution-logs
          GITHUB_ACTIONS=false ORCHESTRA_OMNI_CONTROL=declared bun test --timeout 120000 ./src/tree-sitter-prebuilds.test.ts 2>&1 | tee ../../distribution-logs/source-abi.log
      - name: Prove Desktop ABI consumer
        if: matrix.lane == 'regression' && matrix.package == 'cli' && matrix.host == 'ubuntu-latest'
        working-directory: packages/desktop
        run: |
          set -euo pipefail
          mkdir -p ../../distribution-logs
          GITHUB_ACTIONS=false ORCHESTRA_OMNI_CONTROL=declared bun test --timeout 120000 ./src/main/cli-artifacts.test.ts 2>&1 | tee ../../distribution-logs/desktop-abi.log
      - name: Prove Schema ELF ABI
        if: matrix.lane == 'regression' && matrix.package == 'cli' && matrix.host == 'ubuntu-latest'
        working-directory: packages/schema
        run: |
          set -euo pipefail
          mkdir -p ../../distribution-logs
          GITHUB_ACTIONS=false ORCHESTRA_OMNI_CONTROL=declared bun test --timeout 120000 ./test/elf.test.ts 2>&1 | tee ../../distribution-logs/schema-elf-abi.log
      - name: Prove packaged parser ABI
        if: matrix.lane == 'regression' && matrix.package == 'cli' && matrix.host == 'ubuntu-latest'
        working-directory: modules/maestro/arsenal
        run: |
          set -euo pipefail
          mkdir -p ../../distribution-logs
          GITHUB_ACTIONS=false ORCHESTRA_OMNI_CONTROL=declared bun test --timeout 120000 ./test/parser-bindings.test.ts ./test/onboard.test.ts 2>&1 | tee ../../distribution-logs/parser-abi.log
      - name: Prove localized proof oracles
        if: matrix.lane == 'regression' && matrix.package == 'cli' && matrix.host == 'ubuntu-latest' && matrix.cpu == 'X64'
        working-directory: packages/cli
        run: |
          set -euo pipefail
          mkdir -p ../../distribution-logs
          GITHUB_ACTIONS=false ORCHESTRA_OMNI_CONTROL=declared bun test --timeout 30000 ./test/fixture/distribution-aur/sandbox-evidence.test.ts ./test/fixture/distribution-aur/bootstrap-config.test.ts ./test/fixture/distribution-provider/compiler-edge.test.ts ./test/fixture/distribution-provider/tool-result.test.ts ./test/fixture/distribution-provider/capture-bytes.test.ts ./test/fixture/distribution-provider/provenance.test.ts 2>&1 | tee ../../distribution-logs/localized-oracles.log
      - name: Run tests
        working-directory: packages/${{ matrix.package }}
        run: |
          set -euo pipefail
          mkdir -p ../../distribution-logs
          args=()
          while IFS= read -r file; do args+=("$file"); done < ../../.distribution-files
          preload=()
          if [ "$PACKAGE" = cli ]; then preload=(--preload ../../script/test-omni-control.ts); fi
          timeout=30000
          # Native compiler/model/guest work remains bounded by the 90-minute job.
          if [ "$PACKAGE" = cli ] && [ "$RUNNER_OS" = Linux ]; then
            for file in "${args[@]}"; do
              case "$file" in ./test/distribution-provider.test.ts|./test/distribution-musl.test.ts) timeout=4800000 ;; esac
            done
          fi
          nonce=$(node -e "process.stdout.write(require('node:crypto').randomBytes(16).toString('hex'))")
          # Append nonce declaration after Bun exits; no pre-test nonce declaration in readable log.
          status=0
          # Preserve Bun's failure when both commands fail; tee alone must also fail the step.
          GITHUB_ACTIONS=false ORCHESTRA_OMNI_CONTROL_NONCE="$nonce" bun test "${preload[@]}" --timeout "$timeout" "${args[@]}" 2>&1 | tee ../../distribution-logs/run.log || {
            codes=("${PIPESTATUS[@]}")
            status=${codes[0]}
            if [ "$status" -eq 0 ]; then status=${codes[1]}; fi
          }
          printf 'omni control nonce: %s\n' "$nonce" >> ../../distribution-logs/run.log
          exit "$status"
      - name: Require nonce-bound positive control
        if: always()
        run: |
          set -euo pipefail
          bun --eval "$(cat <<'BUN'
          import { readFileSync } from 'node:fs'
          import { controlVerdict } from './script/test-ci-request.ts'
          // bundle-program:begin
          const verdict = controlVerdict({ name: process.env.ROW }, readFileSync('distribution-logs/run.log', 'utf8'))
          if (!verdict.startsWith('omni positive control: pass (')) throw new Error(`BUNDLE_CONTROL_FAILED: ${verdict}`)
          // bundle-program:end
          BUN
          )"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: distribution-${{ matrix.lane }}-${{ matrix.package }}-${{ matrix.host }}-${{ github.run_attempt }}
          path: distribution-logs
          if-no-files-found: error
          retention-days: 7
