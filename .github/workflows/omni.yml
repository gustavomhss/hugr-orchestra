name: activity signed Linux member freeze
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Build the Omni supervisor and addon from this candidate
        working-directory: native/omni
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo build --locked -p omni-supervisor -p hugr-omni-node
          cp target/debug/libhugr_omni_node.so target/debug/hugr-omni.node
      - name: Run signed member control in a disposable cgroup
        working-directory: packages/server
        run: |
          cg="/sys/fs/cgroup/omni-freeze-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo mkdir "$cg"
          trap 'sudo rmdir "$cg"' EXIT
          printf '+pids\n' | sudo tee "$cg/cgroup.subtree_control" >/dev/null
          binaries="$GITHUB_WORKSPACE/native/omni/target/debug"
          sudo env CI=true HUGR_OMNI_ISOLATION_CI=1 HUGR_OMNI_ISOLATION_ROOT="$cg" \
            HUGR_OMNI_ISOLATION_UID=65534 HUGR_OMNI_ISOLATION_GID=65533 \
            HUGR_OMNI_ADDON="$binaries/hugr-omni.node" HUGR_OMNI_SUPERVISOR="$binaries/hugr-omni-supervisor" \
            ORCHESTRA_EXPERIMENTAL_OMNI_SPAWNER=strict ORCHESTRA_OMNI_CONTROL=declared \
            "$(command -v bun)" test ./test/activity-freeze-private.test.ts
