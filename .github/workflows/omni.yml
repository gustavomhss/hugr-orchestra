name: exact Linux member isolation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
        working-directory: native/omni
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Compile the scoped proof
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo test -p omni-supervisor --test linux_member_isolation --no-run --message-format=json > "$RUNNER_TEMP/member-build.json"
          exe=$(jq -er 'select(.target.name == "linux_member_isolation" and .executable != null) | .executable' "$RUNNER_TEMP/member-build.json")
          printf 'MEMBER_TEST=%s\n' "$exe" >> "$GITHUB_ENV"
      - name: Run one fixture in a disposable cgroup
        run: |
          uname -r
          cg="/sys/fs/cgroup/omni-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo mkdir "$cg"
          trap 'sudo rmdir "$cg"' EXIT
          cat "$cg/cgroup.controllers"
          printf '+pids\n' | sudo tee "$cg/cgroup.subtree_control" > /dev/null
          sudo env HUGR_OMNI_ISOLATION_CI=1 HUGR_OMNI_ISOLATION_CGROUP_ROOT="$cg" \
            "$MEMBER_TEST" --ignored --exact freezer_is_exact_for_a_supervisor_owned_single_task_member --nocapture
