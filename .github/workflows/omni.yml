name: activity native format
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Format Rust sources
        working-directory: native/omni
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo fmt --all
      - name: Capture results
        run: |
          git diff --binary -- native/omni > "$RUNNER_TEMP/omni-rustfmt.patch"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/omni-rustfmt-sha"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omni-rustfmt
          path: |
            ${{ runner.temp }}/omni-rustfmt.patch
            ${{ runner.temp }}/omni-rustfmt-sha
