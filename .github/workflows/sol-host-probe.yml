name: SOL Linux owner attachment probe
on:
  push:
    branches: [sol-host-probe]
    paths: [.github/workflows/sol-host-probe.yml]
permissions: {}
jobs:
  attachment:
    if: github.repository == 'gustavomhss/hugr-orchestra' && github.actor == 'gustavomhss'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Start key-only attachment probe
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/sol-host"
          mkdir -m 700 "$probe"
          mkdir "$probe/route"
          curl -fsSL --retry 2 -o "$probe/cloudflared" https://github.com/cloudflare/cloudflared/releases/download/2026.11.2/cloudflared-linux-amd64
          (cd "$probe" && echo '56f13335143ec0e22772963290683a84a04114a35ec64cbc794a4d39ff9bb8cf  cloudflared' | sha256sum -c -)
          chmod 700 "$probe/cloudflared"
          curl -fsSL --retry 2 https://api.github.com/users/gustavomhss/keys |
            jq -er '.[] | select(.id == 131896369) | .key' > "$probe/authorized_keys"
          chmod 600 "$probe/authorized_keys"
          ssh-keygen -lf "$probe/authorized_keys" | grep -F 'SHA256:grBP7UAeYUlzeyv9oe6TDk1OMADK0QrMOVfaIm9Zbwo'
          ssh-keygen -q -t ed25519 -N '' -f "$probe/host"
          printf '%s\n' '#!/bin/sh' 'set -eu' "printf '%s\\n' \"\$SSH_CONNECTION\" >> '$probe/attached'" "cat '$probe/witness'" > "$probe/attached.sh"
          chmod 700 "$probe/attached.sh"
          cat /proc/sys/kernel/random/uuid > "$probe/witness"
          cat > "$probe/sshd_config" <<CONFIG
          Port 22231
          ListenAddress 127.0.0.1
          HostKey $probe/host
          PidFile $probe/sshd.pid
          AuthorizedKeysFile $probe/authorized_keys
          AuthenticationMethods publickey
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          AllowUsers $(id -un)
          DisableForwarding yes
          PermitTTY no
          PermitUserRC no
          UsePAM yes
          ForceCommand $probe/attached.sh
          CONFIG
          sudo install -d -m 755 /run/sshd
          sudo /usr/sbin/sshd -t -f "$probe/sshd_config"
          sudo /usr/sbin/sshd -f "$probe/sshd_config"
          nohup "$probe/cloudflared" tunnel --no-autoupdate --protocol http2 --url ssh://127.0.0.1:22231 > "$probe/tunnel.log" 2>&1 &
          echo "$!" > "$probe/tunnel.pid"
          for _ in $(seq 1 30); do
            host=$(grep -Eo '[a-z0-9-]+\.trycloudflare\.com' "$probe/tunnel.log" | head -1 || true)
            if [[ -n "$host" ]]; then break; fi
            sleep 1
          done
          if [[ -z "$host" ]]; then sed -n '1,40p' "$probe/tunnel.log"; exit 1; fi
          printf '%s ' "$host" > "$probe/route/known_hosts"
          cat "$probe/host.pub" >> "$probe/route/known_hosts"
          printf '%s\n' "$host" > "$probe/route/hostname"
          printf '%s\n' "$(id -un)" > "$probe/route/username"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sol-ssh-public-route
          path: ${{ runner.temp }}/sol-host/route/
          retention-days: 1
          if-no-files-found: error
      - name: Require two authenticated attachments to the same state
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/sol-host"
          trap 'kill "$(cat "$probe/tunnel.pid")" 2>/dev/null || true; sudo kill "$(cat "$probe/sshd.pid")" 2>/dev/null || true' EXIT
          for _ in $(seq 1 70); do
            if [[ -f "$probe/attached" ]] && [[ "$(sort -u "$probe/attached" | wc -l)" -ge 2 ]]; then
              echo 'Two authenticated SSH connections reached one Linux Actions job.'
              exit 0
            fi
            sleep 5
          done
          echo 'Owner reconnect witness missing.'
          exit 1
