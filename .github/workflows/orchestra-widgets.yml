name: Orchestra widget contract publication
on:
  push:
    branches: [visual-migration-plan]
    paths: [.github/workflows/orchestra-widgets.yml]
permissions:
  contents: write
  issues: write
concurrency:
  group: orchestra-visual-widget-contracts
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'gmhelmold/HuGR-Orchestra'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: visual-migration-plan
          fetch-depth: 1
      - name: Import exact reviewed delta with optimistic source checks
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, stat, urllib.parse, urllib.request, zipfile
          repo='gmhelmold/HuGR-Orchestra'
          comment_id=5851739041
          expected='4acf853013e6c23680dcba3f0d4ba9ac75212167d92613b175dbc52c369496db'
          def api(method):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/comments/{comment_id}',method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10'})
              with urllib.request.urlopen(req,timeout=60) as r:data=r.read()
              return json.loads(data) if data else None
          comment=api('GET')
          assert comment['user']['login']=='gmhelmold' and comment['issue_url'].endswith('/issues/215')
          lines=comment['body'].splitlines()
          assert lines[0]=='<!-- orchestra-widgets43:temporary-transfer -->'
          source=json.loads(lines[1]); assert source['sha256']==expected and source['bytes']==151173
          parsed=urllib.parse.urlparse(source['url'])
          assert parsed.scheme=='https' and parsed.hostname.endswith('.oaiusercontent.com')
          print('::add-mask::'+source['url'])
          try:
              req=urllib.request.Request(source['url'],headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=120) as r:archive=r.read(151174)
              assert len(archive)==151173 and hashlib.sha256(archive).hexdigest()==expected,'Transfer hash/size mismatch'
          finally:
              api('DELETE')
          root=pathlib.Path('specs/orchestra-visual')
          allowed={'PLAN.json','SURFACES.json','COVERAGE.json','SPEC.md','CONTRACTS.md','fixture.json','WIDGETS.md','tools/validate_plan.py','tools/render_issues.py','tools/test_support.py','tools/test_widget_contracts.py','reviews/widget-contracts/tests-local.log','reviews/widget-contracts/SOURCE-ANCHORS.json','reviews/widget-contracts/CONTRACT-ANALYSIS.json','reviews/widget-contracts/REVIEW.md','reviews/widget-contracts/publish.py'}
          def blob(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          pending=[]
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              assert len(z.infolist())==17 and len(set(z.namelist()))==17
              assert sum(m.file_size for m in z.infolist())<2000000
              for m in z.infolist():
                  p=pathlib.PurePosixPath(m.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in m.filename and not m.is_dir()
                  assert stat.S_IFMT(m.external_attr>>16)!=stat.S_IFLNK
              patch=json.loads(z.read('PATCH.json'))
              assert patch['repo']==repo and patch['branch']=='visual-migration-plan' and patch['base_commit']=='6bb07c6b33c6e16125836db45b0c56af915a475b'
              assert {f['path'] for f in patch['files']}==allowed and len(patch['files'])==len(allowed)
              assert set(z.namelist())=={'PATCH.json'}|{'files/'+p for p in allowed}
              for f in patch['files']:
                  dest=root/f['path'];data=z.read('files/'+f['path'])
                  assert len(data)==f['bytes'] and hashlib.sha256(data).hexdigest()==f['sha256'] and blob(data)==f['after_blob']
                  assert (blob(dest.read_bytes()) if dest.exists() else None)==f['before_blob'],'Concurrent change: '+f['path']
                  pending.append((dest,data))
          for dest,data in pending:
              dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
          evidence=root/'reviews/widget-contracts/TRANSFER.json'
          evidence.write_text(json.dumps({'archive_sha256':expected,'archive_bytes':len(archive),'files_checked':16,'optimistic_checks':'PASS','product_execution':'NOT_RUN'},indent=2)+'\n')
          print('Verified and applied 16 contract/tooling files; no product execution.')
          PY
      - name: Verify pinned source and preserve graph and protected inputs
        run: |
          git fetch --no-tags --depth=1 origin 6bb07c6b33c6e16125836db45b0c56af915a475b
          git fetch --no-tags --depth=1 origin bde9005056e17d6495ce1270a2f25ca811b69e43
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('specs/orchestra-visual');base='6bb07c6b33c6e16125836db45b0c56af915a475b'
          def old(p):return subprocess.check_output(['git','show',base+':specs/orchestra-visual/'+p])
          anchors=json.loads((root/'reviews/widget-contracts/SOURCE-ANCHORS.json').read_text())
          for p,want in anchors['files'].items():
              got=subprocess.check_output(['git','rev-parse',anchors['source_commit']+':'+p],text=True).strip()
              assert got==want,'Source anchor mismatch: '+p
          before=json.loads(old('PLAN.json'));after=json.loads((root/'PLAN.json').read_text())
          a={n['id']:n for n in before['nodes']};b={n['id']:n for n in after['nodes']};assert a.keys()==b.keys()
          fields=['kind','parent','children','depends_on','acceptance_requires','resource_locks','external_requires','criterion_ids','criterion_evaluation_stage','performance_gates','evidence_requirements']
          for ident in a:
              for field in fields:assert a[ident].get(field)==b[ident].get(field),(ident,field)
          for p in ['BUDGETS.json','progress.json','reference/approved.png']:
              assert (root/p).read_bytes()==old(p),p
          print(json.dumps({'source_anchors':len(anchors['files']),'nodes_preserved':len(a),'graph_and_criterion_stages':'UNCHANGED','protected_inputs':'UNCHANGED'}))
          PY
      - name: Prepare entrypoints and regenerate projections
        run: |
          python3 specs/orchestra-visual/reviews/widget-contracts/publish.py prepare
          cd specs/orchestra-visual
          python3 tools/render_issues.py
          python3 tools/render_maps.py
          python3 tools/render_navigation.py --write --repo "$GITHUB_WORKSPACE"
      - name: Run complete tooling checks without running the product
        run: |
          cd specs/orchestra-visual
          python3 - <<'PY'
          import json,os,pathlib,re,subprocess,sys
          out=pathlib.Path('reviews/widget-contracts');checks=[]
          commands=[('brand',[sys.executable,'tools/verify_brand.py']),('original-brand',[sys.executable,'vendor/HuGR-Brand-Kit-v1.0/11-handoff/verify_handoff.py','--json']),('plan',[sys.executable,'tools/validate_plan.py']),('maps',[sys.executable,'tools/render_maps.py','--check']),('issues',[sys.executable,'tools/render_issues.py','--check']),('navigation',[sys.executable,'tools/render_navigation.py','--check','--repo',os.environ['GITHUB_WORKSPACE']]),('tools-tests',[sys.executable,'-m','unittest','discover','-s','tools','-p','test_*.py','-v'])]
          count=None
          for name,cmd in commands:
              run=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              path=out/(name+'-github.log');path.write_text(run.stdout)
              checks.append({'name':name,'command':cmd,'cwd':'specs/orchestra-visual','exit_code':run.returncode,'log':str(path)})
              print(name,run.returncode)
              if run.returncode:
                  print(run.stdout[-16000:]);raise SystemExit(run.returncode)
              if name=='tools-tests':
                  match=re.search(r'Ran (\d+) tests? in ',run.stdout);assert match;count=int(match.group(1))
          assert count is not None and count>=224,'Full known suite was not run'
          report={'status':'PASS','kind':'planning-tools-not-product','contract_revision':'4.3','tooling_tests_passed':count,'checks':checks,'run_url':os.environ['RUN_URL'],'product_execution':'NOT_RUN'}
          (out/'QA-GITHUB.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({'tools_tests_passed':count,'product_execution':'NOT_RUN'}))
          PY
      - name: Publish verified contracts before updating tickets
        run: |
          python3 specs/orchestra-visual/reviews/widget-contracts/publish.py manifest
          git diff --check
          git add -- specs/orchestra-visual
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only','-z'],text=True).split('\0')
          assert all(n.startswith('specs/orchestra-visual/') for n in names if n)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(app): close widget semantics and source-bound acceptance'
          git push origin HEAD:refs/heads/visual-migration-plan
      - name: Reconcile existing tickets and verify unchanged native relationships
        run: python3 specs/orchestra-visual/reviews/widget-contracts/publish.py sync
      - name: Finalize publication metadata and verify committed bytes
        run: |
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('specs/orchestra-visual');p=root/'PUBLICATION.json';pub=json.loads(p.read_text());qa=json.loads((root/'reviews/widget-contracts/QA-GITHUB.json').read_text());pub['tooling_tests_passed']=qa['tooling_tests_passed'];pub['checks']=qa['checks'];pub['remaining_publication_blockers']=[];p.write_text(json.dumps(pub,ensure_ascii=False,indent=2)+'\n')
          PY
          cd specs/orchestra-visual
          python3 tools/render_navigation.py --write --repo "$GITHUB_WORKSPACE"
          python3 tools/render_navigation.py --check --repo "$GITHUB_WORKSPACE"
          python3 tools/render_issues.py --check
          python3 tools/render_maps.py --check
          python3 tools/validate_plan.py
          cd ../..
          python3 specs/orchestra-visual/reviews/widget-contracts/publish.py manifest
          git diff --check
          git add -- specs/orchestra-visual
          git commit -m 'docs(app): record complete widget contract ticket readback'
          git push origin HEAD:refs/heads/visual-migration-plan
          python3 - <<'PY'
          import hashlib,json,subprocess
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          manifest=subprocess.check_output(['git','show',head+':specs/orchestra-visual/MANIFEST.sha256'],text=True)
          for line in manifest.splitlines():
              want,name=line.split('  ',1)
              data=subprocess.check_output(['git','show',head+':specs/orchestra-visual/'+name])
              assert hashlib.sha256(data).hexdigest()==want,name
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip(),'Publication checkout not clean'
          print(json.dumps({'head':head,'committed_files_verified':len(manifest.splitlines()),'checkout':'CLEAN','product_execution':'NOT_RUN'}))
          PY
