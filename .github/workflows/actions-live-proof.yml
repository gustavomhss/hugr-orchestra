name: Actions live output proof

on:
  push:
    branches: [actions-live-proof]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  proof:
    if: github.repository == 'gustavomhss/hugr-orchestra' && github.ref == 'refs/heads/actions-live-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Read bounded artifact through production output path
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run packages/core/test/actions/github-output.proof.ts
