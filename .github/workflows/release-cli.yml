name: release-cli

# Builds the Orchestra CLI on each native host the distribution bundle qualifies, assembles the public channels and,
# only with publish=true, publishes the GitHub release, npm (@humangr/cli), the Homebrew tap and AUR (orchestra-bin).
# A dry run (the default) uploads every assembled artifact and publishes nothing. With sign=true the native build jobs sign
# every macOS and Windows executable before the payload is hashed, archived, packed or checksummed, so every channel ships
# the signed bytes. An unsigned publish is allowed: brew, npm, AUR and install.sh download without the browser quarantine
# mark, so Gatekeeper and SmartScreen do not check the binaries they install.
# musl targets build inside the pinned
# Alpine guests that distribution-bundle qualifies.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable X.Y.Z
        required: true
        type: string
      publish:
        description: Publish the GitHub release, npm, Homebrew tap and AUR
        type: boolean
        default: false
      sign:
        description: Sign and notarize macOS binaries and sign Windows binaries (needs the release environment secrets)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  VERSION: ${{ inputs.version }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a stable, unreleased version
        env:
          PUBLISH: ${{ inputs.publish }}
          SIGN: ${{ inputs.sign }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "RELEASE_VERSION_INVALID: $VERSION" >&2; exit 1; }
          if [ "$PUBLISH" = true ]; then
            [ "$SIGN" = true ] || echo "::warning::Publishing unsigned binaries; a binary downloaded from the release page in a browser trips Gatekeeper and SmartScreen"
            [ "$GITHUB_REF" = refs/heads/dev ] || { echo "RELEASE_PUBLISH_REQUIRES_DEV: $GITHUB_REF" >&2; exit 1; }
            if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "RELEASE_TAG_EXISTS: v$VERSION" >&2; exit 1; fi
            if npm view "@humangr/cli@$VERSION" version >/dev/null 2>&1; then echo "RELEASE_NPM_VERSION_EXISTS: $VERSION" >&2; exit 1; fi
          fi

  models:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Acquire one real models.dev snapshot for every target
        run: |
          bun -e '
          const response = await fetch("https://models.dev/api.json", { signal: AbortSignal.timeout(60000) });
          if (!response.ok) throw Error(`MODELS_SNAPSHOT_HTTP_FAILURE:${response.status}`);
          const bytes = await response.arrayBuffer();
          const data = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(bytes));
          if (!data || typeof data !== "object" || Array.isArray(data) || Object.keys(data).length === 0) throw Error("MODELS_SNAPSHOT_EMPTY_OR_INVALID");
          await Bun.write("models-api.json", bytes);'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: models-dev-snapshot
          path: models-api.json
          if-no-files-found: error

  build:
    name: build (${{ matrix.target }})
    needs: [plan, models]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 60
    # The release environment holds the signing secrets; an unsigned dry run needs no environment.
    environment: ${{ inputs.sign && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { host: ubuntu-latest, target: linux-x64-baseline }
          - { host: ubuntu-24.04-arm, target: linux-arm64 }
          - { host: macos-14, target: darwin-arm64 }
          - { host: macos-15-intel, target: darwin-x64-baseline }
          - { host: windows-latest, target: windows-x64-baseline }
          - { host: windows-11-arm, target: windows-arm64 }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Prepare native Windows Rust
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null; then
            host=$([ "$RUNNER_ARCH" = ARM64 ] && echo aarch64-pc-windows-msvc || echo x86_64-pc-windows-msvc)
            curl --fail --silent --show-error --location -o "$RUNNER_TEMP/rustup-init.exe" "https://static.rust-lang.org/rustup/dist/$host/rustup-init.exe"
            "$RUNNER_TEMP/rustup-init.exe" -y --default-toolchain none --profile minimal
            printf '%s\n' "$USERPROFILE\.cargo\bin" >> "$GITHUB_PATH"
          fi
      - uses: ./.github/actions/ripgrep
      - uses: ./.github/actions/omni-binaries
      - name: Require the matching native host
        working-directory: apps/cli
        run: bun script/runtime-proof.ts --target "$TARGET" --host
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: models-dev-snapshot
          path: ${{ runner.temp }}/models-dev
      - name: Build the native CLI
        working-directory: apps/cli
        env:
          ORCHESTRA_VERSION: ${{ inputs.version }}
          ORCHESTRA_CHANNEL: latest
          MODELS_DEV_API_JSON: ${{ runner.temp }}/models-dev/models-api.json
        run: bun script/build.ts --single --skip-install --target "$TARGET"
      - name: Require the macOS signing secrets
        if: inputs.sign && runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name:-}" ] || { echo "RELEASE_SIGNING_SECRET_MISSING: $name" >&2; exit 1; }
          done
      - name: Import the Apple signing certificate
        if: inputs.sign && runner.os == 'macOS'
        uses: ./.github/actions/apple-signing
        with:
          certificate-p12-base64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      # Signs every Mach-O the payload ships (CLI, omni supervisor, .node bindings), not only the CLI: the payload
      # validator accepts exactly these files under bin/.
      - name: Sign and notarize the macOS binaries
        if: inputs.sign && runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          [ -n "${CSC_NAME:-}" ] || { echo "RELEASE_SIGNING_IDENTITY_MISSING: CSC_NAME" >&2; exit 1; }
          bin="apps/cli/dist/cli-$TARGET/bin"
          signed=()
          while IFS= read -r -d '' file; do
            file "$file" | grep -q 'Mach-O' || continue
            codesign --force --sign "$CSC_NAME" --options runtime --timestamp --entitlements apps/desktop/resources/entitlements.plist "$file"
            codesign --verify --strict --verbose=2 "$file"
            signed+=("$file")
          done < <(find "$bin" -type f -print0)
          [ "${#signed[@]}" -gt 0 ] || { echo "RELEASE_SIGNING_NO_BINARIES: $bin" >&2; exit 1; }
          # Bare Mach-O binaries cannot be stapled: Gatekeeper looks the notarization ticket up online, so a first run offline is not covered.
          zip="$RUNNER_TEMP/notarize-$TARGET.zip"
          ditto -c -k --sequesterRsrc "${signed[@]}" "$zip"
          xcrun notarytool submit "$zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --output-format json | tee "$RUNNER_TEMP/notarize.json"
          [ "$(jq -r .status "$RUNNER_TEMP/notarize.json")" = Accepted ] || { echo "RELEASE_NOTARIZATION_REJECTED: $(jq -r .id "$RUNNER_TEMP/notarize.json")" >&2; exit 1; }
      - name: Delete the signing keychain
        if: always() && inputs.sign && runner.os == 'macOS' && env.CSC_KEYCHAIN != ''
        run: security delete-keychain "$CSC_KEYCHAIN"
      - name: Require the Windows signing secrets
        if: inputs.sign && runner.os == 'Windows'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_TRUSTED_SIGNING_ENDPOINT AZURE_TRUSTED_SIGNING_ACCOUNT_NAME AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE; do
            [ -n "${!name:-}" ] || { echo "RELEASE_SIGNING_SECRET_MISSING: $name" >&2; exit 1; }
          done
      # azure/login v2.3.0, a457da9ea143d694b1b9c7c869ebb04ebe844ef5.
      - name: Log in to Azure with OIDC
        if: inputs.sign && runner.os == 'Windows'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true
      - name: Sign the Windows binaries
        if: inputs.sign && runner.os == 'Windows'
        shell: pwsh
        env:
          ORCHESTRA_REQUIRE_SIGNING: "1"
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(Get-ChildItem "apps/cli/dist/cli-$env:TARGET/bin" -Recurse -File | Where-Object { $_.Extension -in ".exe", ".dll", ".node" })
          if ($files.Count -eq 0) { throw "RELEASE_SIGNING_NO_BINARIES" }
          & pwsh -File script/sign-windows.ps1 @($files.FullName)
          if ($LASTEXITCODE -ne 0) { throw "WINDOWS_SIGNING_FAILED" }
          foreach ($file in $files) {
            $status = (Get-AuthenticodeSignature $file.FullName).Status
            if ($status -ne "Valid") { throw "RELEASE_WINDOWS_SIGNATURE_INVALID: $($file.Name) $status" }
          }
      - name: Require the built version
        run: |
          set -euo pipefail
          exe=orchestra
          [[ "$TARGET" != windows-* ]] || exe=orchestra.exe
          reported=$("apps/cli/dist/cli-$TARGET/bin/$exe" --version | tr -d '\r')
          [ "$reported" = "$VERSION" ] || { echo "RELEASE_BUILT_VERSION_MISMATCH: $reported" >&2; exit 1; }
      - name: Prepare the verified payload and archive
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            ORCHESTRA_ARTIFACT_DARWIN_SDK="$(xcrun --sdk macosx --show-sdk-path)"
            export ORCHESTRA_ARTIFACT_DARWIN_SDK
          fi
          bun apps/cli/script/release.ts payload --version "$VERSION" --target "$TARGET" --out "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-archive-${{ matrix.target }}
          path: ${{ runner.temp }}/release/archives/
          if-no-files-found: error

  # musl targets build inside the pinned rust:1-alpine guests that distribution-bundle qualifies.
  build-musl:
    name: build (${{ matrix.target }})
    needs: [plan, models]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - host: ubuntu-latest
            target: linux-x64-baseline-musl
            cpu: x86_64
            image: docker.io/library/rust@sha256:ddcfc394ea1f26b4363936ff59ee69c8eedb7b72146477c844d73b85031880ea
          - host: ubuntu-24.04-arm
            target: linux-arm64-musl
            cpu: aarch64
            image: docker.io/library/rust@sha256:484dce463db97ee3b9c3dbeb82ac48408091573ec2da1ce9ccd84c823642779a
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: models-dev-snapshot
          path: ${{ runner.temp }}/models-dev
      - name: Build the musl CLI in the native Alpine guest
        env:
          IMAGE: ${{ matrix.image }}
          CPU: ${{ matrix.cpu }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          docker run --rm --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/release,target=/out" \
            --mount "type=bind,source=$RUNNER_TEMP/models-dev,target=/models,readonly" \
            "$IMAGE" sh /source/apps/cli/distribution/musl-release.sh "$CPU" "$VERSION" /source /out /models/models-api.json
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-archive-${{ matrix.target }}
          path: ${{ runner.temp }}/release/archives/
          if-no-files-found: error

  assemble:
    needs: [build, build-musl]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-archive-*
          merge-multiple: true
          path: ${{ runner.temp }}/archives
      - name: Extract the archives and assemble every channel
        run: |
          set -euo pipefail
          for archive in "$RUNNER_TEMP"/archives/orchestra-"$VERSION"-*.tar.gz; do
            target=$(basename "$archive" .tar.gz)
            target=${target#orchestra-"$VERSION"-}
            mkdir -p "$RUNNER_TEMP/payloads/$target"
            tar -xzf "$archive" -C "$RUNNER_TEMP/payloads/$target"
          done
          bun apps/cli/script/release.ts assemble --version "$VERSION" \
            --payloads "$RUNNER_TEMP/payloads" --archives "$RUNNER_TEMP/archives" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION" --out "$RUNNER_TEMP/assembled"
          cp "$RUNNER_TEMP"/archives/*.tar.gz apps/cli/distribution/install.sh "$RUNNER_TEMP/assembled/"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      # Artifact upload drops Unix modes, so packages are packed here, where executables still carry +x, and the
      # publish job ships these exact tarballs.
      - name: Pack npm packages and run the packed Linux CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assembled/npm-packs" "$RUNNER_TEMP/npm-smoke"
          for package in "$RUNNER_TEMP"/assembled/npm/*/; do npm pack "$package" --pack-destination "$RUNNER_TEMP/assembled/npm-packs" >/dev/null; done
          rm -rf "$RUNNER_TEMP/assembled/npm"
          packs="$RUNNER_TEMP/assembled/npm-packs"
          npm install --prefix "$RUNNER_TEMP/npm-smoke" --no-audit --no-fund --omit=optional \
            "$packs/humangr-cli-linux-x64-baseline-$VERSION.tgz" "$packs/humangr-cli-$VERSION.tgz"
          reported=$(HOME="$RUNNER_TEMP/npm-smoke-home" "$RUNNER_TEMP/npm-smoke/node_modules/.bin/orchestra" --version)
          [ "$reported" = "$VERSION" ] || { echo "RELEASE_PACKED_VERSION_MISMATCH: $reported" >&2; exit 1; }
      - name: Run the packed musl CLI in Alpine
        run: |
          set -euo pipefail
          docker run --rm --mount "type=bind,source=$RUNNER_TEMP/assembled/npm-packs,target=/packs,readonly" node:22-alpine sh -euc '
            npm install --prefix /smoke --no-audit --no-fund --omit=optional \
              "/packs/humangr-cli-linux-x64-baseline-musl-$0.tgz" "/packs/humangr-cli-$0.tgz" >/dev/null
            reported=$(HOME=/tmp/home /smoke/node_modules/.bin/orchestra --version)
            [ "$reported" = "$0" ] || { echo "RELEASE_PACKED_MUSL_VERSION_MISMATCH: $reported" >&2; exit 1; }' "$VERSION"
      - name: Generate the AUR .SRCINFO with real makepkg
        run: |
          set -euo pipefail
          docker run --rm -v "$RUNNER_TEMP/assembled/aur:/pkg" archlinux:base bash -c \
            'useradd -m builder && chown -R builder /pkg && su builder -c "cd /pkg && makepkg --printsrcinfo > .SRCINFO" && chown -R '"$(id -u):$(id -g)"' /pkg'
          grep -q "pkgver = $VERSION" "$RUNNER_TEMP/assembled/aur/.SRCINFO"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assembled
          path: ${{ runner.temp }}/assembled/
          if-no-files-found: error
          include-hidden-files: true

  publish:
    if: inputs.publish
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-assembled
          path: assembled
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGN: ${{ inputs.sign }}
        run: |
          set -euo pipefail
          SIGNING_NOTE="macOS binaries are signed and notarized; Windows binaries are signed."
          if [ "$SIGN" != true ]; then SIGNING_NOTE="These binaries are not signed. The installers above never trip Gatekeeper or SmartScreen; a binary downloaded here in a browser can."; fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Orchestra CLI $VERSION" \
            --notes "Install with \`npm install -g @humangr/cli\`, \`brew install gustavomhss/tap/orchestra\`, the AUR package \`orchestra-bin\`, or \`install.sh\` with an archive and its SHA-256 from SHA256SUMS. $SIGNING_NOTE" \
            assembled/*.tar.gz assembled/SHA256SUMS assembled/install.sh
      # Platform packages first: the wrapper pins each one exactly in optionalDependencies.
      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${NODE_AUTH_TOKEN:-}" ] || { echo "RELEASE_NPM_TOKEN_MISSING" >&2; exit 1; }
          for package in assembled/npm-packs/humangr-cli-*-"$VERSION".tgz; do npm publish "$package" --access public --provenance; done
          npm publish "assembled/npm-packs/humangr-cli-$VERSION.tgz" --access public --provenance
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          # Homebrew and AUR are optional channels: without their secret the release ships on GitHub and npm only.
          [ -n "${TAP_TOKEN:-}" ] || { echo "::warning::No HOMEBREW_TAP_TOKEN: the Homebrew tap is not updated"; exit 0; }
          git clone "https://x-access-token:$TAP_TOKEN@github.com/gustavomhss/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp assembled/homebrew/Formula/orchestra.rb tap/Formula/orchestra.rb
          git -C tap add Formula/orchestra.rb
          git -C tap -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "orchestra $VERSION"
          git -C tap push origin HEAD
      - name: Update the AUR package
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "${AUR_SSH_PRIVATE_KEY:-}" ] || { echo "::warning::No AUR_SSH_PRIVATE_KEY: the AUR package is not updated"; exit 0; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/orchestra-bin.git aur
          cp assembled/aur/PKGBUILD assembled/aur/.SRCINFO aur/
          git -C aur add PKGBUILD .SRCINFO
          git -C aur -c user.name="gustavomhss" -c user.email="gustavomhss@users.noreply.github.com" commit -m "orchestra-bin $VERSION"
          git -C aur push origin HEAD:master
