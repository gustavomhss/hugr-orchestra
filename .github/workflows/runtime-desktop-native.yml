name: runtime-desktop-native

# BLOCKED prerequisite scaffold, not native Desktop packaging evidence.
# Signing provisioning must be agreed before adding dependency/build/package execution:
# Darwin: installed Developer ID Application identity for CSC_NAME (before CLI staging),
# keychain unlock/import/cleanup and actual notarization credentials accepted by electron-builder.
# app-builder-lib 26.15.2 MacTargetHelper.getNotarizeOptions accepts APPLE_ID +
# APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID, or APPLE_API_KEY + APPLE_API_KEY_ID +
# APPLE_API_ISSUER, or APPLE_KEYCHAIN_PROFILE (optionally APPLE_KEYCHAIN).
# notarize:true still skips without credentials; configuration alone is not evidence.
# Windows: AZURE_TRUSTED_SIGNING_ENDPOINT / ACCOUNT_NAME / CERTIFICATE_PROFILE and
# an Azure CLI authenticated principal authorized to sign that profile. The production
# signer excludes environment/workload/managed credentials; missing config currently skips signing.
# Do not replace these blockers with unsigned/ad-hoc packages or notarization overrides.
# Subsequent implementation must build/export owned CLI products using source version,
# consume ORCHESTRA_CLI_PREBUILT_DIR (both Linux guest targets on Windows), build each
# channel through production prebuild/package scripts, then run the approved resource
# proof on the actual package output with a fresh absolute report. Reports alone are
# uploaded only after that proof; snapshot artifacts below are acquisition evidence only.
# Native proof interface remains:
# bun .github/scripts/runtime-desktop-package-proof.ts --resources <actual-packaged-resources>
#   --channel dev|beta|prod --report <fresh-absolute-report>
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  models:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Acquire one bounded real models.dev snapshot
        run: |
          bun -e '
          if (Bun.version !== "1.3.14") throw Error("BUN_VERSION_MISMATCH");
          const response = await fetch("https://models.dev/api.json", { signal: AbortSignal.timeout(60000) });
          if (!response.ok || !response.body) throw Error("MODELS_SNAPSHOT_HTTP_OR_BODY_FAILURE");
          const chunks = [];
          let size = 0;
          for await (const chunk of response.body) {
            size += chunk.byteLength;
            if (size > 64 * 1024 * 1024) throw Error("MODELS_SNAPSHOT_SIZE_LIMIT");
            chunks.push(chunk);
          }
          if (!size) throw Error("MODELS_SNAPSHOT_EMPTY");
          const bytes = Buffer.concat(chunks);
          const value = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(bytes));
          if (!value || typeof value !== "object" || Array.isArray(value) || !Object.keys(value).length) throw Error("MODELS_SNAPSHOT_INVALID");
          await Bun.write("models-api.json", bytes);
          await Bun.write("models-api.sha256", new Bun.CryptoHasher("sha256").update(bytes).digest("hex") + "\n");'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-native-models-snapshot
          path: |
            models-api.json
            models-api.sha256
          if-no-files-found: error

  prerequisites:
    strategy:
      fail-fast: false
      matrix:
        channel: [dev, beta, prod]
        platform:
          - {host: macos-15-intel, target: darwin-x64-baseline, os: darwin, cpu: x64}
          - {host: macos-15, target: darwin-arm64, os: darwin, cpu: arm64}
          - {host: windows-2022, target: windows-x64-baseline, os: win32, cpu: x64}
          - {host: windows-11-arm, target: windows-arm64, os: win32, cpu: arm64}
    # Explicit platform/channel axes; unresolved signing fails, never skips to green.
    runs-on: ${{ matrix.platform.host }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.platform.target }}
      EXPECTED_OS: ${{ matrix.platform.os }}
      EXPECTED_CPU: ${{ matrix.platform.cpu }}
      ORCHESTRA_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
          bun-download-url: ${{ matrix.platform.target == 'windows-arm64' && 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-windows-aarch64.zip' || '' }}
      - name: Acquire SHA-verified Windows x64 baseline Bun
        if: matrix.platform.target == 'windows-x64-baseline'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'bun-windows-x64-baseline-v1.3.14.zip'
          Invoke-WebRequest -Uri 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-windows-x64-baseline.zip' -OutFile $archive -TimeoutSec 90
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '538f9c846355d9e847b2671bc00c47da4229a0befb24df3282b739770f3b475f') { throw 'BASELINE_ARCHIVE_SHA256_MISMATCH' }
          $root = Join-Path $env:RUNNER_TEMP 'bun-baseline-verified'
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          $binary = Join-Path $root 'bun-windows-x64-baseline/bun.exe'
          if (!(Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'BASELINE_BINARY_MISSING' }
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne '1.3.14') { throw 'BASELINE_BINARY_VERSION_MISMATCH' }
          (Split-Path -Parent $binary) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Require matching native CPU and pinned Bun
        run: bun packages/cli/script/runtime-proof.ts --target "$TARGET" --host
      - name: Require production source version and Electron pin
        run: |
          bun -e '
          if (process.platform !== process.env.EXPECTED_OS || process.arch !== process.env.EXPECTED_CPU) throw Error("NATIVE_HOST_MISMATCH");
          const source = await Bun.file("packages/orchestra/package.json").json();
          if (typeof source.version !== "string" || !source.version.trim() || source.version !== source.version.trim() || /[\x00-\x1f]/.test(source.version)) throw Error("SOURCE_VERSION_INVALID");
          const desktop = await Bun.file("packages/desktop/package.json").json();
          if (desktop.devDependencies?.electron !== "42.3.3") throw Error("ELECTRON_SOURCE_PIN_MISMATCH");
          process.env.ORCHESTRA_VERSION = source.version;
          const config = await import("./packages/desktop/electron-builder.config.ts");
          if (config.default.extraMetadata?.version !== source.version || !config.default.extraMetadata?.desktopName) throw Error("PRODUCTION_CHANNEL_VERSION_CONTRACT_INVALID");'
      - name: Fail named operational signing blockers before any build
        run: |
          bun -e '
          if (process.platform === "darwin") throw Error("DARWIN_SIGNING_PROVISIONING_CONTRACT_REQUIRED: installed Developer ID Application CSC_NAME identity, unlocked keychain, notarization credentials and isolated cleanup");
          throw Error("WINDOWS_SIGNING_PROVISIONING_CONTRACT_REQUIRED: AZURE_TRUSTED_SIGNING_ENDPOINT, AZURE_TRUSTED_SIGNING_ACCOUNT_NAME, AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE and profile-authorized Azure CLI authentication");'
