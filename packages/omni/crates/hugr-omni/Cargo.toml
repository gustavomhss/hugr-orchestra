[package]
name = "hugr-omni"
description = "Run processes and terminals with identical, tested behavior on Windows, macOS and Linux."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false # v0.2 (D10)

[dependencies]
omni-proto.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "io-util", "net"] }
tokio-util.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
] }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
