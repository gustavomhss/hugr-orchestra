[workspace]
resolver = "3"
# bindings/node joins in W13 (it owns bindings/node/Cargo.toml and this line).
members = ["crates/*", "bindings/node"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gustavomhss/hugr-omni"

# The dependency allowlist (AGENTS.md). Anything new needs the lead's approval (INV-12).
[workspace.dependencies]
omni-proto = { path = "crates/omni-proto" }
libc = "0.2"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
windows-sys = "0.61"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
panic = "unwind"

# H1 (WP-H): napi-rs debug-asserts, inside its finalize callbacks, that deleting a JS reference succeeded. Bun runs the
# finalizers of a terminated Worker with the termination pending, so the delete is refused, the assert panics inside an
# `extern "C"` callback, and the whole host aborts (rc 134). Release builds compile these asserts out; a debug build of
# the addon (the one the gates test) must behave the same. Nothing may panic across FFI (AGENTS.md).
[profile.dev.package.napi]
debug-assertions = false
