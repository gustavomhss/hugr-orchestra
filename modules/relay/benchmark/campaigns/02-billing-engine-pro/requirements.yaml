# Campaign 02 — billing-engine-pro. Frozen requirement set (ground truth, RSR denominator).
# Original, self-contained; no external/CoreLink artifacts.
campaign: 02-billing-engine-pro
goal: "Advanced usage->billing engine: tiered pricing, stacked discounts, regional tax, B2B reverse-charge, minimum floor — every precedence/interaction rule correct."
requirements:
  - { id: R1,  weight: 1, deps: [],        statement: "ingest(tenant,request,metric,qty,ts) records a usage event; usage_for reflects it.",                 verifier: { type: test, node: "checks/test_engine.py::test_R1_ingest" } }
  - { id: R2,  weight: 1, deps: [R1],      statement: "Dedup by (tenant,request): the FIRST event wins; a later same-key event is a no-op.",                verifier: { type: test, node: "checks/test_engine.py::test_R2_dedup_first_wins" } }
  - { id: R3,  weight: 1, deps: [R1],      statement: "ingest rejects negative quantity with BillingError.",                                                verifier: { type: test, node: "checks/test_engine.py::test_R3_reject_negative" } }
  - { id: R4,  weight: 1, deps: [R1],      statement: "ingest rejects a metric not in {api,storage,egress,compute} with BillingError.",                      verifier: { type: test, node: "checks/test_engine.py::test_R4_reject_unknown_metric" } }
  - { id: R5,  weight: 2, deps: [R1],      statement: "ingest rejects a non-integer (float) quantity with BillingError.",                                    verifier: { type: test, node: "checks/test_engine.py::test_R5_reject_float_qty" } }
  - { id: R6,  weight: 2, deps: [R1],      statement: "ingest rejects a boolean quantity with BillingError (bool is not a valid int quantity).",            verifier: { type: test, node: "checks/test_engine.py::test_R6_reject_bool_qty" } }
  - { id: R7,  weight: 1, deps: [R1, R2],  statement: "metered(tenant,metric) returns the summed deduped quantity.",                                        verifier: { type: test, node: "checks/test_engine.py::test_R7_metered_sum" } }
  - { id: R8,  weight: 1, deps: [R1],      statement: "usage_for/metered are tenant-isolated; never return another tenant's data.",                         verifier: { type: test, node: "checks/test_engine.py::test_R8_tenant_isolation" } }
  - { id: R9,  weight: 1, deps: [R7],      statement: "Metrics with zero usage are omitted from invoice lines.",                                            verifier: { type: test, node: "checks/test_engine.py::test_R9_zero_usage_omitted" } }
  - { id: R10, weight: 1, deps: [R1],      statement: "audit_log is an immutable tuple; each accepted ingest appends a 'usage.ingested' entry.",            verifier: { type: test, node: "checks/test_engine.py::test_R10_audit_append_only" } }
  - { id: R11, weight: 1, deps: [R7],      statement: "Tiered pricing api (first 1000 @ 0.01, then 0.008): 1500 units -> line amount 14.00.",              verifier: { type: test, node: "checks/test_engine.py::test_R11_tiered_api" } }
  - { id: R12, weight: 2, deps: [R11],     statement: "Tier boundary is inclusive: api 1000 -> 10.00; api 1001 -> 10.01.",                                  verifier: { type: test, node: "checks/test_engine.py::test_R12_tier_boundary_inclusive" } }
  - { id: R13, weight: 1, deps: [R11],     statement: "Tiered pricing compute (first 100 @ 0.10, then 0.08): 101 units -> 10.08.",                          verifier: { type: test, node: "checks/test_engine.py::test_R13_tiered_compute" } }
  - { id: R14, weight: 2, deps: [R11],     statement: "Invoice subtotal = round(sum of the per-line ROUNDED amounts), not round-of-unrounded-sum (api 1001 + egress 2001 -> 50.03).", verifier: { type: test, node: "checks/test_engine.py::test_R14_sum_of_rounded_lines" } }
  - { id: R15, weight: 2, deps: [R11],     statement: "Volume discount: if metered qty >= threshold {api:5000,storage:1000,egress:10000,compute:500}, multiply the line subtotal by 0.90 BEFORE rounding (storage 1000 -> 40.50).", verifier: { type: test, node: "checks/test_engine.py::test_R15_volume_discount_applied" } }
  - { id: R16, weight: 1, deps: [R11],     statement: "No volume discount below threshold (storage 999 -> 44.96).",                                        verifier: { type: test, node: "checks/test_engine.py::test_R16_volume_discount_below_threshold" } }
  - { id: R17, weight: 2, deps: [R14, R15],statement: "Coupon 'SAVE20': 20% off if subtotal >= 50.00, else ignored (subtotal 50.03 -> total 40.02).",     verifier: { type: test, node: "checks/test_engine.py::test_R17_coupon_applied_ge50" } }
  - { id: R18, weight: 1, deps: [R17],     statement: "Coupon ignored when subtotal < 50 (subtotal 14.00 stays 14.00).",                                   verifier: { type: test, node: "checks/test_engine.py::test_R18_coupon_ignored_lt50" } }
  - { id: R19, weight: 2, deps: [R17],     statement: "Loyalty discount applied AFTER the coupon: 1% per year (loyalty 3 -> total 13.58).",                verifier: { type: test, node: "checks/test_engine.py::test_R19_loyalty_after_coupon" } }
  - { id: R20, weight: 2, deps: [R19],     statement: "Loyalty discount capped at 5% (loyalty 8 -> total 13.30).",                                          verifier: { type: test, node: "checks/test_engine.py::test_R20_loyalty_capped_5pct" } }
  - { id: R21, weight: 2, deps: [R19],     statement: "Tax applies to the DISCOUNTED total, rate by region (EU 0.20): EU 14.00 -> tax 2.80, total 16.80.", verifier: { type: test, node: "checks/test_engine.py::test_R21_tax_eu" } }
  - { id: R22, weight: 1, deps: [R21],     statement: "Tax rate BR 0.17 (14.00 -> total 16.38).",                                                          verifier: { type: test, node: "checks/test_engine.py::test_R22_tax_br" } }
  - { id: R23, weight: 2, deps: [R21],     statement: "B2B reverse-charge: is_b2b + region in {EU,UK} -> tax 0 and invoice reverse_charge=True (EU b2b 14.00 -> total 14.00).", verifier: { type: test, node: "checks/test_engine.py::test_R23_reverse_charge_flag" } }
  - { id: R24, weight: 2, deps: [R23, R25],statement: "Reverse-charge invoices are EXEMPT from the minimum floor (EU b2b tiny -> total 0.01, not 5.00).",  verifier: { type: test, node: "checks/test_engine.py::test_R24_reverse_charge_exempt_floor" } }
  - { id: R25, weight: 2, deps: [R21],     statement: "Minimum floor: non-reverse-charge total < 5.00 is raised to 5.00 (US 1.00 -> 5.00).",               verifier: { type: test, node: "checks/test_engine.py::test_R25_minimum_floor" } }
  - { id: R26, weight: 1, deps: [R25],     statement: "issue_invoice is idempotent: same id and total on re-issue.",                                       verifier: { type: test, node: "checks/test_engine.py::test_R26_idempotent_issue" } }
  - { id: R27, weight: 1, deps: [R26],     statement: "Invoice id = 'INV-<tenant>-<seq>', seq monotonic per tenant from 1.",                               verifier: { type: test, node: "checks/test_engine.py::test_R27_invoice_id_seq" } }
  - { id: R28, weight: 1, deps: [R10, R26],statement: "Issuance appends an 'invoice.issued' audit entry.",                                                 verifier: { type: test, node: "checks/test_engine.py::test_R28_audit_on_issue" } }
  - { id: R29, weight: 1, deps: [R7, R26], statement: "reconcile(tenant) returns drift between invoiced quantities and metered usage; 0.0 when consistent.", verifier: { type: test, node: "checks/test_engine.py::test_R29_reconcile_zero" } }
  - { id: R30, weight: 1, deps: [R21],     statement: "US region tax is 0 (api 1500 -> tax 0.00, total 14.00).",                                            verifier: { type: test, node: "checks/test_engine.py::test_R30_us_zero_tax" } }
