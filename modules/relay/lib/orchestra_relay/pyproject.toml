[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra-relay"
version = "0.1.0"
description = "Verifiable gates for LangGraph graphs: checks, approvals and a hash-chained ledger."
requires-python = ">=3.11"
dependencies = ["langgraph>=1.2,<2"]

[project.scripts]
relay = "orchestra_relay.__main__:main"

[tool.setuptools]
package-dir = { "orchestra_relay" = "." }
packages = ["orchestra_relay"]
