name: safe-refactor
version: 1.0.0
description: Reshape code without changing what it does. Write down the invariants, pin today's behaviour with tests,
  refactor in the open, then prove every invariant still holds.
protected: false
created_at: '2026-10-28T00:00:00Z'
pipeline:
- state_id: understand
  name: Understand and pin
  description: Map the code and freeze its behaviour
  max_iterations: 3
  system_prompt: |
    A refactor changes the shape of code, never its behaviour. Before anything moves, you decide what must stay true
    and you pin it with tests that pass against today's code. Nothing under the source paths changes in this phase.
  sub_states:
  - id: map
    type: execute
    name: Map the code
    description: |
      Read the code under ${src_path} and write ${notes_dir}/refactor.md with four sections:
      "## Today" (how the code is structured now and what makes it hard to change),
      "## Target" (the shape it should have and why that is better),
      "## Steps" (the moves that get there, each small enough to review on its own) and
      "## Invariants" (the behaviour that must not change, one per line as `INV1: ...`, `INV2: ...`, at least three).
      Name real files and functions, not categories.
  - id: pin
    type: execute
    name: Pin current behaviour
    description: |
      Write characterization tests under ${test_path} that pin each invariant against the current code, and name
      the invariant each test covers (for example `INV2` in the test name or a comment). They must pass now. Do not
      change ${src_path}.
- state_id: reshape
  name: Reshape
  description: Refactor and prove nothing broke
  max_iterations: 3
  system_prompt: |
    Now move the code toward the target, following the steps in the plan. The pinned tests are the contract: change
    the code until they pass, never the tests until the code passes. If an invariant turns out wrong, stop and say so
    instead of rewriting its test.
  sub_states:
  - id: refactor
    type: execute
    name: Refactor
    description: |
      Restructure ${src_path} as planned in ${notes_dir}/refactor.md. Keep public behaviour identical, keep ${test_cmd}
      green after each move and keep ${lint_cmd} clean.
  - id: prove
    type: review
    name: Prove the invariants
    description: |
      Read the plan, the pinned tests and the refactored code, then write ${notes_dir}/refactor-review.md: one line
      per invariant naming its id, whether it still holds and the test that shows it, then the steps from the plan
      that were done, changed or dropped, and why.
  - id: checklist
    type: checklist
    name: Refactor gate
    description: The refactor is done only when everything still passes
    criteria:
    - suite_green
    - lint_clean
criteria_map:
  per_criterion:
    suite_green: ${test_cmd}
    lint_clean: ${lint_cmd}
  per_sub:
    understand.map:
    - id: plan-has-its-sections
      assert: the plan has Today, Target, Steps and Invariants sections
      cmd: for section in Today Target Steps Invariants; do grep -q "^## $section" ${notes_dir}/refactor.md || exit 1;
        done
    - id: three-invariants
      assert: the plan lists at least three numbered invariants
      cmd: test "$(grep -cE '^INV[0-9]+:' ${notes_dir}/refactor.md)" -ge 3
    - id: plan-is-grounded
      context:
      - ${notes_dir}/refactor.md
      judge: Is this plan grounded in the actual code — does it name real files and functions, describe a concrete
        target shape and list invariants a test can check? FAIL if any section is generic enough to fit any codebase,
        if an invariant is not observable behaviour, or if a step is too large to review on its own.
      blocking: true
    understand.pin:
    - id: tests-added
      assert: characterization tests were added or changed
      cmd: git diff --name-only ${base_ref} -- ${test_path} | grep -q . || git ls-files --others --exclude-standard
        -- ${test_path} | grep -q .
    - id: source-untouched
      assert: no source file changed while pinning
      cmd: test -z "$(git diff --name-only ${base_ref} -- ${src_path})" && test -z "$(git ls-files --others
        --exclude-standard -- ${src_path})"
    - id: pins-pass-today
      assert: the suite passes against today's code
      cmd: ${test_cmd}
    - id: every-invariant-pinned
      assert: every invariant id from the plan appears in the tests
      cmd: ids=$(grep -oE '^INV[0-9]+' ${notes_dir}/refactor.md) || exit 1; for id in $ids; do grep -rqw "$id" ${test_path} || { echo "$id
        is not pinned"; exit 1; }; done
    reshape.refactor:
    - id: source-changed
      assert: the source paths were changed
      cmd: git diff --name-only ${base_ref} -- ${src_path} | grep -q . || git ls-files --others --exclude-standard
        -- ${src_path} | grep -q .
    - id: suite-is-green
      assert: the pinned tests and the rest of the suite pass
      cmd: ${test_cmd}
    - id: lint-is-clean
      assert: the linter passes
      cmd: ${lint_cmd}
    - id: no-test-deleted
      assert: no test file was deleted
      cmd: '! git diff --diff-filter=D --name-only ${base_ref} -- ${test_path} | grep -q .'
    - id: behaviour-preserved
      context:
      - ${notes_dir}/refactor.md
      judge: Does this change restructure the code toward the plan's target while keeping behaviour identical? FAIL if
        it edits, weakens or skips a pinned test, changes a public signature or output the invariants cover, or adds
        behaviour the plan does not mention.
      diff: true
      blocking: true
    reshape.prove:
    - id: every-invariant-reviewed
      assert: the review names every invariant id from the plan
      cmd: ids=$(grep -oE '^INV[0-9]+' ${notes_dir}/refactor.md) || exit 1; for id in $ids; do grep -qw "$id" ${notes_dir}/refactor-review.md
        || { echo "$id is not reviewed"; exit 1; }; done
    - id: review-is-substantive
      assert: the review carries at least 80 words
      cmd: test "$(wc -w < ${notes_dir}/refactor-review.md)" -ge 80
    - id: review-is-honest
      context:
      - ${notes_dir}/refactor.md
      - ${notes_dir}/refactor-review.md
      judge: Does this review check each invariant against a named test and account for every planned step? FAIL if it
        marks an invariant as holding without naming the test that shows it, skips a step from the plan, or claims
        something the code does not show.
      blocking: true
