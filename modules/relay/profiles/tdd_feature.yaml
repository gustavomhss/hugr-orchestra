name: tdd_feature
version: 1.0.0
description: TDD feature workflow that injects reusable library skills/protocols
protected: false
created_at: '2026-08-09T00:00:00Z'
settings:
  oscillation_detection_threshold: 3
  auto_loop_on_checklist_failure: true
pipeline:
- state_id: implement
  name: Implement (TDD)
  description: Build the feature test-first
  max_iterations: 3
  sub_states:
  - id: inject_context
    type: inject
    name: Inject context
    description: Seed the task context
    inject:
      context: 'Task: add a token-bucket rate limiter to the gateway.'
  - id: write
    type: execute
    name: Write code (TDD)
    description: Implement using the TDD skill
    inject:
      prompt: Implement the task.
      skill: tdd
  - id: checklist
    type: checklist
    name: Implement gate
    description: Exit criteria for implementation
    criteria:
    - tests_written
    - implementation_done
    - suite_green
- state_id: review
  name: Review
  description: Self-review the change
  max_iterations: 2
  sub_states:
  - id: self_review
    type: review
    name: Self review
    description: Review using the code-review protocol
    inject:
      protocol: code_review
  - id: checklist
    type: checklist
    name: Review gate
    description: Exit criteria for review
    criteria:
    - review_done
criteria_map:
  per_criterion:
    tests_written: git diff --name-only ${base_ref} -- ${test_path} | grep -q . || git ls-files --others --exclude-standard
      -- ${test_path} | grep -q .
    implementation_done: git diff --name-only ${base_ref} -- ${src_path} | grep -q . || git ls-files --others --exclude-standard
      -- ${src_path} | grep -q .
    suite_green: ${test_cmd}
    review_done: test -s ${review_artifact}
  per_sub:
    implement.write:
    - id: write-produced-a-change
      assert: this state changed something under the declared source or test paths
      cmd: git diff --name-only ${base_ref} -- ${src_path} ${test_path} | grep -q . || git ls-files --others --exclude-standard
        -- ${src_path} ${test_path} | grep -q .
    review.self_review:
    - id: review-is-substantive
      assert: the review artifact carries at least 50 words
      cmd: test "$(wc -w < ${review_artifact})" -ge 50
    - id: review-engages-with-the-diff
      context:
      - ${review_artifact}
      judge: Does this review describe the specific change in the diff — the functions, behaviours and edge cases
        it introduces — and raise concrete concerns about it? FAIL if it approves or rejects without naming specific
        items from the diff, if it makes a claim the diff does not support, if it is generic enough to apply to
        any artifact of this kind, or if it leaves part of the diff unjudged.
      diff: true
      blocking: true
