id = "rs-dbg-macro"
group = "leftovers"
severity = "gate"
on = "added-lines"
paths = ["**/*.rs"]
exclude = []
skip_comments = ["//", "#"]
match = '(?:\bdbg!\()'
message = "dbg! prints to stderr and is for local debugging. Remove it, or use tracing."
positive = ['    dbg!(&value);', 'let x = dbg!(a + b);']
negative = ['// dbg!(x) was here', 'let dbg = true;', 'debug!("x")']
