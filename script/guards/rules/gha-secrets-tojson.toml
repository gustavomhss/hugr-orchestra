id = "gha-secrets-tojson"
severity = "gate"
on = "added-lines"
paths = [".github/workflows/**/*.{yml,yaml}", ".github/actions/**/*.{yml,yaml}"]
exclude = []
match = 'toJSON\(\s*secrets\s*\)'
message = "toJSON(secrets) puts every secret in one expression and defeats per-secret masking. Reference the single secret you need."
positive = ['env: ${{ toJSON(secrets) }}', 'x: ${{ toJSON( secrets ) }}']
negative = ['x: ${{ toJSON(github.event) }}', 'x: ${{ secrets.TOKEN }}']
