id = "test-file-deleted"
group = "tests"
severity = "warn"
on = "changed-paths"
paths = ["$js_tests", "$py_tests", "$rs_tests"]
exclude = []
# Warn, not gate: 21 of the last 600 dev commits delete a test file, almost all with the code under test. A rename that stays inside the test globs is a move and does not fire; one that leaves them (a test renamed to src/foo.ts) is a deletion and does.
statuses = ["D", "R"]
leaves_scope = true
message = "Test file deleted. If the code under test is gone, an approver clears it with the label guardrail-approved:test-file-deleted; otherwise restore the test."
positive = ["packages/server/test/lsp-http.test.ts", "tests/test_session.py", "crates/a/tests/contract.rs", "apps/x/src/a.spec.tsx"]
negative = ["packages/server/src/lsp.ts", "docs/testing.md", "scripts/test-runner.sh"]
