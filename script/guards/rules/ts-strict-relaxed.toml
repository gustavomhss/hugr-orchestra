id = "ts-strict-relaxed"
severity = "gate"
on = "added-lines"
paths = ["**/tsconfig*.json"]
exclude = ["**/node_modules/**"]
# Opt-in flags (noUncheckedIndexedAccess is off in 21 packages here) are not listed. Turning a default-on strictness flag off makes every type error in the package disappear at once.
match = '''"(strict|noImplicitAny|strictNullChecks|strictFunctionTypes|noImplicitThis)"\s*:\s*false'''
message = "TypeScript strictness flag turned off. Fix the type errors; do not disable the check for the package."
positive = ['    "strict": false,', '"noImplicitAny": false', '    "strictNullChecks": false']
negative = ['    "strict": true,', '"skipLibCheck": true', '"noUnusedLocals": false']
