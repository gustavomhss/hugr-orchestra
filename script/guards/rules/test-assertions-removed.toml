id = "test-assertions-removed"
severity = "warn"
on = "line-balance"
paths = ["**/*.test.{ts,tsx,js,jsx,mjs}", "**/*.spec.{ts,tsx,js,jsx,mjs}", "**/test/**/*.{ts,tsx,js,jsx,mjs}", "**/test_*.py", "**/*_test.py", "**/tests/**/*.py", "**/test/**/*.py", "**/tests/**/*.rs", "**/*_test.rs", "**/*_tests.rs"]
exclude = []
# Three or more assertions net removed from one test file. Often a deliberate removal of dead behavior (real history: removing a protocol), so a warning; it is the signal an agent weakening a test leaves. Moved lines and deleted files do not count.
match = '^(?!\s*(//|#)).*(\bexpect\(|\bassert(_\w+)?[!(\s]|\bself\.assert\w+\()'
min_net_removed = 3
message = "This change removes assertions from a test file. Check that the behavior they pinned is really gone."
positive = ['expect(a).toBe(1)', '    assert x == 1', 'assert_eq!(a, b);', 'self.assertEqual(a, b)']
negative = ['const expected = 1', '// assert that later', '# assert x', 'test("asserts nothing", () => {})']
