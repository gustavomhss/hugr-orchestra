id = "test-timeout-raised"
group = "tests"
severity = "warn"
on = "added-lines"
paths = ["$js_tests", "$py_tests"]
exclude = []
skip_comments = ["//", "#"]
# A slow test made to pass by waiting longer hides the slowness. 10 seconds and up is the signal.
match = '''(setDefaultTimeout|setTimeout)\(\s*\d[\d_]{4,}\b|\{\s*timeout:\s*\d[\d_]{4,}\s*\}|@pytest\.mark\.timeout\(\s*\d{3,}'''
message = "Test timeout raised to 10s or more. Find out why it is slow instead of waiting longer."
positive = ['setDefaultTimeout(30_000)', '  test("slow", async () => {}, { timeout: 60000 })', '@pytest.mark.timeout(300)']
negative = ['setDefaultTimeout(5000)', 'test("x", () => {}, { timeout: 1000 })', 'await new Promise((r) => setTimeout(r, 50))']
