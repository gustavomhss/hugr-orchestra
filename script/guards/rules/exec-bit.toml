id = "exec-bit"
group = "hygiene"
severity = "warn"
on = "changed-paths"
paths = ["**"]
exclude = ["node_modules/**", "**/node_modules/**"]
modes = ["100755"]
binary = false
no_shebang = true
# Decided by the file's first line, not its extension: a .ts entry that starts with #! is a script and may be executable.
message = "Executable bit set on a text file with no #! line. Run chmod -x, or add the interpreter line if it is a script."
positive = ["docs/readme.md", "src/index.ts"]
negative = ["node_modules/pkg/bin.js"]
