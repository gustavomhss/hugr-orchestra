id = "dep-lifecycle-script"
group = "dependencies"
severity = "gate"
on = "added-lines"
paths = ["**/package.json"]
exclude = ["**/node_modules/**"]
# preinstall, install and postinstall run on every machine that installs the package. prepare (husky) is left out.
match = '^\s*"(preinstall|install|postinstall)"\s*:'
message = "Install-time script added. It runs code on every machine that installs this package; do the work in an explicit build step instead."
summary = "Install scripts run automatically on every machine that installs the package, which is a common way for malicious or broken code to spread. Move the work into an explicit build step that people run on purpose."
positive = ['    "postinstall": "node scripts/setup.js"', '"preinstall": "x"', '  "install": "node-gyp rebuild"']
negative = ['    "prepare": "husky"', '    "install-deps": "bun install"', '    "build": "bun run postinstall-check"']
