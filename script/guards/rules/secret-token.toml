id = "secret-token"
group = "secrets"
severity = "gate"
on = "added-lines"
paths = ["**"]
# Secret-scrubbing tests and the HTTP recorder carry key-shaped fixtures on purpose. AWS's documented AKIAIOSFODNN7EXAMPLE is skipped.
exclude = ["**/*.lock", "**/bun.lock", "modules/atlas/packages/persist/**", "modules/atlas/packages/adapter-io/test/**", "tooling/http-recorder/test/**"]
# Well-known credential prefixes with their exact shape (AWS access key, GitHub, Anthropic, OpenAI project, Slack, Google, GitLab). Gitleaks-style prefixes, not entropy: a hit is a real key or a key-shaped fixture.
match = '''\b(AKIA(?!IOSFODNN7EXAMPLE)[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|sk-ant-[A-Za-z0-9_-]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|xox[bp]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{35}|glpat-[A-Za-z0-9_-]{20,})'''
message = "Credential-shaped token. Remove it, rotate it if it was real, and read it from the environment instead."
positive = ['aws_access_key_id = AKIAABCDEFGHIJKLMNOP', 'token: ghp_aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789', 'ANTHROPIC_API_KEY=sk-ant-api03-abcdefghijklmnopqrstuvwxyz', 'SLACK=xoxb-123456789012-abcdefghij']
negative = ['const key = process.env.ANTHROPIC_API_KEY', 'sk-ant- is the prefix', 'ghp_ prefix is documented', 'const AKIA = 1', 'aws_access_key_id = AKIAIOSFODNN7EXAMPLE']
