id = "large-file"
severity = "warn"
on = "changed-paths"
paths = ["**"]
exclude = ["**/*.{jpg,jpeg,png,webp,gif,mp4,mov,woff,woff2,ttf,otf,ico,icns,pdf}", "**/public/**", "**/assets/**"]
statuses = ["A"]
min_bytes = 1000000
# Warn, not gate: real history has intended large files (a 1.7 MB mock-data file, a 1.1 MB schema).
message = "Large file added (over 1 MB). Check it belongs in git; generated data and media usually do not."
positive = ["specs/mock/data-real.js", "schema/tui.json"]
negative = ["packages/app-shell/public/wallpapers/a.jpg"]
