id = "gha-secrets-inherit"
severity = "warn"
on = "added-lines"
paths = [".github/workflows/**/*.{yml,yaml}", ".github/actions/**/*.{yml,yaml}"]
exclude = []
match = '^\s*secrets:\s*inherit\b'
message = "secrets: inherit hands every secret to the called workflow. Pass only the ones it needs."
positive = ['    secrets: inherit']
negative = ['    secrets:', '      token: ${{ secrets.TOKEN }}']
