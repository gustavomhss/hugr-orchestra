id = "rs-unwrap-added"
severity = "warn"
on = "added-lines"
paths = ["**/*.rs"]
exclude = ["**/tests/**", "**/test/**", "**/benches/**", "**/examples/**", "**/*_test.rs", "**/*_tests.rs"]
# Inline #[cfg(test)] modules cannot be told apart by a line rule, which is why this is a warning.
match = '\.unwrap\(\)|\.expect\('
message = "unwrap/expect panics on error. Return the error, or use expect only where the failure is a bug and the message says why."
positive = ['let v = map.get(&k).unwrap();', '    file.read_to_string(&mut s).expect("read")']
negative = ['let v = map.get(&k)?;', 'let v = x.unwrap_or_default();', '// do not unwrap here']
