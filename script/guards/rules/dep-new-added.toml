id = "dep-new-added"
group = "dependencies"
severity = "warn"
on = "added-lines"
paths = ["**/package.json"]
exclude = ["**/node_modules/**"]
new_only = true
# The first group is the package name. A bump removes the line with the same name, so only a package that was not there
# before is reported. A model that cannot find a function often invents a package for it, and the name may be taken by a squatter.
match = '''^\s*"((?!version"|name"|packageManager"|node"|bun"|npm"|private"|type"|main"|module")@?[a-z0-9][\w./-]*)":\s*"(\^|~|>=?|<|workspace:|catalog:|npm:|\d)[^"]*",?\s*$'''
message = "New dependency. Check that the package exists, is the one you mean (not a look-alike name), and is needed; then say why in the PR."
positive = ['    "left-pad": "^1.3.0",', '    "@scope/pkg": "workspace:*"', '    "zod": "catalog:",']
negative = ['  "version": "1.2.3",', '    "build": "bun run x"', '  "name": "@orchestra/core",', '    "exports": {']
