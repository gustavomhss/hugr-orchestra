id = "lint-disable"
group = "silenced"
severity = "gate"
on = "added-lines"
paths = ["**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"]
exclude = []
# eslint-disable* needs `-- reason`; biome-ignore needs `: reason`. A bare directive hides the rule it silences.
match = 'eslint-disable(-next-line|-line)?\b(?!.*--\s*\S)|biome-ignore\b(?!.*:\s*\S)'
message = "Lint suppression without a reason. Add the reason after the directive (eslint: `-- why`, biome: `: why`) or fix the code."
summary = "Turning off a lint rule without saying why leaves reviewers unable to judge whether it was safe. Fix the code, or write the reason next to the directive."
positive = ["// eslint-disable-next-line no-console", "/* eslint-disable */", "// biome-ignore lint/suspicious/noExplicitAny", "foo() // eslint-disable-line"]
negative = ["// eslint-disable-next-line no-console -- CLI prints by design", "// biome-ignore lint/suspicious/noExplicitAny: wire type is untyped", "const rule = \"eslint\"", "// we no longer disable lint here"]
