id = "client-env-secret"
group = "secrets"
severity = "gate"
on = "added-lines"
paths = ["**"]
exclude = ["**/*.{png,jpg,jpeg,gif,webp,ico,icns,woff,woff2,ttf,zip,tgz,gz,lock}"]
# A variable with a browser-exposed prefix is shipped to every visitor. Public-by-design names (anon, publishable, public key) are skipped.
match = '\b(NEXT_PUBLIC|VITE|EXPO_PUBLIC|REACT_APP|NUXT_PUBLIC|PUBLIC)_(?!\w*(PUBLIC|PUBLISHABLE|ANON))\w*(SECRET|TOKEN|PASSWORD|PRIVATE|API_KEY|SERVICE_ROLE)\w*'
message = "Secret behind a browser-exposed env prefix: it ends up in the client bundle. Read it on the server instead."
positive = ['NEXT_PUBLIC_STRIPE_SECRET=sk', 'VITE_API_TOKEN=abc', 'const k = import.meta.env.VITE_SERVICE_ROLE_KEY', 'EXPO_PUBLIC_OPENAI_API_KEY=x']
negative = ['NEXT_PUBLIC_SUPABASE_ANON_KEY=x', 'VITE_STRIPE_PUBLISHABLE_KEY=pk', 'NEXT_PUBLIC_API_URL=https://x', 'API_TOKEN=abc']
