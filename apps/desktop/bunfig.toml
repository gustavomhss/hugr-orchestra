[test]
# Tests run on GitHub Actions; see AGENTS.md (Testing).
preload = ["../../script/test-guard.ts", "../../script/test-omni-control.ts"]
pathIgnorePatterns = [
  # Standalone App Dock harnesses: they register no bun tests, and importing one bundles and launches a real
  # Electron and sets process.exitCode. They run with `bun run <file>` (package.json test:app-dock:*).
  # The security, rpc and tools harnesses run in CI: the native workflow's app-dock job (.github/workflows/native.yml)
  # runs them under xvfb-run. live and youtube need a model and the internet, so they stay manual.
  "src/main/app-dock-live.test.ts",
  "src/main/app-dock-rpc.test.ts",
  "src/main/app-dock-security.test.ts",
  "src/main/app-dock-tools.test.ts",
  "src/main/app-dock-youtube.test.ts",
  # node:sqlite exists in Node and Electron, not in Bun; package.json test runs these with node --test.
  "src/**/*.node.test.ts",
]
